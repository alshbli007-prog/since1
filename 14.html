        // --- Web Audio Synthesizer for Immersive Sound Effects ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, gainVal = 0.1) {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            start() { this.playTone(440, 'sine', 0.5, 0.2); }
            step() { this.playTone(150, 'triangle', 0.1, 0.1); }
            correct() { 
                this.playTone(523.25, 'sine', 0.15, 0.2);
                setTimeout(() => this.playTone(659.25, 'sine', 0.15, 0.2), 150);
                setTimeout(() => this.playTone(783.99, 'sine', 0.3, 0.25), 300);
            }
            wrong() {
                this.playTone(200, 'sawtooth', 0.25, 0.2);
                setTimeout(() => this.playTone(150, 'sawtooth', 0.3, 0.2), 200);
            }
            star() { this.playTone(880, 'sine', 0.4, 0.15); }
            gate() { this.playTone(330, 'square', 0.4, 0.15); }
            win() {
                const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5];
                notes.forEach((n, i) => {
                    setTimeout(() => this.playTone(n, 'triangle', 0.2, 0.2), i * 120);
                });
            }
        }

        function updateTeamsCount(val) {
            gameState.teamsCount = parseInt(val);
            // Save current inputs if any
            const inputs = document.querySelectorAll('.team-name-input');
            gameState.teams = [];
            inputs.forEach((inp, idx) => {
                gameState.teams[idx] = { name: inp.value.trim() || `فريق ${idx+1}`, score: 0, stars: 0 };
            });
            render();
        }

        function startRaceGame() {
            if (gameState.mode === 'solo') {
                const input = document.getElementById('player-name-input');
                gameState.playerName = input ? input.value.trim() || 'الباحث العلمي' : 'الباحث العلمي';
            } else {
                const inputs = document.querySelectorAll('.team-name-input');
                gameState.teams = [];
                if (inputs.length > 0) {
                    inputs.forEach((inp, idx) => {
                        gameState.teams.push({
                            name: inp.value.trim() || `فريق ${idx+1}`,
                            score: 0,
                            stars: 0
                        });
                    });
                } else {
                    for (let i = 0; i < gameState.teamsCount; i++) {
                        gameState.teams.push({ name: `فريق ${i+1}`, score: 0, stars: 0 });
                    }
                }
                gameState.currentTeamIndex = 0;
            }

            const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
            gameState.selectedQuestions = shuffled.slice(0, 10);
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.stars = 0;
            gameState.correctCount = 0;
            gameState.wrongCount = 0;
            gameState.unansweredCount = 0;
            gameState.robotPosition = 0;
            gameState.historyLog = [];
            
            gameState.screen = 'THINKING';
            render();
        }

                activeHeaderInfo = `
                    <div class="px-4 py-2 bg-emerald-950/80 border border-emerald-500/50 rounded-xl flex items-center gap-3">
                        <span class="text-xl">👤</span>
                        <span class="text-sm font-bold text-emerald-300">الباحث: <span class="text-white">${gameState.playerName}</span></span>

                            </div>
                            <div class="flex items-center gap-1 text-emerald-400 font-bold">
                                <span>🏆</span> <span>${gameState.score} نقطة</span>
                            </div>
                        </div>
                    </div>

                    <!-- 3D Track & Robot Race Arena -->
                    <div class="glass-panel p-4 rounded-2xl relative overflow-hidden flex flex-col justify-center border border-slate-700">
                        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-900/40 to-slate-950 pointer-events-none"></div>
                        
                        <div class="text-xs text-slate-400 font-semibold mb-2 flex justify-between items-center z-10 px-2">
                            <span>🏁 خط البداية</span>
                            <span class="text-emerald-400">🤖 الروبوت التعليمي</span>

                        <div class="relative py-3 flex flex-col gap-3 z-10">
                            <div class="h-6 bg-slate-800/80 rounded-lg border border-slate-700/60 relative flex items-center px-2">
                                <span class="text-[10px] text-slate-400">مسار أ</span>
                            </div>
                            <div class="h-6 bg-slate-800/80 rounded-lg border border-slate-700/60 relative flex items-center px-2">
                                <span class="text-[10px] text-slate-400">مسار ب</span>
                            </div>

                    <!-- Question & Interactive Gates Area -->

                            <div class="mb-4">
                                ${getQuestionIllustration(q.imgType)}
                            </div>

                            <h3 class="text-lg md:text-xl font-bold text-slate-100 mb-6 leading-relaxed text-right whitespace-pre-line">

                                    const gateLetter = ['أ', 'ب', 'ج'][idx];
                                    const isSelected = gameState.selectedOptionId === opt.id;
                                    const isFeedbackActive = gameState.screen === 'FEEDBACK';
                                    let borderColor = 'border-slate-700 hover:border-emerald-500';
                                    let bgColor = 'bg-slate-800/90';

                                    if (isSelected) {
                                        borderColor = 'border-amber-400 glow-active';
                                        bgColor = 'bg-amber-950/40';
                                    }

                                    if (isFeedbackActive) {
                                        if (opt.isCorrect) {
                                            borderColor = 'border-emerald-500 glow-active';
                                            bgColor = 'bg-emerald-950/60';
                                        } else if (isSelected && !opt.isCorrect) {
                                            borderColor = 'border-rose-500';
                                            bgColor = 'bg-rose-950/60';
                                        }
                                    }

                                    return `
                                        <div onclick="selectOption('${opt.id}')" 
                                             class="gate-card glass-panel p-5 rounded-2xl border-2 ${borderColor} ${bgColor} cursor-pointer flex flex-col items-center text-center relative transition-all">
                                            <div class="w-12 h-12 rounded-full bg-slate-700/80 border border-slate-600 flex items-center justify-center text-xl font-black text-emerald-400 mb-3 shadow-inner">

                                            </div>

                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Feedback Box -->
                        ${gameState.screen === 'FEEDBACK' ? `
                            <div class="mt-4 p-4 rounded-2xl border ${gameState.lastCorrect ? 'bg-emerald-950/80 border-emerald-500/60' : 'bg-rose-950/80 border-rose-500/60'} animate-fade-in">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xl">${gameState.lastCorrect ? '🎉 أحسنت!' : '❌ إجابة غير صحيحة'}</span>
                                    <span class="text-sm font-bold ${gameState.lastCorrect ? 'text-emerald-300' : 'text-rose-300'}">
                                        ${gameState.lastCorrect ? '+100 نقطة ⭐ +1 نجمة' : '0 نقطة (لم تحسر نقاطك السابقة)'}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-200 mt-2 font-medium leading-relaxed">
                                    <strong class="text-amber-300">لماذا؟</strong> ${q.explanation}
                                </p>
                            </div>
                        ` : ''}
                    </div>

                </div>
            `;
        }

        function selectOption(optId) {
            if (gameState.screen !== 'THINKING' && gameState.screen !== 'ANSWER_SELECTED') return;
            sound.gate();
            gameState.selectedOptionId = optId;
            gameState.screen = 'ANSWER_SELECTED';
            render();
        }

        function confirmAnswer() {
            if (!gameState.selectedOptionId || (gameState.screen !== 'THINKING' && gameState.screen !== 'ANSWER_SELECTED')) return;
            
            const q = gameState.selectedQuestions[gameState.currentIndex];
            const selectedOpt = q.options.find(o => o.id === gameState.selectedOptionId);
            const isCorrect = selectedOpt ? selectedOpt.isCorrect : false;

            gameState.lastCorrect = isCorrect;
            gameState.screen = 'MOVING_TO_GATE';
            render();

            sound.step();
            const targetPos = ((gameState.currentIndex + 1) / 10) * 85;
            gameState.robotPosition = targetPos;
            render();

            setTimeout(() => {
                sound.gate();
                if (isCorrect) {
                    sound.correct();
                    sound.star();
                    gameState.score += 100;
                    gameState.stars += 1;
                    gameState.correctCount += 1;
                    if (gameState.mode === 'team') {
                        gameState.teams[gameState.currentTeamIndex].score += 100;
                        gameState.teams[gameState.currentTeamIndex].stars += 1;
                    }
                } else {
                    sound.wrong();
                    gameState.wrongCount += 1;
                }

                gameState.historyLog.push({
                    question: q.question,
                    studentAnswer: selectedOpt ? selectedOpt.text : 'لم يجب',
                    correctAnswer: q.options.find(o => o.isCorrect).text,
                    isCorrect: isCorrect,
                    explanation: q.explanation,
                    concept: q.concept
                });

                gameState.screen = 'FEEDBACK';
                render();
            }, 1200);
        }

        function nextQuestion() {
            gameState.currentIndex++;
            gameState.selectedOptionId = null;

            if (gameState.currentIndex >= 10) {
                sound.win();
                gameState.screen = 'FINISHED';
                render();
            } else {
                if (gameState.mode === 'team') {
                    gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
                }
                gameState.screen = 'THINKING';
                render();
            }
        }

        // --- Screen 5: Finished Screen ---
        function renderFinishedScreen(container) {
            const totalScore = gameState.score;
            const percentage = (gameState.correctCount / 10) * 100;
            
            let rankTitle = '🌱 واصل الاستكشاف';
            let rankColor = 'text-amber-400';
            if (percentage >= 90) { rankTitle = '🏆 عبقري التبخر'; rankColor = 'text-emerald-400'; }
            else if (percentage >= 80) { rankTitle = '🥇 خبير التبخر'; rankColor = 'text-sky-400'; }
            else if (percentage >= 70) { rankTitle = '🥈 مستكشف علمي'; rankColor = 'text-blue-400'; }
            else if (percentage >= 60) { rankTitle = '🥉 باحث واعد'; rankColor = 'text-teal-400'; }

            let teamResultsHtml = '';
            if (gameState.mode === 'team') {
                teamResultsHtml = `
                    <div class="w-full bg-slate-900/60 p-4 rounded-2xl border border-slate-700 mb-6">
                        <h4 class="text-sm font-bold text-sky-300 mb-3 text-center">نتائج الفرق المتنافسة</h4>
                        <div class="space-y-2">
                            ${gameState.teams.map((t, idx) => `
                                <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded-xl">
                                    <span class="font-bold text-white">فريق ${idx+1}: ${t.name}</span>
                                    <div class="flex gap-4 text-sm">
                                        <span class="text-amber-400">⭐ ${t.stars}</span>
                                        <span class="text-emerald-400 font-bold">${t.score} نقطة</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 glass-panel rounded-3xl my-auto max-w-2xl mx-auto w-full text-center">
                    <div class="w-20 h-20 bg-emerald-500/20 rounded-full flex items-center justify-center border-2 border-emerald-400 mb-4 mx-auto animate-bounce">
                        <span class="text-4xl">🎉</span>
                    </div>
                    <h2 class="text-3xl font-black text-white mb-2">اكتمل سباق التبخر العلمي بنجاح!</h2>
                    <p class="text-slate-300 text-sm mb-6">
                        ${gameState.mode === 'solo' ? `الباحث المميز: <strong class="text-emerald-400">${gameState.playerName}</strong>` : 'انتهت منافسات الفرق بنجاح'}
                    </p>

                    ${teamResultsHtml}

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full mb-6">
                        <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400 block mb-1">النقاط الكلية</span>
                            <span class="text-2xl font-black text-emerald-400">${totalScore} / 1000</span>
                        </div>
                        <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400 block mb-1">الإجابات الصحيحة</span>
                            <span class="text-2xl font-black text-sky-400">${gameState.correctCount} / 10</span>
                        </div>
                        <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400 block mb-1">النجوم المكتسبة</span>
                            <span class="text-2xl font-black text-amber-400">⭐ ${gameState.stars}</span>
                        </div>
                        <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400 block mb-1">النسبة المئوية</span>
                            <span class="text-2xl font-black text-teal-400">${percentage}%</span>
                        </div>
                    </div>

                    <div class="p-4 bg-slate-900/80 border border-emerald-500/40 rounded-2xl w-full mb-6">
                        <span class="text-xs text-slate-400 block mb-1">الرتبة العلمية المستحقة</span>
                        <span class="text-2xl font-black ${rankColor}">${rankTitle}</span>
                    </div>

                    <div class="flex flex-wrap items-center justify-center gap-4 w-full">
                        <button onclick="sound.star(); gameState.screen='REVIEW'; render();" class="px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer">
                            <span>🔎</span> مراجعة السباق والأسئلة
                        </button>
                        <button onclick="sound.start(); startRaceGame();" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer">
                            <span>🔄</span> العب من جديد
                        </button>
                    </div>
                </div>
            `;
        }

        // --- Screen 6: Review Screen ---
        function renderReviewScreen(container) {
            container.innerHTML = `
                <div class="flex-1 flex flex-col p-6 glass-panel rounded-3xl my-auto max-w-4xl mx-auto w-full">
                    <div class="flex items-center justify-between mb-6 border-b border-slate-700 pb-4">
                        <h2 class="text-2xl font-black text-emerald-400">🔎 مراجعة السباق والإجابات العلمية</h2>
                        <button onclick="gameState.screen='FINISHED'; render();" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-bold rounded-xl cursor-pointer">
                            ← العودة للنتيجة
                        </button>
                    </div>

                    <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                        ${gameState.historyLog.map((item, idx) => `
                            <div class="p-4 rounded-2xl border ${item.isCorrect ? 'bg-emerald-950/30 border-emerald-500/40' : 'bg-rose-950/30 border-rose-500/40'} flex flex-col gap-2">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-bold text-slate-400">السؤال ${idx + 1} | المفهوم: <span class="text-sky-400">${item.concept}</span></span>
                                    <span class="text-sm font-bold ${item.isCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                                        ${item.isCorrect ? '✅ إجابة صحيحة' : '❌ إجابة غير صحيحة'}
                                    </span>
                                </div>
                                <p class="text-sm font-bold text-white">${item.question}</p>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs bg-slate-900/60 p-3 rounded-xl border border-slate-700">
                                    <div><span class="text-slate-400">إجابتك:</span> <strong class="${item.isCorrect ? 'text-emerald-300' : 'text-rose-300'}">${item.studentAnswer}</strong></div>
                                    <div><span class="text-slate-400">الإجابة الصحيحة:</span> <strong class="text-emerald-300">${item.correctAnswer}</strong></div>
                                </div>
                                <p class="text-xs text-slate-300 mt-1"><strong class="text-amber-300">لماذا؟</strong> ${item.explanation}</p>
                            </div>
                        `).join('')}
                    </div>

                    <div class="mt-6 text-center">
                        <button onclick="sound.start(); startRaceGame();" class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all cursor-pointer">
                            🔄 العب من جديد
                        </button>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
