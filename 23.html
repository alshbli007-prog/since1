<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق البوابات المعرفية - استقصاء التبخر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo & Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif'],
                    },
                    colors: {
                        sci: {
                            dark: '#030712',
                            card: '#0f172a',
                            border: '#1e293b',

                            neon: '#38bdf8',
                            purple: '#8b5cf6',

                }
            }

    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at 50% 20%, #0f172a 0%, #030712 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.35); }
            50% { box-shadow: 0 0 50px rgba(6, 182, 212, 0.75); }
        }
        .glow-box { animation: pulseGlow 4s infinite ease-in-out; }

        @keyframes floatRobot {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        .robot-idle { animation: floatRobot 3.5s ease-in-out infinite; }

        .glass-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }
        .glass-header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body class="flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

    <div id="app" class="flex-grow flex flex-col w-full max-w-7xl mx-auto p-3 sm:p-6 lg:p-8">
        
        <!-- HEADER / IDENTITY SCREEN (Only on Home / Main Screen) -->
        <header id="main-header" class="w-full mb-6 transition-all duration-500">
            <div class="glass-card rounded-3xl p-5 sm:p-8 flex flex-col lg:flex-row items-center justify-between gap-6 border-cyan-500/30 relative overflow-hidden">
                <div class="absolute -top-32 -right-32 w-80 h-80 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Oman & School Identity -->
                <div class="flex items-center gap-5 text-center lg:text-right flex-col lg:flex-row z-10">
                    <img src="https://www2.0zz0.com/2025/12/02/12/984978442.png" alt="شعار سلطنة عمان" class="w-16 h-16 sm:w-20 sm:h-20 object-contain drop-shadow-xl hover:scale-105 transition-transform">
                    <div>
                        <div class="text-xs sm:text-sm font-bold text-cyan-400 tracking-wider">سلطنة عمان</div>
                        <div class="text-xs sm:text-sm font-medium text-slate-300">وزارة التعليم</div>
                        <div class="text-xs font-medium text-slate-400 mt-0.5">المديرية العامة للتعليم بمحافظة شمال الباطنة</div>
                        <h1 class="text-base sm:text-xl font-black text-white mt-1">مدرسة محمد بن محبوب الرحيلي للتعليم الأساسي (5-10)</h1>
                    </div>
                </div>

                <!-- Teacher Info & Photo -->
                <div class="flex items-center gap-4 bg-slate-900/90 p-4 rounded-2xl border border-cyan-500/30 shadow-2xl z-10">
                    <img src="https://i.ibb.co/nNsB6p4G/IY4B8215.jpg" alt="أ. فيصل الشبلي" class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl object-cover object-top border-2 border-cyan-400 shadow-md flex-shrink-0">
                    <div class="text-right">
                        <div class="text-sm sm:text-base font-bold text-cyan-300">أ. فيصل الشبلي</div>
                        <div class="text-xs text-slate-300 font-mono mt-0.5 flex items-center gap-1">📱 99812126</div>
                        <div class="text-xs text-slate-300 font-mono mt-0.5 flex items-center gap-1.5"><i class="fa-brands fa-instagram text-pink-400 text-sm"></i> <span>faalll8</span></div>
                        <div class="text-[11px] text-slate-400 mt-1">مدير المدرسة: أ. سعود الشيزاوي</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dynamic Game View Container -->
        <main id="game-view" class="flex-grow flex flex-col items-center justify-center relative w-full">
            <!-- App views injected here -->
        </main>

        <!-- Footer Control Bar -->
        <footer class="w-full mt-6 py-4 border-t border-slate-800/80 flex flex-wrap items-center justify-between text-xs sm:text-sm text-slate-400 gap-4">
            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1.5 font-semibold text-cyan-300"><i class="fa-solid fa-flask-vial text-cyan-400"></i> مادة العلوم - الصف الخامس</span>
                <span class="hidden sm:inline text-slate-600">|</span>
                <span class="hidden sm:inline">استقصاء التبخر</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleAudio()" id="audio-toggle-btn" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-volume-high text-cyan-400" id="audio-icon"></i> <span id="audio-text">الصوت: مفعل</span>
                </button>
                <button onclick="toggleMotion()" id="motion-toggle-btn" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-person-running text-cyan-400" id="motion-icon"></i> <span id="motion-text">الحركة: طبيعية</span>
                </button>
            </div>
        </footer>

    </div>

    <script>
        /* ==========================================
           1. WEB AUDIO SYNTHESIZER
           ========================================== */
        let audioEnabled = true;
        let reducedMotion = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type, duration, delay = 0) {
            if (!audioEnabled) return;
            try {
                initAudio();
                setTimeout(() => {
                    if (!audioCtx) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                }, delay);
            } catch (e) {}
        }

        const soundEffects = {
            click: () => playTone(659.25, 'sine', 0.08),
            confirm: () => { playTone(523.25, 'triangle', 0.1); playTone(783.99, 'triangle', 0.12, 80); },
            correct: () => { playTone(523.25, 'sine', 0.1); playTone(659.25, 'sine', 0.1); playTone(1046.50, 'sine', 0.25, 120); },
            incorrect: () => { playTone(200, 'sawtooth', 0.2); playTone(160, 'sawtooth', 0.25, 100); },
            move: () => playTone(440, 'triangle', 0.4),
            arrive: () => { playTone(880, 'sine', 0.15); playTone(1318.51, 'sine', 0.3, 120); },
            win: () => {
                playTone(523.25, 'sine', 0.15);
                playTone(659.25, 'sine', 0.15, 150);
                playTone(783.99, 'sine', 0.15, 300);
                playTone(1046.50, 'sine', 0.5, 450);
            }
        };

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('audio-icon').className = audioEnabled ? "fa-solid fa-volume-high text-cyan-400" : "fa-solid fa-volume-xmark text-red-400";
            document.getElementById('audio-text').innerText = audioEnabled ? "الصوت: مفعل" : "الصوت: مکتوم";
            soundEffects.click();
        }

        function toggleMotion() {
            reducedMotion = !reducedMotion;
            document.getElementById('motion-icon').className = reducedMotion ? "fa-solid fa-person text-amber-400" : "fa-solid fa-person-running text-cyan-400";
            document.getElementById('motion-text').innerText = reducedMotion ? "الحركة: مخفضة" : "الحركة: طبيعية";
            soundEffects.click();
        }

        /* ==========================================
           2. QUESTION BANK (Evaporation Investigation)
           ========================================== */
        const questionBank = [
            {
                id: 1,
                type: 'mcq',
                question: 'أي العوامل الآتية تؤدي زيادتها إلى تسريع وزيادة معدل تبخر الماء من السطح؟',
                options: [
                    { id: 'a', text: 'انخفاض درجات الحرارة' },
                    { id: 'b', text: 'زيادة سرعة الهواء (الرياح)' },
                    { id: 'c', text: 'تقليص وتضييق المساحة المكشوفة' },
                    { id: 'd', text: 'حجب أشعة الشمس كلياً' }
                ],
                correctId: 'b',
                why: 'كلما زادت سرعة الهواء المتحرك فوق سطح الماء، زادت سرعة هرب وتصاعد جزيئات الماء.'
            },
            {
                id: 2,
                type: 'true_false',
                question: 'العبارة العلمية: "كلما كانت المساحة المكشوفة للماء أكبر، زاد معدل التبخر وأصبح أسرع."',
                options: [
                    { id: 'true', text: 'صحيح' },
                    { id: 'false', text: 'خطأ' }
                ],
                correctId: 'true',
                why: 'صحيح تماماً؛ المساحة المكشوفة الأكبر تتيح لعدد أكبر من جزيئات السطح مغادرة الماء في نفس الوقت.'
            },
            {
                id: 3,
                type: 'table_analysis',
                question: 'أجرى طالب استقصاء لتبخر الماء في أوعية مختلفة لمدة يومين وسجل حجم الماء المتبقي:\n• مخبار مدرج ضيق: 30 مل\n• صينية واسعة: 0 مل\n• كأس زجاجي: 10 مل\n• دورق مخروطي: 45 مل\n\nأي وعاء تبخر منه أكبر حجم من الماء؟',
                options: [
                    { id: 'a', text: 'المخبار المدرج' },
                    { id: 'b', text: 'الصينية الواسعة' },
                    { id: 'c', text: 'الكأس الزجاجي' },
                    { id: 'd', text: 'الدورق المخروطي' }
                ],
                correctId: 'b',
                why: 'الصينية الواسعة تبقي 0 مل من الماء، مما يعني تبخر كامل كمية الماء فيها وهي الأكبر بين الأوعية.'
            },
            {
                id: 4,
                type: 'math_calc',
                question: 'بدأت تجربة بوضع 50 مل من الماء في وعاء واسع، وبعد فترة قياس وجدنا أن الماء المتبقي هو 30 مل. ما هو حجم الماء الذي تبخر فعلياً؟',
                options: [
                    { id: 'a', text: '10 مل' },
                    { id: 'b', text: '20 مل' },
                    { id: 'c', text: '30 مل' },
                    { id: 'd', text: '50 مل' }
                ],
                correctId: 'b',
                why: 'حجم الماء المتبخر = الحجم الابتدائي (50 مل) - حجم الماء المتبقي (30 مل) = 20 مل.'
            },
            {
                id: 5,
                type: 'visual_choice',
                question: 'تأمل الموقف التجريبي: وُضعت كمية متساوية من الماء (40 مل) في كأس ضيق وفي صينية عريضة في نفس الغرفة والشمس. أيهما يتوقع أن يجف تماماً أولاً؟',
                options: [
                    { id: 'a', text: 'الكأس الضيق' },
                    { id: 'b', text: 'الصينية العريضة بسبب مساحة السطح الأكبر' },
                    { id: 'c', text: 'كلاهما يجف في نفس اللحظة تماماً' },
                    { id: 'd', text: 'لا يحدث تبخر في أي منهما' }
                ],
                correctId: 'b',
                why: 'الصينية العريضة توفر مساحة مكشوفة أكبر لمعرض الهواء، مما يضاعف سرعة التبخر.'
            },
            {
                id: 6,
                type: 'inference',
                question: 'ما العلاقة العلمية الصحيحة بين "حجم الماء المتبخر" و"حجم الماء المتبقي" داخل الوعاء في الاستقصاء؟',
                options: [
                    { id: 'a', text: 'علاقة طردية (كلاهما يزدادان معاً)' },
                    { id: 'b', text: 'علاقة عكسية (كلما زاد المتبخر قل الماء المتبقي)' },
                    { id: 'c', text: 'لا توجد أي علاقة بينهما' },
                    { id: 'd', text: 'يتساوى الحجمان دائماً بنهاية الاستقصاء' }
                ],
                correctId: 'b',
                why: 'علاقة عكسية؛ الماء الذي يتبخر هو جزء من الماء الكلي، وكلما زاد المتبخر نقص المتبقي في الوعاء.'
            },
            {
                id: 7,
                type: 'chart_question',
                question: 'وُضع وعاء ماء تحت مروحة هواء نشطة ووعاء مماثل في غرفة مغلقة ساكنة الهواء. كيف تؤثر حركة الهواء (الرياح) على سرعة التبخر؟',
                options: [
                    { id: 'a', text: 'تبطئ التبخر تماماً' },
                    { id: 'b', text: 'تزيد وتسرع معدل التبخر بشكل ملحوظ' },
                    { id: 'c', text: 'لا توجد أي استجابة لحركة الهواء' },
                    { id: 'd', text: 'تحول الماء إلى ثلج فوري' }
                ],
                correctId: 'b',
                why: 'حركة الهواء المستمرة تزيل بخار الماء المشبع فوق سطح السائل وتفسح المجال لمزيد من التبخر السريع.'
            },
            {
                id: 8,
                type: 'matching',
                question: 'صل العوامل المؤثرة على التبخر بما يناسب تأثيرها العلمي في الاستقصاء (انقر على عنصر من اليمين ثم عنصر من اليسار للربط، ويمكنك إلغاء الربط بالنقر عليه):',
                isMatching: true,
                leftItems: [
                    { id: 'l1', text: 'زيادة درجة الحرارة' },
                    { id: 'l2', text: 'زيادة سرعة الرياح' },
                    { id: 'l3', text: 'زيادة المساحة المكشوفة' }
                ],
                rightItems: [
                    { id: 'r1', text: 'تعرض سطح أكبر لجزيئات الهواء' },
                    { id: 'r2', text: 'زيادة وتسريع معدل التبخر' },
                    { id: 'r3', text: 'إزالة بخار الماء المتراكم وسرعة التبخر' }
                ],
                correctPairs: { 'l1': 'r2', 'l2': 'r3', 'l3': 'r1' }
            },
            {
                id: 9,
                type: 'ordering',
                question: 'رتب الأوعية الآتية تصاعدياً (من الأقل إلى الأكثر) حسب حجم الماء المتبقي إذا بدأت بـ 100 مل وتعرضت للشمس:\n(1) صينية واسعة جداً\n(2) كأس زجاجي متوسط\n(3) مخبار مدرج ضيق',
                isOrdering: true,
                items: [
                    { id: 'o1', text: 'الصينية الواسعة جداً (أقل متبقي وأكثر تبخر)' },
                    { id: 'o2', text: 'الكأس الزجاجي المتوسط' },
                    { id: 'o3', text: 'المخبار المدرج الضيق (أكبر متبقي وأقل تبخر)' }
                ],
                correctOrder: ['o3', 'o2', 'o1'],
                why: 'المخبار الضيق يمتلك أقل مساحة فيبقي أكبر كمية ماء، بينما الصينية الواسعة تفقد معظم أو كل الماء.'
            },
            {
                id: 10,
                type: 'mcq',
                question: 'أراد أحمد تجفيف قطرة ماء على زجاجة بسرعة أكبر. أي الإجراءات التالية يمثل الطريقة العلمية المثلى؟',
                options: [
                    { id: 'a', text: 'وضع الزجاجة في ثلاجة مظلمة باردة' },
                    { id: 'b', text: 'تغطية القطرة بإحكام بغطاء زجاجي' },
                    { id: 'c', text: 'تعريضها لحرارة لطيفة مع تيار هواء متحرك' },
                    { id: 'd', text: 'حفظها في وعاء مغلق تماماً' }
                ],
                correctId: 'c',
                why: 'الحرارة وتيار الهواء معاً يوفران الظروف المثلى لمضاعفة سرعة تبخر قطرة الماء في أسرع وقت.'
            },
            {
                id: 11,
                type: 'true_false',
                question: 'العبارة العلمية: "درجة الحرارة المرتفعة تمنع تماماً تبخر الماء من الأوعية المكشوفة."',
                options: [
                    { id: 'true', text: 'صحيح' },
                    { id: 'false', text: 'خطأ' }
                ],
                correctId: 'false',
                why: 'خطأ؛ درجات الحرارة المرتفعة تنشط وتزيد حركة جزيئات الماء مما يعجل بعملية التبخر.'
            },
            {
                id: 12,
                type: 'math_calc',
                question: 'وعاء مختبر يحتوي على 80 مل من الماء. بعد يومين من الاستقصاء بقي في الوعاء 35 مل فقط. ما هو حجم الماء المتبخر؟',
                options: [
                    { id: 'a', text: '35 مل' },
                    { id: 'b', text: '45 مل' },
                    { id: 'c', text: '55 مل' },
                    { id: 'd', text: '80 مل' }
                ],
                correctId: 'b',
                why: 'حسابياً: 80 - 35 = 45 مل من الماء تحولت إلى بخار وتصاعدت في الغلاف الجوي.'
            }
        ];

        /* ==========================================
           3. GAME STATE MANAGEMENT
           ========================================== */
        let gameState = {
            screen: 'HOME', // HOME, MODE_SELECT, TEAM_SETUP, PLAYING, FINISHED, REVIEW
            gameMode: 'SOLO', // SOLO or TEAM
            teams: [],
            currentTeamIndex: 0,
            roundQuestions: [],
            currentQuestionIndex: 0,
            score: 0,
            stars: 0,
            correctCount: 0,
            incorrectCount: 0,
            unansweredCount: 0,
            timer: 30,
            timerInterval: null,
            timerActive: false,
            selectedOption: null,
            isConfirmed: false,
            robotPosition: 1, // 1: Start, 2: Mid, 3: Gate
            selectedLeftMatch: null,
            userMatches: {}, // { leftId: rightId }
            userOrder: [],
            questionHistory: []
        };

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /* ==========================================
           4. RENDER ENGINE & UI VIEWS
           ========================================== */
        function render() {
            const view = document.getElementById('game-view');
            const header = document.getElementById('main-header');
            
            // Show header only on HOME screen
            if (gameState.screen === 'HOME') {
                header.style.display = 'block';
            } else {
                header.style.display = 'none';
            }

            view.innerHTML = '';

            switch (gameState.screen) {
                case 'HOME':
                    renderHomeScreen(view);
                    break;
                case 'MODE_SELECT':
                    renderModeSelectScreen(view);
                    break;
                case 'TEAM_SETUP':
                    renderTeamSetupScreen(view);
                    break;
                case 'PLAYING':
                    renderPlayingScreen(view);
                    break;
                case 'FINISHED':
                    renderFinishedScreen(view);
                    break;
                case 'REVIEW':
                    renderReviewScreen(view);
                    break;
            }
        }

        // --- SCREEN 1: HOME ---
        function renderHomeScreen(container) {
            container.innerHTML = `
                <div class="glass-card rounded-3xl p-6 sm:p-12 w-full max-w-4xl text-center shadow-2xl border border-cyan-500/40 relative overflow-hidden my-auto">
                    <div class="absolute -top-32 -right-32 w-80 h-80 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-purple-500/15 rounded-full blur-3xl pointer-events-none"></div>

                    <div class="inline-flex items-center justify-center p-5 bg-gradient-to-br from-cyan-500/20 to-blue-600/20 text-cyan-400 rounded-3xl mb-5 text-4xl sm:text-5xl glow-box border border-cyan-500/40">
                        <i class="fa-solid fa-rocket"></i>

            gameState.isConfirmed = false;

            gameState.userMatches = {};
            gameState.userOrder = [];
            gameState.questionHistory = [];

            setupQuestionData();

        function setupQuestionData() {
            const q = gameState.roundQuestions[gameState.currentQuestionIndex];
            gameState.selectedOption = null;
            gameState.isConfirmed = false;
            gameState.selectedLeftMatch = null;
            gameState.userMatches = {};
            
            if (q.options) {
                q.shuffledOptions = shuffleArray(q.options);
            }
            if (q.isOrdering) {
                gameState.userOrder = shuffleArray(q.items.map(item => item.id));
            }
            if (q.isMatching) {
                q.shuffledRightItems = shuffleArray(q.rightItems);
            }

            gameState.timer = 30;
            gameState.timerActive = true;
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                if (gameState.timerActive && gameState.screen === 'PLAYING') {
                    if (gameState.timer > 0) {
                        gameState.timer--;
                        const timerEl = document.getElementById('timer-display');
                        if (timerEl) timerEl.innerText = gameState.timer;
                        
                        if (gameState.timer === 0) {
                            clearInterval(gameState.timerInterval);
                            autoSubmitTimeout();
                        }
                    }
                }
            }, 1000);
        }

            if (gameState.isConfirmed) return;
            gameState.unansweredCount++;
            gameState.isConfirmed = true;
            gameState.timerActive = false;
            
            const q = gameState.roundQuestions[gameState.currentQuestionIndex];
            gameState.questionHistory.push({

            render();

                                    const isTargeted = matchedLeftId !== null;

                                    return `
                                        <div onclick="selectRightMatch('${rightItem.id}')" class="p-4 rounded-2xl cursor-pointer border transition text-sm flex flex-col gap-2 shadow-md ${isTargeted ? 'bg-indigo-950/70 border-indigo-500/60 text-indigo-200' : 'bg-slate-900/90 border-slate-700 hover:border-slate-500 text-slate-200'}">
                                            <div class="flex items-center justify-between">
                                                <span class="font-medium text-base">${rightItem.text}</span>
                                                <span class="text-xs px-2.5 py-1 rounded-lg ${isTargeted ? 'bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 font-bold' : 'bg-slate-800 text-slate-400 border border-slate-700'}">
                                                    ${isTargeted ? '✓ مرتبط' : 'متاح للربط'}
                                                </span>
                                            </div>
                                            ${matchedLeftObj ? `
                                                <div class="text-xs text-indigo-300/90 bg-slate-950/50 p-2 rounded-lg border border-indigo-500/30">
                                                    مرتبط بـ: <span class="font-bold text-white">${matchedLeftObj.text}</span>
                                                </div>
                                            ` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (q.isOrdering) {
                return `
                    <div class="space-y-3 my-4">
                        <div class="text-xs font-bold text-cyan-400 mb-2">رتب العناصر تصاعدياً بالنقر على الأسهم:</div>
                        ${gameState.userOrder.map((itemId, idx) => {
                            const itemObj = q.items.find(i => i.id === itemId);
                            return `
                                <div class="p-4 bg-slate-900 border border-slate-700 rounded-2xl flex items-center justify-between shadow-sm">
                                    <div class="flex items-center gap-3">
                                        <span class="w-8 h-8 rounded-xl bg-cyan-500/20 text-cyan-400 font-bold flex items-center justify-center text-sm">${idx + 1}</span>
                                        <span class="text-white text-sm sm:text-base font-medium">${itemObj.text}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button onclick="moveOrderItem(${idx}, -1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-300 flex items-center justify-center transition shadow-sm">
                                            <i class="fa-solid fa-arrow-up"></i>
                                        </button>
                                        <button onclick="moveOrderItem(${idx}, 1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-300 flex items-center justify-center transition shadow-sm">
                                            <i class="fa-solid fa-arrow-down"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            return `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${q.shuffledOptions.map((opt, idx) => {
                        const isSelected = gameState.selectedOption === opt.id;
                        const letterTag = ['أ', 'ب', 'ج', 'د'][idx];
                        return `
                            <button onclick="selectOption('${opt.id}')" ${gameState.isConfirmed ? 'disabled' : ''} class="p-4 sm:p-5 rounded-2xl border-2 text-right transition flex items-center gap-4 group shadow-md ${isSelected ? 'bg-cyan-950/90 border-cyan-400 text-white shadow-cyan-500/30' : 'bg-slate-900/80 border-slate-700 hover:border-slate-500 text-slate-200'}">
                                <span class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-600 flex items-center justify-center font-bold text-cyan-400 group-hover:scale-105 transition flex-shrink-0">${letterTag}</span>
                                <span class="text-sm sm:text-base font-semibold leading-relaxed">${opt.text}</span>
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function selectOption(id) {
            if (gameState.isConfirmed) return;
            soundEffects.click();
            gameState.selectedOption = id;
            render();
        }

        function selectLeftMatch(leftId) {
            if (gameState.isConfirmed) return;
            soundEffects.click();
            gameState.selectedLeftMatch = leftId;
            render();
        }

        function selectRightMatch(rightId) {
            if (gameState.isConfirmed) return;
            if (!gameState.selectedLeftMatch) {
                alert('الرجاء اختيار العفر أو المفهوم من العمود الأيمن (الأعمدة اليسرى في اللوحة) أولاً قبل اختيار النتيجة.');
                return;
            }
            soundEffects.confirm();
            // Assign match
            gameState.userMatches[gameState.selectedLeftMatch] = rightId;
            gameState.selectedLeftMatch = null; // reset selection
            render();
        }

        function removeMatch(leftId) {
            if (gameState.isConfirmed) return;
            soundEffects.click();
            delete gameState.userMatches[leftId];
            render();
        }

        function moveOrderItem(index, direction) {
            if (gameState.isConfirmed) return;
            soundEffects.click();
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= gameState.userOrder.length) return;
            const temp = gameState.userOrder[index];
            gameState.userOrder[index] = gameState.userOrder[newIndex];
            gameState.userOrder[newIndex] = temp;
            render();
        }

        function confirmAnswer() {
            const q = gameState.roundQuestions[gameState.currentQuestionIndex];
            
            if (q.isMatching) {
                if (Object.keys(gameState.userMatches).length < q.leftItems.length) {
                    alert('الرجاء إكمال توصيل جميع العناصر قبل تأكيد الإجابة.');
                    return;
                }
            } else if (!q.isOrdering && !gameState.selectedOption) {
                alert('الرجاء اختيار إجابة أولاً قبل التأكيد.');
                return;
            }

            gameState.timerActive = false;
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            soundEffects.confirm();

            gameState.robotPosition = 2;
            render();

            setTimeout(() => {
                gameState.robotPosition = 3;
                soundEffects.move();
                render();
            }, 600);

            setTimeout(() => {
                soundEffects.arrive();
                evaluateResult(q);
            }, 1400);
        }

        function evaluateResult(q) {
            let isCorrect = false;

            if (q.isMatching) {
                let allCorrect = true;
                for (let lId in q.correctPairs) {
                    if (gameState.userMatches[lId] !== q.correctPairs[lId]) {
                        allCorrect = false;
                        break;
                    }
                }
                if (allCorrect) isCorrect = true;
            } else if (q.isOrdering) {
                const isMatch = q.correctOrder.every((val, idx) => val === gameState.userOrder[idx]);
                if (isMatch) isCorrect = true;
            } else {
                if (gameState.selectedOption === q.correctId) {
                    isCorrect = true;
                }
            }

            const currentTeam = gameState.teams[gameState.currentTeamIndex];
            let userAnswerText = '';

            if (q.isMatching) {
                userAnswerText = 'تم إتمام التوصيل';
            } else if (q.isOrdering) {
                userAnswerText = 'تم ترتيب الخطوات';
            } else {
                const foundOpt = q.options.find(o => o.id === gameState.selectedOption);
                userAnswerText = foundOpt ? foundOpt.text : 'بدون إجابة';
            }

            const correctOptText = q.correctId && q.options ? (q.options.find(o => o.id === q.correctId)?.text || '') : 'الإجابة النموذجية الصحيحة';

            if (isCorrect) {
                soundEffects.correct();
                gameState.score += 100;
                gameState.stars += 1;
                gameState.correctCount++;
                if (gameState.gameMode === 'TEAM') {
                    currentTeam.score += 100;
                    currentTeam.stars += 1;
                }
            } else {
                soundEffects.incorrect();
                gameState.incorrectCount++;
            }

            gameState.questionHistory.push({
                question: q.question,
                userAnswer: userAnswerText,
                correctAnswer: correctOptText,
                isCorrect: isCorrect,
                why: q.why
            });

            gameState.isConfirmed = true;
            render();
        }

        function nextQuestion() {
            soundEffects.click();
            gameState.currentQuestionIndex++;

            if (gameState.currentQuestionIndex >= gameState.roundQuestions.length) {
                gameState.screen = 'FINISHED';
                soundEffects.win();
                render();
            } else {
                if (gameState.gameMode === 'TEAM') {
                    gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
                }
                gameState.robotPosition = 1;
                setupQuestionData();
                render();
            }
        }

        // --- SCREEN 5: FINISHED / RESULTS ---
        function renderFinishedScreen(container) {
            const currentTeam = gameState.gameMode === 'TEAM' ? gameState.teams[gameState.currentTeamIndex] : gameState.teams[0];
            const totalScore = gameState.gameMode === 'TEAM' ? currentTeam.score : gameState.score;
            const totalStars = gameState.gameMode === 'TEAM' ? currentTeam.stars : gameState.stars;
            const percentage = Math.round((totalScore / 1000) * 100);

            let rankTitle = "🚀 واصل الاستكشاف العلمي";
            if (percentage >= 90) rankTitle = "🏆 عبقري الاستقصاء العلمي";
            else if (percentage >= 80) rankTitle = "🥇 خبير التبخر";
            else if (percentage >= 70) rankTitle = "🔬 مستكشف علمي ممتاز";
            else if (percentage >= 60) rankTitle = "🧪 باحث واعد";

            container.innerHTML = `
                <div class="glass-card rounded-3xl p-6 sm:p-12 w-full max-w-3xl text-center shadow-2xl border border-cyan-500/40 relative overflow-hidden">
                    <div class="inline-flex items-center justify-center p-5 bg-amber-500/20 text-amber-400 rounded-3xl mb-5 text-4xl sm:text-5xl glow-box border border-amber-500/40">
                        <i class="fa-solid fa-trophy"></i>
                    </div>

                    <h3 class="text-3xl sm:text-4xl font-extrabold text-white mb-2 font-tajawal">🏁 خط النهاية - نتائج السباق المعرفي</h3>
                    <p class="text-cyan-300 font-bold text-lg mb-6">${gameState.gameMode === 'TEAM' ? 'الفريق الفائز / الحالي: ' + currentTeam.name : 'أداء البطل المستكشف'}</p>

                    <div class="p-5 rounded-2xl bg-gradient-to-r from-cyan-500/20 to-blue-500/20 border border-cyan-500/40 text-cyan-200 font-bold text-xl mb-6 shadow-lg">
                        ${rankTitle} (${percentage}%)
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-700 shadow-md">
                            <div class="text-cyan-400 text-2xl font-black mb-1">${totalScore} / 1000</div>
                            <div class="text-xs text-slate-400">إجمالي النقاط</div>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-700 shadow-md">
                            <div class="text-amber-400 text-2xl font-black mb-1">⭐ ${totalStars}</div>
                            <div class="text-xs text-slate-400">النجوم المكتسبة</div>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-700 shadow-md">
                            <div class="text-emerald-400 text-2xl font-black mb-1">${gameState.correctCount}</div>
                            <div class="text-xs text-slate-400">الإجابات الصحيحة</div>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-700 shadow-md">
                            <div class="text-rose-400 text-2xl font-black mb-1">${gameState.incorrectCount}</div>
                            <div class="text-xs text-slate-400">الإجابات الخاطئة</div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                        <button onclick="soundEffects.click(); gameState.screen='REVIEW'; render();" class="w-full sm:w-auto px-6 py-3.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 rounded-2xl font-bold transition flex items-center justify-center gap-2 shadow-lg">
                            <i class="fa-solid fa-book-open"></i> مراجعة الإجابات والشرح العلمي
                        </button>
                        <button onclick="soundEffects.click(); gameState.screen='MODE_SELECT'; render();" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-2xl shadow-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-right"></i> العب من جديد
                        </button>
                    </div>
                </div>
            `;
        }

        // --- SCREEN 6: REVIEW ANSWERS ---
        function renderReviewScreen(container) {
            container.innerHTML = `
                <div class="glass-card rounded-3xl p-6 sm:p-10 w-full max-w-4xl shadow-2xl border border-slate-700">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-2xl font-bold text-white font-tajawal flex items-center gap-2">
                            <i class="fa-solid fa-book-open text-cyan-400"></i> مراجعة إجابات استقصاء التبخر
                        </h3>
                        <button onclick="soundEffects.click(); gameState.screen='FINISHED'; render();" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm transition shadow-sm">
                            <i class="fa-solid fa-arrow-right ml-1"></i> العودة للنتائج
                        </button>
                    </div>

                    <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                        ${gameState.questionHistory.map((h, idx) => `
                            <div class="p-5 rounded-2xl bg-slate-900/95 border ${h.isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'} shadow-md">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs font-bold text-cyan-400">السؤال ${idx + 1}</span>
                                    <span class="px-3 py-1 rounded-xl text-xs font-bold ${h.isCorrect ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">
                                        ${h.isCorrect ? '✓ إجابة صحيحة' : '✗ إجابة غير دقيقة'}
                                    </span>
                                </div>
                                <div class="text-white font-semibold text-base mb-3 leading-relaxed">${h.question}</div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm mb-3">
                                    <div class="p-3 rounded-xl bg-slate-800 text-slate-300 border border-slate-700">
                                        <span class="text-slate-400 block mb-1">إجابتك:</span>
                                        <span class="font-bold text-cyan-300">${h.userAnswer}</span>
                                    </div>
                                    <div class="p-3 rounded-xl bg-slate-800 text-slate-300 border border-slate-700">
                                        <span class="text-slate-400 block mb-1">الإجابة الصحيحة:</span>
                                        <span class="font-bold text-emerald-300">${h.correctAnswer}</span>
                                    </div>
                                </div>
                                <div class="p-3.5 rounded-xl bg-cyan-950/40 border border-cyan-500/30 text-slate-200 text-xs sm:text-sm">
                                    <span class="font-bold text-cyan-400">💡 التفسير العلمي (لماذا؟):</span> ${h.why}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
