        // --- STREAMING_CHUNK:Initializing Sound Engine (Web Audio API) ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }
            playBeep(freq = 440, type = 'sine', duration = 0.1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) { console.error(e); }
            }
            clue() {
                this.playBeep(523.25, 'triangle', 0.15);
                setTimeout(() => this.playBeep(659.25, 'triangle', 0.2), 150);
            }
            success() {
                this.playBeep(440, 'sine', 0.1);
                setTimeout(() => this.playBeep(554.37, 'sine', 0.1), 100);
                setTimeout(() => this.playBeep(659.25, 'sine', 0.25), 200);
            }
            error() {
                this.playBeep(220, 'sawtooth', 0.2);
                setTimeout(() => this.playBeep(185, 'sawtooth', 0.3), 150);
            }
            victory() {
                const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.50];
                notes.forEach((n, i) => {
                    setTimeout(() => this.playBeep(n, 'sine', 0.2), i * 100);
                });
            }
        }

        // --- STREAMING_CHUNK:Initializing Application Global State ---
        let gameState = {
            screen: 'START',
            mode: 'solo',
            playerName: '',
            teams: [],
            currentTeamIndex: 0,
            currentQuestionIndex: 0,
            score: 0,
            teamScores: {},
            correctCount: 0,
            incorrectCount: 0,
            cluesFound: 0,
            userAnswers: [],
            questions: []
        };

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGameRound() {
            gameState.questions = originalQuestions.map(q => {
                let cloned = JSON.parse(JSON.stringify(q));
                if (cloned.options) {
                    cloned.options = shuffleArray(cloned.options);
                }
                if (cloned.pairs) {
                    let lefts = cloned.pairs.map(p => p.left);
                    let rights = shuffleArray(cloned.pairs.map(p => p.right));
                    cloned.shuffledPairs = lefts.map((l, i) => ({ left: l, right: rights[i] }));
                    cloned.correctPairs = cloned.pairs;
                }
                return cloned;
            });
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.incorrectCount = 0;
            gameState.cluesFound = 0;
            gameState.userAnswers = [];
            if (gameState.mode === 'teams') {
                gameState.teamScores = {};
                gameState.teams.forEach(t => gameState.teamScores[t] = 0);
                gameState.currentTeamIndex = 0;
            }
        }

        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            switch(gameState.screen) {
                case 'START':
                    container.innerHTML = renderStartScreen();
                    break;
                case 'MODE_SELECTION':
                    container.innerHTML = renderModeSelectionScreen();
                    break;
                case 'PLAYER_SETUP':
                    container.innerHTML = renderPlayerSetupScreen();
                    break;
                case 'TEAM_SETUP':
                    container.innerHTML = renderTeamSetupScreen();
                    break;
                case 'READY':
                    container.innerHTML = renderReadyScreen();
                    break;
                case 'QUESTION':
                    container.innerHTML = renderQuestionScreen();
                    break;
                case 'FEEDBACK':
                    container.innerHTML = renderFeedbackScreen();
                    break;
                case 'FINISHED':
                    container.innerHTML = renderFinishedScreen();
                    break;
                case 'REVIEW':
                    container.innerHTML = renderReviewScreen();
                    break;
            }
        }

        // --- STREAMING_CHUNK:Rendering Mode Selection Screen ---

        function renderQuestionScreen() {

                                <rect x="95" y="40" width="10" height="70" rx="5" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>

                                    <div class="w-6 h-6 rounded-full bg-blue-500 animate-pulse"></div>
                                    <div class="w-6 h-6 rounded-full bg-blue-500 animate-pulse"></div>
                                    <div class="w-6 h-6 rounded-full bg-blue-500 animate-pulse"></div>

                                <span class="text-xs text-cyan-300 block mb-1">الحالة الثانية (متباعدة وتتحرك بسرعة)</span>
                                <div class="flex gap-6 bg-gray-900/50 p-2 rounded-xl border border-cyan-500/30">
                                    <div class="w-6 h-6 rounded-full bg-red-500 transform -translate-x-2"></div>
                                    <div class="w-6 h-6 rounded-full bg-red-500 transform translate-x-2"></div>

                        </div>
                    `;
                case 'data-table':
                    return `
                        <div class="w-full h-48 flex flex-col items-center justify-center">
                            <table class="w-full text-center text-xs border-collapse">
                                <tr class="bg-gray-800 text-cyan-300">
                                    <th class="p-1.5 border border-gray-700">الزمن (د)</th>
                                    <th class="p-1.5 border border-gray-700">0</th>

                                    <td class="p-1.5 border border-gray-700 bg-gray-800/50 font-bold">°C</td>

                default:
                    return `

                                <line x1="20" y1="100" x2="20" y2="10" stroke="#4b5563" stroke-width="2"/>
                                <path d="M20 90 L 70 70 L 110 40 L 150 20 L 180 20" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
                                <circle cx="150" cy="20" r="4" fill="#ef4444"/>

                            </svg>
                            <span class="text-[11px] text-cyan-300 mt-2">📈 مخطط تحليل البيانات والحرارة</span>

                    `;
            }
        }

        function renderQuestionOptions(q) {
            if (q.type === 'ordering') {
                return renderOrderingInterface(q);
            } else if (q.type === 'matching') {
                return renderMatchingInterface(q);
            } else {
                return q.options.map((opt, i) => `
                    <button onclick="handleOptionSelect('${opt.id}', '${q.correctOptionId}')" class="w-full text-right p-3.5 rounded-xl glass-card hover:bg-cyan-500/20 hover:border-cyan-400 transition-all text-sm font-semibold flex items-center justify-between group cursor-pointer border border-gray-700/80">
                        <span class="text-gray-200 group-hover:text-white">${opt.text}</span>
                        <span class="w-7 h-7 rounded-lg bg-gray-800 text-cyan-400 text-xs flex items-center justify-center font-bold border border-gray-700 group-hover:bg-cyan-500 group-hover:text-white transition-colors">${['أ','ب','ج','د'][i]}</span>
                    </button>
                `).join('');
            }
        }

        function renderActionButtonsIfNeeded(q) {
            if (q.type === 'ordering') {
                return `
                    <button onclick="submitOrderingAnswer()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-cyan-600/30 text-sm">
                        تأكيد ترتيب الأحداث 📋
                    </button>
                `;
            } else if (q.type === 'matching') {
                return `
                    <button onclick="submitMatchingAnswer()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-cyan-600/30 text-sm">
                        تأكيد المطابقة العلمية 🔗
                    </button>
                `;
            }
            return '';
        }

        let userOrderSequence = [];
        function renderOrderingInterface(q) {
            return `
                <div class="space-y-2 mb-3">
                    <p class="text-xs text-gray-400 mb-2">اضغط على البطاقات بالترتيب الصحيح (من 1 إلى 4):</p>
                    ${q.items.map((item, itemIdx) => {
                        let selectedRank = userOrderSequence.indexOf(itemIdx);
                        return `
                            <div onclick="toggleOrderItem(${itemIdx})" class="p-3 rounded-xl glass-card cursor-pointer flex items-center justify-between border ${selectedRank !== -1 ? 'border-cyan-400 bg-cyan-500/20' : 'border-gray-700'} hover:border-cyan-400 transition-all">
                                <span class="text-xs text-white font-medium">${item}</span>
                                <span class="w-6 h-6 rounded-full ${selectedRank !== -1 ? 'bg-cyan-500 text-white' : 'bg-gray-800 text-gray-400'} text-xs font-bold flex items-center justify-center">
                                    ${selectedRank !== -1 ? selectedRank + 1 : '•'}
                                </span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function toggleOrderItem(itemIdx) {
            sounds.playBeep(500, 'sine', 0.05);
            let idxInSeq = userOrderSequence.indexOf(itemIdx);
            if (idxInSeq !== -1) {
                userOrderSequence.splice(idxInSeq, 1);
            } else {
                if (userOrderSequence.length < 4) {
                    userOrderSequence.push(itemIdx);
                }
            }
            render();
        }

        function submitOrderingAnswer() {
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (userOrderSequence.length < 4) {
                sounds.error();
                return;
            }
            let isCorrect = true;
            for (let i = 0; i < 4; i++) {
                if (userOrderSequence[i] !== q.correctOrder[i]) {
                    isCorrect = false;
                    break;
                }
            }
            recordAnswerResult(isCorrect, userOrderSequence, q.correctOrder);
        }

        // --- STREAMING_CHUNK:Matching Question Interactive Logic ---
        let userMatches = {};
        let selectedLeftIdx = null;

        function renderMatchingInterface(q) {
            return `
                <div class="space-y-3 mb-3">
                    <p class="text-xs text-gray-400 mb-1">انقر على المفاهيم في اليسار ثم انقر على ما يناسبها في اليمين للمطابقة:</p>
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div class="space-y-2">
                            <p class="text-cyan-400 font-bold mb-1">المفاهيم:</p>
                            ${q.shuffledPairs.map((pair, lIdx) => {
                                let isConnected = userMatches[lIdx] !== undefined;
                                return `
                                    <div onclick="selectLeftMatch(${lIdx})" class="p-3 rounded-xl glass-card cursor-pointer border ${selectedLeftIdx === lIdx ? 'border-cyan-400 bg-cyan-500/20 shadow-md' : isConnected ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-gray-700'} hover:border-cyan-400 transition-all font-medium text-gray-200 flex items-center justify-between">
                                        <span>${pair.left}</span>
                                        ${isConnected ? '<span class="text-emerald-400 text-xs font-bold">✓ موصول</span>' : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div class="space-y-2">
                            <p class="text-cyan-400 font-bold mb-1">النتائج:</p>
                            ${q.shuffledPairs.map((pair) => {
                                let matchedLeftKey = Object.keys(userMatches).find(k => userMatches[k] === pair.right);
                                let isConnected = matchedLeftKey !== undefined;
                                return `
                                    <div onclick="selectRightMatch('${pair.right}')" class="p-3 rounded-xl glass-card cursor-pointer border ${isConnected ? 'border-emerald-500 bg-emerald-500/20 shadow-md' : 'border-gray-700'} hover:border-emerald-400 transition-all font-medium text-gray-200 flex items-center justify-between">
                                        <span>${pair.right}</span>
                                        ${isConnected ? '<span class="text-emerald-400 text-xs font-bold">● موصول</span>' : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    
                    <!-- Display Active Connections with Cancel option -->
                    ${Object.keys(userMatches).length > 0 ? `
                        <div class="mt-3 p-3 bg-gray-900/80 rounded-xl border border-gray-700 text-xs">
                            <p class="text-cyan-300 font-bold mb-2">🔗 الاتصالات الحالية (اضغط إلغاء لتعديل الاتصال):</p>
                            <div class="space-y-1.5">
                                ${Object.keys(userMatches).map(lIdx => {
                                    let lText = q.shuffledPairs[lIdx].left;
                                    let rText = userMatches[lIdx];
                                    return `
                                        <div class="flex items-center justify-between bg-gray-800/60 px-3 py-1.5 rounded-lg border border-gray-700/60">
                                            <span class="text-gray-200">${lText} ⟵⟼ ${rText}</span>
                                            <button onclick="cancelMatch(${lIdx})" class="text-red-400 hover:text-red-300 font-bold text-xs px-2 py-0.5 bg-red-500/10 rounded border border-red-500/20">إلغاء</button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function selectLeftMatch(lIdx) {
            sounds.playBeep(400, 'sine', 0.05);
            selectedLeftIdx = lIdx;
            render();
        }

        function selectRightMatch(rightText) {
            if (selectedLeftIdx === null) {
                sounds.error();
                return;
            }
            sounds.playBeep(600, 'sine', 0.08);
            userMatches[selectedLeftIdx] = rightText;
            selectedLeftIdx = null;
            render();
        }

        function cancelMatch(lIdx) {
            sounds.playBeep(350, 'sine', 0.06);
            delete userMatches[lIdx];
            render();
        }

        function submitMatchingAnswer() {
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (Object.keys(userMatches).length < q.shuffledPairs.length) {
                sounds.error();
                return;
            }
            let isCorrect = true;
            q.shuffledPairs.forEach((pair, lIdx) => {
                let chosenRight = userMatches[lIdx];
                let originalPair = q.correctPairs.find(p => p.left === pair.left);
                if (!originalPair || originalPair.right !== chosenRight) {
                    isCorrect = false;
                }
            });
            recordAnswerResult(isCorrect, userMatches, q.correctPairs);
        }

        function handleOptionSelect(selectedId, correctId) {
            const isCorrect = selectedId === correctId;
            recordAnswerResult(isCorrect, selectedId, correctId);
        }

        function recordAnswerResult(isCorrect, userAnswer, correctAnswer) {
            const q = gameState.questions[gameState.currentQuestionIndex];
            
            gameState.userAnswers.push({
                question: q.question,
                isCorrect: isCorrect,
                userAnswer: userAnswer,
                correctAnswer: correctAnswer,
                explanation: q.explanation
            });

            if (isCorrect) {
                sounds.success();
                gameState.score += 100;
                gameState.correctCount++;
                gameState.cluesFound++;
                if (gameState.mode === 'teams') {
                    const currentTeam = gameState.teams[gameState.currentTeamIndex];
                    gameState.teamScores[currentTeam] = (gameState.teamScores[currentTeam] || 0) + 100;
                }
            } else {
                sounds.error();
                gameState.incorrectCount++;
            }

            gameState.screen = 'FEEDBACK';
            gameState.lastAnswerCorrect = isCorrect;
            render();
        }

        // --- STREAMING_CHUNK:Rendering Feedback Screen ---
        function renderFeedbackScreen() {
            const q = gameState.questions[gameState.currentQuestionIndex];
            const isCorrect = gameState.lastAnswerCorrect;

            return `
                <div class="glass-panel rounded-3xl p-8 max-w-lg w-full text-center shadow-2xl border ${isCorrect ? 'border-emerald-500/40 bg-gray-900/90' : 'border-amber-500/40 bg-gray-900/90'}">
                    <div class="text-5xl mb-3">${isCorrect ? '🎉' : '🔎'}</div>
                    <h2 class="text-2xl font-bold ${isCorrect ? 'text-emerald-400' : 'text-amber-400'} mb-2">
                        ${isCorrect ? 'دليل صحيح!' : 'الدليل لم يكتمل بعد'}
                    </h2>
                    
                    ${isCorrect ? '<p class="text-cyan-400 font-bold mb-4">+100 نقطة مكتسبة</p>' : ''}

                    <div class="glass-card rounded-2xl p-5 text-right mb-6 border border-gray-700/80">
                        <h4 class="text-xs font-bold text-cyan-400 mb-1">🔬 لماذا؟ (التفسير العلمي):</h4>
                        <p class="text-gray-200 text-sm leading-relaxed">${q.explanation}</p>
                    </div>

                    <button onclick="proceedToNextQuestion()" class="w-full py-3.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-cyan-600/30 text-base">
                        متابعة التحقيق ➔
                    </button>
                </div>
            `;
        }

        function proceedToNextQuestion() {
            sounds.playBeep(500, 'sine', 0.08);
            userOrderSequence = [];
            userMatches = {};
            selectedLeftIdx = null;

            gameState.currentQuestionIndex++;
            if (gameState.mode === 'teams') {
                gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
            }

            if (gameState.currentQuestionIndex >= gameState.questions.length) {
                gameState.screen = 'FINISHED';
                sounds.victory();
            } else {
                gameState.screen = 'QUESTION';
            }
            render();
        }

        // --- STREAMING_CHUNK:Rendering Finished & Review Screens ---
        function renderFinishedScreen() {
            const totalQ = gameState.questions.length;
            const percentage = Math.round((gameState.correctCount / totalQ) * 100);
            
            let rankTitle = "";
            let rankIcon = "";
            if (percentage >= 90) { rankTitle = "عبقري العلوم"; rankIcon = "🧠"; }
            else if (percentage >= 80) { rankTitle = "خبير علمي"; rankIcon = "🔬"; }
            else if (percentage >= 70) { rankTitle = "محقق علمي متميز"; rankIcon = "🕵️‍♂️"; }
            else if (percentage >= 60) { rankTitle = "مستكشف المعرفة"; rankIcon = "🔎"; }
            else { rankTitle = "محقق تحت التدريب"; rankIcon = "🌟"; }

            let teamResultsHtml = '';
            if (gameState.mode === 'teams') {
                let sortedTeams = [...gameState.teams].sort((a,b) => gameState.teamScores[b] - gameState.teamScores[a]);
                teamResultsHtml = `
                    <div class="my-4 p-4 glass-card rounded-2xl border border-gray-700 text-right">
                        <h4 class="text-xs font-bold text-cyan-400 mb-2">🏆 نتائج الفرق المتنافسة:</h4>
                        ${sortedTeams.map((t, idx) => `
                            <div class="flex justify-between items-center text-sm py-1 border-b border-gray-800 last:border-0">
                                <span class="text-white">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🎖️'} ${t}</span>
                                <span class="font-bold text-cyan-400">${gameState.teamScores[t]} نقطة</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="glass-panel rounded-3xl p-8 max-w-xl w-full text-center shadow-2xl border border-cyan-500/30 relative overflow-hidden">
                    <div class="absolute -top-16 -right-16 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl"></div>
                    
                    <div class="text-5xl mb-2">🔓</div>
                    <h2 class="text-3xl font-black text-white mb-1">القضية حُلّت بنجاح!</h2>
                    <p class="text-gray-400 text-sm mb-6">تقرير التحقيق النهائي لدرس الغليان</p>

                    <div class="inline-flex items-center gap-2 px-4 py-2 bg-cyan-500/10 rounded-2xl border border-cyan-500/30 mb-6">
                        <span class="text-2xl">${rankIcon}</span>
                        <div class="text-right">
                            <span class="text-xs text-gray-400 block">رتبة المحقق:</span>
                            <span class="font-bold text-cyan-300 text-base">${rankTitle}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6 text-right">
                        <div class="glass-card p-3 rounded-xl border border-gray-700">
                            <span class="text-xs text-gray-400 block">المحقق / الفريق</span>
                            <span class="font-bold text-white text-sm">${gameState.mode === 'solo' ? gameState.playerName : gameState.teams[0]}</span>
                        </div>
                        <div class="glass-card p-3 rounded-xl border border-gray-700">
                            <span class="text-xs text-gray-400 block">إجمالي النقاط</span>
                            <span class="font-bold text-cyan-400 text-sm">${gameState.score} / 1000</span>
                        </div>
                        <div class="glass-card p-3 rounded-xl border border-gray-700">
                            <span class="text-xs text-gray-400 block">نسبة النجاح</span>
                            <span class="font-bold text-emerald-400 text-sm">${percentage}%</span>
                        </div>
                        <div class="glass-card p-3 rounded-xl border border-gray-700">
                            <span class="text-xs text-gray-400 block">إجابات صحيحة</span>
                            <span class="font-bold text-emerald-400 text-sm">${gameState.correctCount}</span>
                        </div>
                        <div class="glass-card p-3 rounded-xl border border-gray-700">
                            <span class="text-xs text-gray-400 block">إجابات خاطئة</span>
                            <span class="font-bold text-red-400 text-sm">${gameState.incorrectCount}</span>
                        </div>
                        <div class="glass-card p-3 rounded-xl border border-gray-700">
                            <span class="text-xs text-gray-400 block">الأدلة المكتشفة</span>
                            <span class="font-bold text-cyan-400 text-sm">${gameState.cluesFound} / 10</span>
                        </div>
                    </div>

                    ${teamResultsHtml}

                    <p class="text-xs text-gray-400 mb-6">يمكنك إعادة التحقيق ومحاولة اكتشاف الأدلة كلها بشكل كامل!</p>

                    <div class="flex flex-col sm:flex-row gap-3">
                        <button onclick="goToScreen('REVIEW')" class="w-full sm:w-1/2 py-3.5 bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold rounded-xl transition-all border border-gray-700">
                            🔍 مراجعة التحقيق
                        </button>
                        <button onclick="restartGame()" class="w-full sm:w-1/2 py-3.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-cyan-600/30">
                            🔄 العب من جديد
                        </button>
                    </div>
                </div>
            `;
        }

        function renderReviewScreen() {
            return `
                <div class="glass-panel rounded-3xl p-6 sm:p-8 max-w-3xl w-full shadow-2xl border border-cyan-500/30 my-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-white">🔍 سجل مراجعة التحقيق والأدلة</h2>
                        <button onclick="goToScreen('FINISHED')" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-xs font-bold">
                            ← العودة للنتائج
                        </button>
                    </div>

                    <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                        ${gameState.userAnswers.map((item, idx) => `
                            <div class="glass-card p-4 rounded-2xl border ${item.isCorrect ? 'border-emerald-500/30' : 'border-red-500/30'} text-right">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs text-cyan-400 font-bold">السؤال ${idx + 1}</span>
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${item.isCorrect ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">
                                        ${item.isCorrect ? '✓ صحيح' : '✗ غير صحيح'}
                                    </span>
                                </div>
                                <h3 class="text-sm font-bold text-white mb-2">${item.question}</h3>
                                <div class="text-xs text-gray-300 bg-gray-900/60 p-3 rounded-xl border border-gray-800">
                                    <p class="text-cyan-300 font-semibold mb-1">💡 التفسير العلمي والدليل:</p>
                                    <p>${item.explanation}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="restartGame()" class="w-full mt-6 py-3.5 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold rounded-xl shadow-lg">
                        🔄 العب من جديد
                    </button>
                </div>
            `;
        }

        function goToScreen(screenName) {
            gameState.screen = screenName;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartGame() {
            sounds.playBeep(600, 'sine', 0.1);
            gameState.screen = 'START';
            gameState.playerName = '';
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.incorrectCount = 0;
            gameState.cluesFound = 0;
            userOrderSequence = [];
            userMatches = {};
            selectedLeftIdx = null;
            render();
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
