 * 1. بنية الصوت التوليدية المدمجة (Web Audio API)
 * لا تتطلب أي ملفات خارجية MP3 أو WAV
 * -------------------------------------------------------------
 */
class SoundEngine {
    constructor() {
        this.ctx = null;
        this.muted = false;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, type, duration, gainVal = 0.15) {
        if (this.muted) return;
        this.init();
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

            gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
            console.warn("Audio error:", e);
        }
    }

    playStart() {
        if (this.muted) return;
        const notes = [330, 440, 554, 659];
        notes.forEach((n, idx) => {
            setTimeout(() => this.playTone(n, 'triangle', 0.35, 0.2), idx * 120);
        });
    }

    playTick() {
        this.playTone(800, 'sine', 0.05, 0.05);
    }

    playAlertTick() {
        this.playTone(1000, 'square', 0.12, 0.12);
    }

    playCorrect() {
        if (this.muted) return;
        const chord = [523.25, 659.25, 783.99, 1046.50]; // C Major
        chord.forEach((n, idx) => {
            setTimeout(() => this.playTone(n, 'sine', 0.45, 0.18), idx * 80);
        });
    }

    playWrong() {
        if (this.muted) return;
        this.playTone(220, 'sawtooth', 0.35, 0.2);
        setTimeout(() => this.playTone(180, 'sawtooth', 0.4, 0.25), 180);
    }

    playTimeBoost() {
        if (this.muted) return;
        const notes = [400, 600, 800, 1200];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 'triangle', 0.2, 0.15), i * 70);
        });
    }

    playTimeOut() {
        this.playTone(250, 'square', 0.6, 0.2);
    }

    playVictory() {
        if (this.muted) return;
        const victoryTune = [523, 659, 784, 1046, 784, 1046];
        victoryTune.forEach((freq, idx) => {
            setTimeout(() => this.playTone(freq, 'triangle', 0.4, 0.25), idx * 150);
        });
    }

    toggle() {
        this.muted = !this.muted;
        return this.muted;
    }
}

const appContainer = document.getElementById('gameApp');
const statusBar = document.getElementById('labStatusBar');
const labIndicators = document.getElementById('labIndicators');

/**
 * تهيئة مؤشرات المختبر العشرة
 */
function initLabIndicators() {
    labIndicators.innerHTML = '';
    for (let i = 0; i < 10; i++) {
        const dot = document.createElement('div');
        dot.id = `lab-dot-${i}`;
        dot.className = 'w-4 h-4 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[9px] font-bold text-slate-500 transition-all duration-500';
        dot.textContent = (i + 1);
        labIndicators.appendChild(dot);
    }
}

function updateLabDot(index, status) {
    const dot = document.getElementById(`lab-dot-${index}`);
    if (!dot) return;
    if (status === 'active') {
        dot.className = 'w-5 h-5 rounded-full bg-emerald-500 text-slate-950 font-black border-2 border-emerald-300 animate-pulse flex items-center justify-center text-[10px] shadow-[0_0_10px_#10b981]';
    } else if (status === 'passed') {
        dot.className = 'w-4 h-4 rounded-full bg-emerald-900 border border-emerald-500 text-emerald-300 flex items-center justify-center text-[9px] font-bold';
    } else if (status === 'failed') {
        dot.className = 'w-4 h-4 rounded-full bg-rose-950 border border-rose-600 text-rose-300 flex items-center justify-center text-[9px] font-bold';
    }
}

        sounds.playStart();
        startCountdown();
    });
}

/**
 * -------------------------------------------------------------
 * 8. شاشة العد التنازلي الحماسي للسباق
 * -------------------------------------------------------------
 */
function startCountdown() {
    let count = 3;
    appContainer.innerHTML = `
        <div class="flex flex-col items-center justify-center p-8 text-center">
            <div class="text-sm font-bold text-emerald-400 mb-2">استعد لدخول مضمار الاستقصاء العلمي!</div>
            <div id="cdNumber" class="text-7xl sm:text-9xl font-black text-white transform scale-100 transition-all duration-300 drop-shadow-[0_0_25px_rgba(16,185,129,0.8)]">
                ${count}
            </div>
            <div class="mt-4 text-slate-400 text-xs">جارٍ تهيئة أجهزة القياس ومؤقتات الإنبات...</div>
        </div>
    `;

    sounds.playTick();

    const cdInterval = setInterval(() => {
        count--;
        if (count > 0) {
            const el = document.getElementById('cdNumber');
            if (el) {
                el.textContent = count;
                el.classList.add('scale-125');
                setTimeout(() => el.classList.remove('scale-125'), 150);
            }
            sounds.playTick();
        } else {
            clearInterval(cdInterval);
            initGameSession();
        }
    }, 900);
}

/**
 * -------------------------------------------------------------
 * 9. تهيئة جلسة اللعب
 * -------------------------------------------------------------
 */
function initGameSession() {
    GameState.currentQuestionIdx = 0;
    GameState.answeredCount = 0;
    GameState.correctCount = 0;
    GameState.wrongCount = 0;
    GameState.unansweredCount = 0;
    GameState.totalScore = 0;
    GameState.startTime = Date.now();
    GameState.history = [];

    statusBar.classList.remove('hidden');
    initLabIndicators();
    loadQuestion(0);
}

/**
 * -------------------------------------------------------------
 * 10. تحميل وعرض السؤال (مع نظام الحماية من التكرار)
 * -------------------------------------------------------------
 */
function loadQuestion(qIndex) {

            </div>

    appContainer.innerHTML = `
        <div class="lab-glass rounded-3xl p-4 sm:p-6 w-full border border-emerald-500/30 shadow-2xl relative">
            
            ${playerHeaderHTML}

/**
 * -------------------------------------------------------------
 * 11. إدارة المؤقت الزمني الحقيقي
 * -------------------------------------------------------------
 */
function startTimer() {
    clearInterval(GameState.timer);
    const timerBox = document.getElementById('raceTimerBox');
    const timerDigits = document.getElementById('timerDigits');

    GameState.timer = setInterval(() => {
        GameState.timeLeft--;

        if (timerDigits) {
            timerDigits.textContent = `00:${GameState.timeLeft < 10 ? '0' + GameState.timeLeft : GameState.timeLeft}`;
        }

        // آخر 5 ثوانٍ: مؤثرات بصرية وصوتية غير مزعجة
        if (GameState.timeLeft <= 5 && GameState.timeLeft > 0) {
            sounds.playAlertTick();
            if (timerBox) {
                timerBox.className = 'flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-rose-950/80 border-2 border-rose-500 animate-danger shadow-lg';
            }
            if (timerDigits) {
                timerDigits.className = 'font-mono font-black text-base sm:text-lg text-rose-400';
            }
        }

        // انتهاء الوقت المحدد
        if (GameState.timeLeft <= 0) {
            clearInterval(GameState.timer);
            sounds.playTimeOut();
            confirmAndEvaluate(true);
        }
    }, 1000);
}

/**
 * -------------------------------------------------------------
 * 12. تقييم الإجابة وعرض التغذية الراجعة الفورية و"لماذا؟"
 * -------------------------------------------------------------
 */
function confirmAndEvaluate(isTimeout = false) {
    if (GameState.isConfirmed) return; // منع التكرار الصارم
    GameState.isConfirmed = true;
    GameState.isAnsweringPhase = false;
    clearInterval(GameState.timer); // إيقاف المؤقت فوراً

    const q = QUESTIONS_DATA[GameState.currentQuestionIdx];
    const isCorrect = (!isTimeout && GameState.selectedOption === q.correctId);

    // تحديث الإحصائيات
    if (isTimeout) {
        GameState.unansweredCount++;
        updateLabDot(GameState.currentQuestionIdx, 'failed');
    } else if (isCorrect) {
        GameState.correctCount++;
        GameState.totalScore += 100;
        if (GameState.mode === 'TEAMS') {
            GameState.teams[GameState.currentTeamIdx].score += 100;
            GameState.teams[GameState.currentTeamIdx].stars++;
        }
        sounds.playCorrect();
        sounds.playTimeBoost();
        updateLabDot(GameState.currentQuestionIdx, 'passed');
    } else {
        GameState.wrongCount++;
        sounds.playWrong();
        updateLabDot(GameState.currentQuestionIdx, 'failed');
    }

    // حفظ في سجل المراجعة
    GameState.history.push({
        questionId: q.id,
        question: q.question,
        userOption: isTimeout ? 'غير مجاب' : GameState.selectedOption,
        correctOption: q.correctId,
        isCorrect: isCorrect,
        isTimeout: isTimeout,
        explanation: q.explanation
    });

    // تلوين الخيارات وقفلها
    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
        btn.classList.add('cursor-default');
        const optId = btn.dataset.optId;
        if (optId === q.correctId) {
            btn.className = 'option-btn w-full p-3.5 sm:p-4 bg-emerald-950/70 border-2 border-emerald-400 rounded-2xl flex items-center justify-between text-right text-emerald-200';
        } else if (optId === GameState.selectedOption && !isCorrect) {
            btn.className = 'option-btn w-full p-3.5 sm:p-4 bg-rose-950/70 border-2 border-rose-500 rounded-2xl flex items-center justify-between text-right text-rose-200';
        } else {
            btn.className = 'option-btn w-full p-3.5 sm:p-4 bg-slate-950/50 border border-slate-800 rounded-2xl flex items-center justify-between text-right opacity-40 text-slate-400';
        }
    });

    // استبدال زر التأكيد بنافذة التغذية الراجعة والتفسير العلمي
    const bottomActionContainer = document.getElementById('confirmAnswerBtn').parentElement;
    
    let feedbackBanner = '';
    if (isTimeout) {
        feedbackBanner = `
            <div class="p-4 rounded-2xl bg-amber-950/60 border-2 border-amber-500 text-center mb-3">
                <div class="text-xl mb-1">⏰ انتهى وقت السؤال!</div>
                <div class="font-bold text-amber-300 text-sm">لم تسجل إجابة بالوقت المحدد (0 نقطة)</div>
                <div class="text-xs text-slate-300 mt-1">الإجابة الصحيحة هي: <strong class="text-emerald-400">(${q.correctId}) ${q.options.find(o => o.id === q.correctId).text}</strong></div>
            </div>
        `;
    } else if (isCorrect) {
        feedbackBanner = `
            <div class="p-4 rounded-2xl bg-emerald-950/60 border-2 border-emerald-400 text-center mb-3">
                <div class="text-xl mb-1">🎉 أحسنت صنعاً! إجابة علمية دقيقة</div>
                <div class="font-black text-emerald-300 text-base">⚡ +100 نقطة | ⏱️ دفعة زمنية لمختبر الإنبات</div>
                <div class="text-xs text-emerald-200/90 mt-1">${q.labUpgrade}</div>
            </div>
        `;
    } else {
        feedbackBanner = `
            <div class="p-4 rounded-2xl bg-rose-950/60 border-2 border-rose-500 text-center mb-3">
                <div class="text-xl mb-1">❌ إجابة غير صحيحة</div>
                <div class="text-xs text-slate-300">الإجابة الصحيحة هي: <strong class="text-emerald-400">(${q.correctId}) ${q.options.find(o => o.id === q.correctId).text}</strong></div>
            </div>
        `;
    }

    bottomActionContainer.innerHTML = `
        <div class="w-full flex flex-col items-center">
            ${feedbackBanner}

            <!-- التفسير العلمي المعتمد: لماذا؟ -->
            <div class="w-full p-4 bg-slate-900/90 rounded-2xl border border-slate-700 text-right mb-4">
                <div class="flex items-center gap-2 text-amber-400 font-extrabold text-sm mb-1.5">
                    <span>💡</span>
                    <span>لماذا؟ (التفسير العلمي المعتمد للدرس):</span>
                </div>
                <p class="text-xs sm:text-sm text-slate-200 leading-relaxed font-medium">
                    ${q.explanation}
                </p>
            </div>

            <!-- زر متابعة السباق (يمنع الانتقال التلقائي الصامت) -->
            <button id="nextQuestionBtn" class="w-full sm:w-2/3 py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-black text-base shadow-[0_0_20px_rgba(16,185,129,0.4)] transition transform hover:scale-102 active:scale-98 cursor-pointer flex items-center justify-center gap-2">
                <span>🏁</span>
                <span>متابعة السباق العلمي ←</span>
            </button>
        </div>
    `;

    document.getElementById('nextQuestionBtn').addEventListener('click', () => {
        sounds.playTick();
        if (GameState.mode === 'TEAMS') {
            // الانتقال للفريق التالي بأمان
            GameState.currentTeamIdx = (GameState.currentTeamIdx + 1) % GameState.teams.length;
        }
        loadQuestion(GameState.currentQuestionIdx + 1);
    }, { once: true }); // ضمان الضغط لمرة واحدة فقط
}

/**
 * -------------------------------------------------------------
 * 13. شاشة النتيجة النهائية والرتب الاستقصائية
 * -------------------------------------------------------------
 */
function finishGame() {
    clearInterval(GameState.timer);
    sounds.playVictory();
    statusBar.classList.add('hidden');

    const totalQuestions = QUESTIONS_DATA.length;
    const maxScore = totalQuestions * 100;
    const percent = Math.round((GameState.totalScore / maxScore) * 100);
    const totalDurationSec = Math.round((Date.now() - GameState.startTime) / 1000);
    const minutes = Math.floor(totalDurationSec / 60);
    const seconds = totalDurationSec % 60;
    const timeFormatted = `${minutes > 0 ? minutes + ' دقيقة و ' : ''}${seconds} ثانية`;

    // الرتب الاستقصائية المخصصة بدقة للعبة
    let rankTitle = "";
    let rankBadge = "";
    let rankDesc = "";

    if (percent >= 90) {
        rankBadge = "⚡🏆";
        rankTitle = "بطل استقصاء الإنبات";
        rankDesc = "إتقان فائق وشامل لكل مفاهيم وظروف الإنبات، وقدرة استثنائية على تصميم واستنتاج الاختبارات العادلة!";
    } else if (percent >= 80) {
        rankBadge = "🌱🔬";
        rankTitle = "خبير البذور المستقصي";
        rankDesc = "فهم متقدم لسرعة الإنبات واحتياجات البذور الأساسية واستنتاج نتائج الظلام والضوء بدقة!";
    } else if (percent >= 70) {
        rankBadge = "🔬✨";
        rankTitle = "محقق علمي متميز";
        rankDesc = "أداء ممتاز في استقصاء عملية الإنبات، مع استيعاب جيد للعوامل المؤثرة وضبط المتغيرات!";
    } else if (percent >= 60) {
        rankBadge = "⏱️🌱";
        rankTitle = "متسابق علمي واعد";
        rankDesc = "بداية جيدة وواعدة في فهم أساسيات نمو البذور ودرجات الحرارة الملائمة للإنبات!";
    } else {
        rankBadge = "🌱📚";
        rankTitle = "واصل الاستقصاء وستتقدم أكثر!";
        rankDesc = "راجع شروط نمو البذور الثلاثة وتجربة مريم للضوء والظلام، ثم خض السباق مجدداً للتفوق!";
    }

    // تجهيز نتائج الفرق في حال النمط الجماعي
    let teamsSummaryHTML = '';
    if (GameState.mode === 'TEAMS') {
        const sortedTeams = [...GameState.teams].sort((a, b) => b.score - a.score);
        teamsSummaryHTML = `
            <div class="my-4 p-4 bg-slate-900/90 rounded-2xl border border-cyan-500/40">
                <h4 class="font-bold text-cyan-300 text-sm mb-3">ترتيب الفرق البحثية في السباق:</h4>
                <div class="space-y-2">
                    ${sortedTeams.map((t, idx) => `
                        <div class="flex items-center justify-between p-2 rounded-xl bg-slate-950 border border-slate-800 text-xs sm:text-sm">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-cyan-900/80 text-cyan-300 flex items-center justify-center font-bold text-xs">${idx + 1}</span>
                                <span class="font-extrabold text-white">${t.name}</span>
                            </div>
                            <div class="font-black text-amber-400 text-base">${t.score} نقطة</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    appContainer.innerHTML = `
        <div class="lab-glass rounded-3xl p-6 sm:p-8 max-w-2xl mx-auto text-center border-2 border-emerald-500/40 shadow-2xl animate-glow">
            
            <div class="text-4xl mb-2">${rankBadge}</div>
            <h1 class="text-2xl sm:text-3xl font-black text-white mb-1">نتيجة سباق الزمن العلمي</h1>
            <p class="text-xs sm:text-sm text-emerald-400 font-bold mb-4">مركز أبحاث استقصاء الإنبات - الصف الخامس</p>

            <!-- بطاقة الرتبة العلمية -->
            <div class="p-4 bg-slate-900/90 rounded-2xl border border-emerald-500/30 mb-5">
                <div class="text-xs text-slate-400 mb-1">الرتبة العلمية المستحقة:</div>
                <h2 class="text-xl sm:text-2xl font-black text-amber-400 mb-1">${rankTitle}</h2>
                <p class="text-xs text-slate-300 max-w-md mx-auto leading-relaxed">${rankDesc}</p>
            </div>

            ${teamsSummaryHTML}

            <!-- شبكة الإحصائيات -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 my-4">
                <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="text-xs text-slate-400 block mb-1">مجموع النقاط</span>
                    <span class="text-xl sm:text-2xl font-black text-amber-400">${GameState.totalScore}</span>
                    <span class="text-[10px] text-slate-500 block">من 1000</span>
                </div>
                <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="text-xs text-slate-400 block mb-1">النسبة المئوية</span>
                    <span class="text-xl sm:text-2xl font-black text-emerald-400">${percent}%</span>
                    <span class="text-[10px] text-slate-500 block">إتقان استقصائي</span>
                </div>
                <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="text-xs text-slate-400 block mb-1">الإجابات الصحيحة</span>
                    <span class="text-xl sm:text-2xl font-black text-teal-300">✅ ${GameState.correctCount}</span>
                    <span class="text-[10px] text-slate-500 block">خاطئة: ${GameState.wrongCount}</span>
                </div>
                <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="text-xs text-slate-400 block mb-1">الزمن الإجمالي</span>
                    <span class="text-xs sm:text-sm font-black text-cyan-300 block my-1">⏱️ ${timeFormatted}</span>
                    <span class="text-[10px] text-slate-500 block">زمن حقيقي</span>
                </div>
            </div>

            <!-- أزرار الإجراءات (مراجعة السباق، إعادة اللعب) -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center items-center mt-6">
                <button id="reviewRaceBtn" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold text-sm transition flex items-center justify-center gap-2 cursor-pointer">
                    <span>🔎</span>
                    <span>مراجعة الأسئلة والتفسيرات</span>
                </button>
                <button id="restartRaceBtn" class="w-full sm:w-auto px-8 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-sm shadow-[0_0_15px_rgba(16,185,129,0.4)] transition flex items-center justify-center gap-2 cursor-pointer">
                    <span>🔄</span>
                    <span>سباق استقصائي جديد</span>
                </button>
            </div>
        </div>
    `;

    document.getElementById('reviewRaceBtn').addEventListener('click', renderReviewScreen);
    document.getElementById('restartRaceBtn').addEventListener('click', resetAllAndRestart);
}

/**
 * -------------------------------------------------------------
 * 14. شاشة مراجعة الإجابات والمفاهيم العلمية
 * -------------------------------------------------------------
 */
function renderReviewScreen() {
    const historyHTML = GameState.history.map((item, idx) => {
        const qObj = QUESTIONS_DATA.find(q => q.id === item.questionId);
        const correctText = qObj ? qObj.options.find(o => o.id === item.correctOption).text : '';
        const userText = item.isTimeout ? 'لم يتم الإجابة في الوقت' : (qObj ? (qObj.options.find(o => o.id === item.userOption)?.text || item.userOption) : item.userOption);

        return `
            <div class="p-4 rounded-2xl bg-slate-900/90 border ${item.isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'} text-right">
                <div class="flex items-center justify-between mb-2">
                    <span class="font-bold text-xs ${item.isCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                        تحدي #${item.questionId} ${item.isCorrect ? '✅ صحيح' : (item.isTimeout ? '⏰ انتهى الوقت' : '❌ خاطئ')}
                    </span>
                    <span class="text-xs text-slate-400">100 نقطة</span>
                </div>
                <h4 class="font-bold text-white text-xs sm:text-sm mb-2">${item.question}</h4>
                <div class="text-xs space-y-1 mb-2 bg-slate-950 p-2 rounded-lg">
                    <div>إجابتك: <span class="font-bold ${item.isCorrect ? 'text-emerald-300' : 'text-rose-300'}">${userText}</span></div>
                    ${!item.isCorrect ? `<div>الإجابة الصحيحة: <span class="font-bold text-emerald-300">(${item.correctOption}) ${correctText}</span></div>` : ''}
                </div>
                <div class="text-xs text-slate-300 border-t border-slate-800 pt-2 leading-relaxed">
                    <strong class="text-amber-400">التفسير العلمي:</strong> ${item.explanation}
                </div>
            </div>
        `;
    }).join('');

    appContainer.innerHTML = `
        <div class="lab-glass rounded-3xl p-6 max-w-3xl mx-auto border border-emerald-500/30 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🔎</span>
                    <h2 class="text-lg sm:text-xl font-black text-white">مراجعة تقرير السباق العلمي</h2>
                </div>
                <button id="backToResultBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg transition">
                    ← العودة للنتيجة
                </button>
            </div>

            <!-- بطاقة المفاهيم المعتمدة للمراجعة -->
            <div class="mb-5 p-4 bg-emerald-950/30 border border-emerald-500/30 rounded-2xl text-right">
                <h3 class="font-extrabold text-emerald-300 text-xs sm:text-sm mb-2 flex items-center gap-1.5">
                    <span>📚</span>
                    <span>ملخص المفاهيم الأساسية لاستقصاء الإنبات:</span>
                </h3>
                <ul class="text-xs text-slate-300 space-y-1.5 list-disc list-inside">
                    <li>الظروف الملائمة الأساسية: <strong class="text-cyan-300">الهواء (الأكسجين)، الماء (الرطوبة)، الدفء (الحرارة)</strong> بشرط أن يكون الجنين حيًا.</li>
                    <li>البذور الصغيرة تنمو <strong class="text-emerald-300">أسرع</strong> من الكبيرة لقلة مخزون غذائها وسرعة إخراج الأوراق.</li>
                    <li>لا تحتاج البذور إلى <strong class="text-amber-300">التربة</strong> (تنمو في الورق، القطن، الماء)، ولا تحتاج إلى <strong class="text-amber-300">الضوء</strong> لكي تنمو.</li>
                    <li>الأماكن <strong class="text-rose-300">شديدة البرودة وشديدة الحرارة</strong> لا تنمو فيها البذور أبداً.</li>
                    <li>في تجربة مريم: الاختبار عادل بتثبيت جميع العوامل وتغيير عامل الضوء فقط.</li>
                </ul>
            </div>

            <!-- قائمة مراجعة الأسئلة -->
            <div class="space-y-3 max-h-[50vh] overflow-y-auto pr-1">
                ${historyHTML}
            </div>

            <div class="mt-5 pt-3 border-t border-slate-800 text-center">
                <button id="restartFromReviewBtn" class="px-8 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm shadow-lg transition">
                    🔄 بدء سباق جديد الآن
                </button>
            </div>
        </div>
    `;

    document.getElementById('backToResultBtn').addEventListener('click', finishGame);
    document.getElementById('restartFromReviewBtn').addEventListener('click', resetAllAndRestart);
}

/**
 * -------------------------------------------------------------
 * 15. إعادة التعيين الكاملة للعبة (Reset)
 * -------------------------------------------------------------
 */
function resetAllAndRestart() {
    clearInterval(GameState.timer);
    GameState.currentQuestionIdx = 0;
    GameState.currentTeamIdx = 0;
    GameState.selectedOption = null;
    GameState.isConfirmed = false;
    GameState.answeredCount = 0;
    GameState.correctCount = 0;
    GameState.wrongCount = 0;
    GameState.unansweredCount = 0;
    GameState.totalScore = 0;
    GameState.history = [];
    if (GameState.mode === 'TEAMS') {
        GameState.teams.forEach(t => {
            t.score = 0;
            t.stars = 0;
        });
    }
    sounds.playStart();
    renderModeSelection();
}

/**
 * -------------------------------------------------------------
 * 16. عناصر التحكم العامة (الصوت وملء الشاشة)
 * -------------------------------------------------------------
 */
document.getElementById('soundToggleBtn').addEventListener('click', () => {
    const isMuted = sounds.toggle();
    document.getElementById('soundIcon').textContent = isMuted ? '🔇' : '🔊';
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
});

// بدء التشغيل عند جاهزية الصفحة
window.addEventListener('DOMContentLoaded', () => {
    renderStartScreen();
});
</script>
</body>
</html>
