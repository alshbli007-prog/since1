        let gameState = {
            screen: 'START',
            mode: 'solo',
            playerName: 'الباحث الصغير',
            teams: [],
            currentTeamIndex: 0,
            roundQuestions: [],
            currentQuestionIndex: 0,
            score: 0,
            energy: 0,
            correctCount: 0,
            wrongCount: 0,
            unansweredCount: 0,
            timer: 30,
            timerInterval: null,
            selectedChallenge: null,
            wheelAngle: 0,
            matchingState: {
                selectedLeft: null,
                connections: {},
                confirmed: false
            },
            orderingState: {},
            history: []
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'spin') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                osc.frequency.setValueAtTime(800, now + 0.15);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initNewGameSession() {
            let shuffledBank = shuffleArray(questionBank);
            let selected10 = shuffledBank.slice(0, 10);
            
            gameState.roundQuestions = selected10.map(q => {
                let qCopy = JSON.parse(JSON.stringify(q));
                if (qCopy.options) {
                    qCopy.options = shuffleArray(qCopy.options);
                }
                if (qCopy.leftItems && qCopy.rightItems) {
                    qCopy.leftItems = shuffleArray(qCopy.leftItems);
                    qCopy.rightItems = shuffleArray(qCopy.rightItems);
                }
                if (qCopy.items) {
                    qCopy.items = shuffleArray(qCopy.items);
                }
                return qCopy;
            });

            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.energy = 0;
            gameState.correctCount = 0;
            gameState.wrongCount = 0;
            gameState.unansweredCount = 0;
            gameState.history = [];
            gameState.currentTeamIndex = 0;
        }

                html += `<input type="text" id="teamName_${i}" placeholder="اسم الفريق ${i}" value="فريق ${i}" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-center text-sm focus:outline-none focus:border-sky-550">`;

            html += `<button onclick="saveTeams(${count})" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl shadow transition mt-2">بدء التحدي الجماعي</button></div>`;
            container.innerHTML = html;
        }

        function saveTeams(count) {
            gameState.teams = [];
            for (let i = 1; i <= count; i++) {
                let name = document.getElementById(`teamName_${i}`).value || `فريق ${i}`;
                gameState.teams.push({ name: name, score: 0 });
            }
            initNewGameSession();
            gameState.screen = 'WHEEL_SPIN';
            render();
        }

            let input = document.getElementById('playerNameInput');
            if (input && input.value.trim()) {

            gameState.screen = 'WHEEL_SPIN';
            render();

            let btn = document.getElementById('spinBtn');
            if (btn) btn.disabled = true;

            gameState.wheelAngle += 720 + Math.floor(Math.random() * 360);
            if (wheel) {
                wheel.style.transform = `rotate(${gameState.wheelAngle}deg)`;
            }

            setTimeout(() => {
                playSound('correct');
                gameState.screen = 'QUESTION';
                render();
            }, 3500);
        }

        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            let q = gameState.roundQuestions[gameState.currentQuestionIndex];
            gameState.timer = (q.type === 'matching' || q.type === 'drawing') ? 40 : (q.type === 'comparison' ? 45 : 30);
            
            gameState.timerInterval = setInterval(() => {
                gameState.timer--;
                let display = document.getElementById('timerDisplay');
                if (display) display.textContent = gameState.timer;
                if (gameState.timer <= 0) {
                    clearInterval(gameState.timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            let q = gameState.roundQuestions[gameState.currentQuestionIndex];
            gameState.wrongCount++;
            gameState.unansweredCount++;
            
            let correctAnswerText = getCorrectAnswerText(q);
            gameState.history.push({
                title: q.title,
                question: q.question,
                userAnswer: 'انتهى الوقت ولم يجب',
                correctAnswer: correctAnswerText,
                explanation: q.explanation,
                isCorrect: false
            });

            gameState.screen = 'FEEDBACK';
            render();
        }

        function getCorrectAnswerText(q) {
            if (q.options) {
                let corrOpt = q.options.find(o => o.correct);
                return corrOpt ? corrOpt.text : '';
            } else if (q.matchingState && q.correctPairs) {
                return Object.entries(q.correctPairs).map(([k,v]) => `${k} ↔ ${v}`).join(', ');
            } else if (q.items) {
                return q.correctOrder.join(' ← ');
            }
            return '';
        }

        function renderMultipleChoiceHtml(q) {
            let buttons = q.options.map(opt => `
                <button onclick="submitAnswer('${opt.id}')" class="w-full p-4 bg-slate-900/80 hover:bg-slate-800 border border-slate-700 hover:border-sky-500 rounded-xl text-right text-white font-semibold transition transform hover:scale-101">
                    <span class="inline-block w-8 h-8 bg-slate-800 rounded-lg text-center leading-8 ml-3 text-sky-400 font-bold">${opt.id.toUpperCase()}</span>
                    ${opt.text}
                </button>
            `).join('');
            return `<div class="space-y-3 mt-4">${buttons}</div>`;
        }

        function submitAnswer(optionId) {
            clearInterval(gameState.timerInterval);
            let q = gameState.roundQuestions[gameState.currentQuestionIndex];
            let selectedOpt = q.options.find(o => o.id === optionId);
            let isCorrect = selectedOpt ? selectedOpt.correct : false;

            if (isCorrect) {
                playSound('correct');
                gameState.score += 100;
                gameState.energy = Math.min(100, gameState.energy + 10);
                gameState.correctCount++;
                if (gameState.mode === 'teams') {
                    gameState.teams[gameState.currentTeamIndex].score += 100;
                }
            } else {
                playSound('wrong');
                gameState.wrongCount++;
            }

            let corrOpt = q.options.find(o => o.correct);
            gameState.history.push({
                title: q.title,
                question: q.question,
                userAnswer: selectedOpt ? selectedOpt.text : '',
                correctAnswer: corrOpt ? corrOpt.text : '',
                explanation: q.explanation,
                isCorrect: isCorrect
            });

            gameState.screen = 'FEEDBACK';
            render();
        }

        function renderMatchingQuestionHtml(q) {
            if (!gameState.matchingState.leftItemsShuffled) {
                gameState.matchingState.selectedLeft = null;
                gameState.matchingState.connections = {};
                gameState.matchingState.confirmed = false;
                gameState.matchingState.leftItemsShuffled = q.leftItems;
                gameState.matchingState.rightItemsShuffled = q.rightItems;
            }

            let leftBtns = gameState.matchingState.leftItemsShuffled.map(item => {
                let isSelected = gameState.matchingState.selectedLeft === item;
                let isConnected = gameState.matchingState.connections[item];
                let bgClass = isSelected ? 'bg-sky-600 border-sky-400' : (isConnected ? 'bg-slate-800 border-slate-600' : 'bg-slate-900 border-slate-700');
                return `<button onclick="selectMatchingLeft('${item}')" class="p-3 ${bgClass} border rounded-xl text-white font-semibold text-sm transition text-right flex justify-between items-center">
                    <span>${item}</span>
                    ${isConnected ? `<span class="text-xs text-sky-400">🔗 (مرتبط)</span>` : ''}
                </button>`;
            }).join('');

            let rightBtns = gameState.matchingState.rightItemsShuffled.map(item => {
                let isTargetConnected = Object.values(gameState.matchingState.connections).includes(item);
                let bgClass = isTargetConnected ? 'bg-slate-800 border-slate-600' : 'bg-slate-900 border-slate-700';
                return `<button onclick="selectMatchingRight('${item}')" class="p-3 ${bgClass} border rounded-xl text-white font-semibold text-sm transition text-right">
                    ${item}
                </button>`;
            }).join('');

            let connectionsList = Object.entries(gameState.matchingState.connections).map(([l, r]) => `
                <div class="flex justify-between items-center bg-slate-800/80 px-3 py-1.5 rounded-lg text-xs">
                    <span>${l} ↔ ${r}</span>
                    <button onclick="removeConnection('${l}')" class="text-rose-400 hover:text-rose-300 font-bold">❌ إلغاء التوصيل</button>
                </div>
            `).join('');

            return `
                <div class="space-y-4">
                    <p class="text-xs text-sky-300">اختر عنصرًا من الطرف الأول ثم اختر ما يناسبه من الطرف الثاني:</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2"><p class="text-xs font-bold text-yellow-400">الطرف الأول</p>${leftBtns}</div>
                        <div class="space-y-2"><p class="text-xs font-bold text-yellow-400">الطرف الثاني</p>${rightBtns}</div>
                    </div>
                    ${connectionsList ? `<div class="space-y-1 mt-2"><p class="text-xs text-slate-400">التوصيلات الحالية:</p>${connectionsList}</div>` : ''}
                    <button onclick="confirmMatching()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition mt-2">تأكيد الإجابة</button>
                </div>
            `;
        }

        function selectMatchingLeft(item) {
            gameState.matchingState.selectedLeft = item;
            render();
        }

        function selectMatchingRight(item) {
            if (gameState.matchingState.selectedLeft) {
                let left = gameState.matchingState.selectedLeft;
                gameState.matchingState.connections[left] = item;
                gameState.matchingState.selectedLeft = null;
                render();
            }
        }

        function removeConnection(leftItem) {
            delete gameState.matchingState.connections[leftItem];
            render();
        }

        function confirmMatching() {
            clearInterval(gameState.timerInterval);
            let q = gameState.roundQuestions[gameState.currentQuestionIndex];
            let pairs = gameState.matchingState.connections;
            let correctPairs = q.correctPairs;
            
            let isAllCorrect = true;
            let keys = Object.keys(correctPairs);
            if (Object.keys(pairs).length !== keys.length) {
                isAllCorrect = false;
            } else {
                for (let k of keys) {
                    if (pairs[k] !== correctPairs[k]) {
                        isAllCorrect = false;
                        break;
                    }
                }
            }

            if (isAllCorrect) {
                playSound('correct');
                gameState.score += 100;
                gameState.energy = Math.min(100, gameState.energy + 10);
                gameState.correctCount++;
                if (gameState.mode === 'teams') {
                    gameState.teams[gameState.currentTeamIndex].score += 100;
                }
            } else {
                playSound('wrong');
                gameState.wrongCount++;
            }

            gameState.history.push({
                title: q.title,
                question: q.question,
                userAnswer: JSON.stringify(pairs),
                correctAnswer: JSON.stringify(correctPairs),
                explanation: q.explanation,
                isCorrect: isAllCorrect
            });

            gameState.matchingState = { selectedLeft: null, connections: {}, confirmed: false };
            gameState.screen = 'FEEDBACK';
            render();
        }

        function renderOrderingQuestionHtml(q) {
            if (!gameState.orderingState.shuffledItems) {
                gameState.orderingState.shuffledItems = shuffleArray(q.items);
            }
            let listHtml = gameState.orderingState.shuffledItems.map((item, idx) => `
                <div class="flex justify-between items-center bg-slate-900 border border-slate-700 p-3 rounded-xl">
                    <span class="font-bold text-white">${idx + 1}. ${item}</span>
                    <div class="space-x-1 space-x-reverse">
                        <button onclick="moveOrderItem(${idx}, -1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs">⬆️</button>
                        <button onclick="moveOrderItem(${idx}, 1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs">⬇️</button>
                    </div>
                </div>
            `).join('');

            return `
                <div class="space-y-3">
                    <p class="text-xs text-sky-300">استخدم أزرار التحريك لترتيب العناصر بالشكل الصحيح:</p>
                    <div class="space-y-2">${listHtml}</div>
                    <button onclick="confirmOrdering()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition mt-2">تأكيد الترتيب</button>
                </div>
            `;
        }

        function moveOrderItem(index, direction) {
            let items = gameState.orderingState.shuffledItems;
            let targetIdx = index + direction;
            if (targetIdx >= 0 && targetIdx < items.length) {
                let temp = items[index];
                items[index] = items[targetIdx];
                items[targetIdx] = temp;
                render();
            }
        }

        function confirmOrdering() {
            clearInterval(gameState.timerInterval);
            let q = gameState.roundQuestions[gameState.currentQuestionIndex];
            let userOrder = gameState.orderingState.shuffledItems;
            let correctOrder = q.correctOrder;

            let isCorrect = userOrder.length === correctOrder.length && userOrder.every((val, i) => val === correctOrder[i]);

            if (isCorrect) {
                playSound('correct');
                gameState.score += 100;
                gameState.energy = Math.min(100, gameState.energy + 10);
                gameState.correctCount++;
                if (gameState.mode === 'teams') {
                    gameState.teams[gameState.currentTeamIndex].score += 100;
                }
            } else {
                playSound('wrong');
                gameState.wrongCount++;
            }

            gameState.history.push({
                title: q.title,
                question: q.question,
                userAnswer: userOrder.join(' ← '),
                correctAnswer: correctOrder.join(' ← '),
                explanation: q.explanation,
                isCorrect: isCorrect
            });

            gameState.orderingState = {};
            gameState.screen = 'FEEDBACK';
            render();
        }

        function nextStepAfterFeedback() {
            gameState.currentQuestionIndex++;
            if (gameState.mode === 'teams') {
                gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
            }

            if (gameState.currentQuestionIndex >= 10) {
                gameState.screen = 'FINISHED';
            } else {
                gameState.screen = gameState.mode === 'teams' ? 'TEAM_TRANSITION' : 'WHEEL_SPIN';
            }
            render();
        }

        function goToReview() {
            gameState.screen = 'REVIEW';
            render();
        }

        function restartGame() {
            gameState.screen = 'START';
            gameState.matchingState = { selectedLeft: null, connections: {}, confirmed: false };
            gameState.orderingState = {};
            render();
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
