        // نظام الصوتيات عبر Web Audio API
        class SoundFX {
            constructor() {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {}
            }
            playTone(freq, type, duration, delay = 0) {
                if (!this.ctx) return;
                setTimeout(() => {
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch(e) {}
                }, delay * 1000);
            }
            start() { this.playTone(400, 'sine', 0.1, 0); this.playTone(600, 'sine', 0.2, 0.1); }
            select() { this.playTone(500, 'triangle', 0.08); }
            correct() { this.playTone(523.25, 'sine', 0.1, 0); this.playTone(659.25, 'sine', 0.15, 0.1); }
            wrong() { this.playTone(180, 'sawtooth', 0.15, 0); }
            timeout() { this.playTone(250, 'square', 0.2, 0); }
            end() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.playTone(f, 'sine', 0.2, i * 0.1)); }

        // خوارزمية خلط الخيارات عشوائياً
        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

                }
                if (copy.type === 'matching' && copy.pairs) {
                    copy.shuffledRightPairs = shuffleArray(copy.pairs);
                }
                return copy;
            });

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            switch (gameState.screen) {
                case 'START': app.innerHTML = renderStartScreen(); break;
                case 'MODE_SELECTION': app.innerHTML = renderModeSelectionScreen(); break;
                case 'SETTINGS': app.innerHTML = renderSettingsScreen(); break;
                case 'EXPLORATION': app.innerHTML = renderExplorationScreen(); break;
                case 'QUESTION': app.innerHTML = renderQuestionScreen(); break;
                case 'FEEDBACK': app.innerHTML = renderFeedbackScreen(); break;
                case 'FINISHED': app.innerHTML = renderFinishedScreen(); break;
                case 'REVIEW': app.innerHTML = renderReviewScreen(); break;
            }
        }

        function renderQuestionScreen() {
            const q = gameState.activeQuestions[gameState.currentQuestionIndex];

            return `

                        ${gameState.mode === 'team' ? `<span class="bg-pink-500/10 text-pink-400 px-2.5 py-1 rounded-lg font-bold">دور: ${currentTeam.name}</span>` : `<span class="text-slate-300">${gameState.playerName}</span>`}

                    ${q.type === 'multiple-choice' ? `

                                <button onclick="selectOption('${opt.id}')" id="opt-${opt.id}" class="p-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl text-right text-xs text-slate-200 transition-all flex items-center justify-between cursor-pointer">

                            <p class="text-[11px] text-cyan-400">انقر على الجزء أولاً ثم انقر على الوظيفة أو الوصف المناسب له في اليسار:</p>

                                        const connectedRightId = gameState.matchingState.pairs[p.leftId];

                                        return `
                                        <div onclick="selectMatchingLeft(${p.leftId})" id="match-l-${p.leftId}" class="p-2.5 bg-slate-900 border ${gameState.matchingState.selectedLeft === p.leftId ? 'border-cyan-400 bg-cyan-950/40 ring-1 ring-cyan-400' : 'border-slate-800'} rounded-xl cursor-pointer text-white flex flex-col justify-between transition-all">
                                            <div class="flex justify-between items-center">

                                                ${connectedRightId ? `
                                                    <button onclick="event.stopPropagation(); disconnectSinglePair(${p.leftId});" class="text-[10px] bg-red-950/70 text-red-300 border border-red-800/80 px-1.5 py-0.5 rounded hover:bg-red-900">إلغاء ✕</button>

                            </div>

                        <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 text-[10px] block">النسبة المئوية:</span>
                            <strong class="text-cyan-400">${percentage}%</strong>
                        </div>
                        <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 text-[10px] block">الصحيحة:</span>
                            <strong class="text-emerald-400">${gameState.correctCount}</strong>
                        </div>
                        <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 text-[10px] block">الخاطئة:</span>
                            <strong class="text-red-400">${gameState.wrongCount}</strong>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-1 text-xs">
                        <button onclick="soundFx.select(); gameState.screen='REVIEW'; render();" class="flex-1 py-2 clean-card hover:bg-slate-800 text-white font-bold rounded-xl cursor-pointer">
                            🔍 مراجعة الإجابات
                        </button>
                        <button onclick="soundFx.start(); restartGame();" class="flex-1 py-2 accent-gradient text-white font-bold rounded-xl cursor-pointer">
                            🔄 إعادة السباق بخيارات جديدة
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function renderReviewScreen() {
            return `
            <div class="flex flex-col space-y-3 max-w-lg mx-auto w-full py-3">
                <div class="flex justify-between items-center clean-card p-3 rounded-xl text-xs">
                    <span class="font-bold text-cyan-400">مراجعة الإجابات</span>
                    <button onclick="soundFx.select(); gameState.screen='FINISHED'; render();" class="px-2.5 py-1 bg-slate-800 text-white rounded-lg">العودة</button>
                </div>

                <div class="space-y-2 max-h-[55vh] overflow-y-auto px-0.5 text-xs">
                    ${gameState.activeQuestions.map((q, index) => {
                        const userAns = gameState.userAnswers[index];
                        const isCorrect = userAns && userAns.correct;
                        return `
                        <div class="clean-card p-3 rounded-xl border ${isCorrect ? 'border-emerald-500/30' : 'border-red-500/30'} space-y-1">
                            <div class="flex justify-between items-center font-bold">
                                <span class="text-cyan-400">السؤال ${index + 1}</span>
                                <span class="${isCorrect ? 'text-emerald-400' : 'text-red-400'}">${isCorrect ? '✓ صحيح' : '✗ غير صحيح'}</span>
                            </div>
                            <p class="text-white text-[11px]">${q.question}</p>
                            <div class="bg-slate-900 p-2 rounded-lg space-y-0.5 text-[11px]">
                                <p class="text-slate-300">إجابتك: <strong class="${isCorrect ? 'text-emerald-400' : 'text-red-400'}">${userAns ? userAns.text : 'لم تجب'}</strong></p>
                                <p class="text-slate-300">الصحيحة: <strong class="text-cyan-400">${q.options ? q.options.find(o=>o.correct).text : 'نشاط توصيل'}</strong></p>
                                <p class="text-slate-400 pt-1 border-t border-slate-800"><strong>التفسير:</strong> ${q.explanation}</p>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
        }

        function goToModeSelection() { gameState.screen = 'MODE_SELECTION'; render(); }
        function setGameMode(mode) {
            gameState.mode = mode;
            if (mode === 'team') {
                gameState.teams = [{ name: 'فريق الياسمين', score: 0 }, { name: 'فريق البنفسج', score: 0 }];
            }
            gameState.screen = 'SETTINGS';
            render();
        }
        function setTeamCount(count) {
            gameState.teams = [];
            for (let i = 0; i < count; i++) gameState.teams.push({ name: `فريق ${i+1}`, score: 0 });
            render();
        }
        function confirmSoloSetup() {
            const input = document.getElementById('player-name-input');
            gameState.playerName = input && input.value.trim() !== '' ? input.value.trim() : 'الباحث الصغير';
            gameState.screen = 'EXPLORATION';
            render();
        }
        function confirmTeamSetup() {
            for (let i = 0; i < gameState.teams.length; i++) {
                const input = document.getElementById(`team-name-${i}`);
                if (input && input.value.trim() !== '') gameState.teams[i].name = input.value.trim();
            }
            gameState.screen = 'EXPLORATION';
            render();
        }
        function startActualQuiz() {
            randomizeQuizData();
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.stars = 0;
            gameState.correctCount = 0;
            gameState.wrongCount = 0;
            gameState.userAnswers = [];
            gameState.screen = 'QUESTION';
            startTimer();
            render();
        }
        function startTimer() {
            clearInterval(gameState.timerInterval);
            const q = gameState.activeQuestions[gameState.currentQuestionIndex];
            gameState.timer = q.timer || 30;
            gameState.timerInterval = setInterval(() => {
                gameState.timer--;
                const timerEl = document.getElementById('timer-display');
                if (timerEl) timerEl.innerText = `⏱️ ${gameState.timer} ث`;
                if (gameState.timer <= 0) {
                    clearInterval(gameState.timerInterval);
                    soundFx.timeout();
                    handleTimeout();
                }
            }, 1000);
        }
        function selectOption(optId) {
            soundFx.select();
            gameState.selectedAnswerId = optId;
            const q = gameState.activeQuestions[gameState.currentQuestionIndex];
            q.options.forEach(o => {
                const btn = document.getElementById(`opt-${o.id}`);
                if (btn) {
                    btn.className = o.id === optId ? 
                        "p-2.5 bg-cyan-950/80 border border-cyan-400 rounded-xl text-right text-xs text-white transition-all flex items-center justify-between cursor-pointer" :
                        "p-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl text-right text-xs text-slate-200 transition-all flex items-center justify-between cursor-pointer";
                }
            });
        }
        function selectMatchingLeft(id) {
            soundFx.select();
            gameState.matchingState.selectedLeft = (gameState.matchingState.selectedLeft === id) ? null : id;
            render();
        }
        function selectMatchingRight(rightId) {
            if (!gameState.matchingState.selectedLeft) return;
            soundFx.select();
            gameState.matchingState.pairs[gameState.matchingState.selectedLeft] = rightId;
            gameState.matchingState.selectedLeft = null;
            render();
        }
        function disconnectSinglePair(leftId) {
            soundFx.select();
            delete gameState.matchingState.pairs[leftId];
            if (gameState.matchingState.selectedLeft === leftId) {
                gameState.matchingState.selectedLeft = null;
            }
            render();
        }
        function confirmAnswer() {
            clearInterval(gameState.timerInterval);
            const q = gameState.activeQuestions[gameState.currentQuestionIndex];
            let isCorrect = false, userAnsText = "";
            if (q.type === 'multiple-choice') {
                if (!gameState.selectedAnswerId) {
                    gameState.userAnswers.push({ correct: false, text: 'لم يقدم إجابة' });
                    gameState.wrongCount++;
                    gameState.screen = 'FEEDBACK';
                    gameState.lastAnswerCorrect = false;
                    soundFx.wrong();
                    render();
                    return;
                }
                const selectedOpt = q.options.find(o => o.id === gameState.selectedAnswerId);
                isCorrect = selectedOpt.correct;
                userAnsText = selectedOpt.text;
            } else if (q.type === 'matching') {
                let correctCount = 0;
                q.pairs.forEach(p => { if (gameState.matchingState.pairs[p.leftId] === p.rightId) correctCount++; });
                isCorrect = (correctCount === q.pairs.length);
                userAnsText = `تم توصيل ${correctCount} من ${q.pairs.length}`;
            }
            gameState.userAnswers.push({ correct: isCorrect, text: userAnsText });
            if (isCorrect) {
                gameState.correctCount++;
                gameState.score += 100;
                gameState.stars++;
                if (gameState.mode === 'team') gameState.teams[gameState.currentTeamIndex].score += 100;
                soundFx.correct();
            } else {
                gameState.wrongCount++;
                soundFx.wrong();
            }
            gameState.lastAnswerCorrect = isCorrect;
            gameState.screen = 'FEEDBACK';
            gameState.selectedAnswerId = null;
            gameState.matchingState = { selectedLeft: null, pairs: {} };
            render();
        }
        function handleTimeout() {
            gameState.userAnswers.push({ correct: false, text: 'انتهى الوقت' });
            gameState.wrongCount++;
            gameState.lastAnswerCorrect = false;
            gameState.screen = 'FEEDBACK';
            render();
        }
        function nextQuestionOrFinish() {
            gameState.currentQuestionIndex++;
            if (gameState.mode === 'team') gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
            if (gameState.currentQuestionIndex >= gameState.activeQuestions.length) {
                soundFx.end();
                gameState.screen = 'FINISHED';
            } else {
                gameState.screen = 'QUESTION';
                startTimer();
            }
            render();
        }
        function restartGame() {
            randomizeQuizData();
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.stars = 0;
            gameState.correctCount = 0;
            gameState.wrongCount = 0;
            gameState.userAnswers = [];
            gameState.screen = 'START';
            render();
        }
        window.onload = function() {
            randomizeQuizData();
            render();
        };
    </script>
</body>
</html>
