        class SoundEngine {
            constructor() {
                this.muted = false;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playWhistle() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2400, now);
                osc.frequency.setValueAtTime(2800, now + 0.1);
                osc.frequency.setValueAtTime(2400, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playKick() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playGoal() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.12, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8 + idx * 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + 0.9 + idx * 0.05);
                });
            }

            playError() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(120, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

                id: 20,
                type: "mcq",
                topic: "مقاييس درجات الحرارة",
                question: "أي مجموعة من القيم تمثل درجات مرتبطة نقطتي تجمد وغليان الماء بصورة صحيحة؟",
                options: [
                    { text: "أ) 0°س و100°س", correct: false, key: 'A' },
                    { text: "ب) 32°F و212°F", correct: false, key: 'B' },
                    { text: "ج) 273K و373K", correct: false, key: 'C' },
                    { text: "د) جميع ما سبق", correct: true, key: 'D' }
                ],
                explanation: "تجمد الماء: 0°س = 32°F = 273K، وغليان الماء: 100°س = 212°F = 373K."

        let gameState = {
            screen: 'welcome', // welcome, mode_select, setup_teams, match_play, match_over, review_answers
            mode: 'solo', // 'solo' or 'team'
            subMode: 'challenge', // 'training' or 'challenge'
            teamName: 'فريق الطالب',
            awayName: 'الكمبيوتر',
            teamsList: [],
            currentTeamIndex: 0,
            questionIndex: 0,
            questionsOrder: [],
            shuffledOptions: {}, // Stores shuffled options for each question index
            scores: {},
            stats: { correct: 0, incorrect: 0, unanswered: 0 },
            history: [],
            timerSeconds: 30,
            timerInterval: null,
            paused: false,
            selectedOption: null,
            tfAnswer: null,
            orderItems: [],
            matchingPairs: {},
            activeMatchTerm: null,
            isAnswerSubmitted: false,
            lastGoalScored: 'none'
        };

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initGame() {
            gameState.questionsOrder = shuffle([...Array(QUESTIONS_BANK.length).keys()]);
            gameState.questionIndex = 0;
            gameState.stats = { correct: 0, incorrect: 0, unanswered: 0 };
            gameState.history = [];
            gameState.lastGoalScored = 'none';
            gameState.isAnswerSubmitted = false;
            
            // Shuffle option positions for every question to avoid any fixed pattern (like clustering between B and C)
            gameState.shuffledOptions = {};
            QUESTIONS_BANK.forEach((q, idx) => {
                if (q.options) {
                    const keys = ['أ', 'ب', 'ج', 'د'];
                    const clonedOpts = JSON.parse(JSON.stringify(q.options));
                    shuffle(clonedOpts);
                    // Re-assign display keys A, B, C, D
                    clonedOpts.forEach((opt, oIdx) => {
                        opt.key = keys[oIdx];
                        // Also adjust text prefix to match new key letter if text starts with option letter
                        opt.text = opt.text.replace(/^[أبجد]\)\s*/, keys[oIdx] + ') ');
                    });
                    gameState.shuffledOptions[idx] = clonedOpts;
                }
            });

            if (gameState.mode === 'solo') {
                gameState.scores = {
                    [gameState.teamName]: 0,
                    [gameState.awayName]: 0
                };
            } else {
                gameState.scores = {};
                gameState.teamsList.forEach(t => {
                    gameState.scores[t] = 0;
                });
                gameState.scores['الكمبيوتر المنافس'] = 0;
                gameState.currentTeamIndex = 0;
            }
            prepareCurrentQuestion();
        }

        function prepareCurrentQuestion() {
            const q = getCurrentQuestion();
            gameState.selectedOption = null;
            gameState.tfAnswer = null;
            gameState.isAnswerSubmitted = false;
            gameState.lastGoalScored = 'none';
            
            if (q.type === 'order') {
                gameState.orderItems = [...q.items].sort(() => Math.random() - 0.5);
            } else if (q.type === 'match') {
                gameState.matchingPairs = {};
                gameState.activeMatchTerm = null;
            }

            if (gameState.subMode === 'challenge') {
                gameState.timerSeconds = 30;
                startTimer();
            }
        }

        function getCurrentQuestion() {
            const qIdx = gameState.questionsOrder[gameState.questionIndex];
            return QUESTIONS_BANK[qIdx];
        }

        function startTimer() {
            stopTimer();
            if (gameState.subMode !== 'challenge' || gameState.isAnswerSubmitted) return;
            gameState.timerInterval = setInterval(() => {
                if (!gameState.paused && !gameState.isAnswerSubmitted) {
                    gameState.timerSeconds--;
                    if (gameState.timerSeconds <= 0) {
                        stopTimer();
                        handleTimeout();
                    }
                    render();
                }
            }, 1000);
        }

        function stopTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
        }

        function handleTimeout() {
            if (gameState.isAnswerSubmitted) return;
            gameState.isAnswerSubmitted = true;
            gameState.stats.unanswered++;
            sound.playError();
            
            const currentTeam = getCurrentTeamName();
            gameState.history.push({
                questionNum: gameState.questionIndex + 1,
                question: getCurrentQuestion().question,
                topic: getCurrentQuestion().topic,
                result: 'timeout',
                team: currentTeam,
                explanation: getCurrentQuestion().explanation
            });
            gameState.lastGoalScored = 'none';
            render();
        }

        function getCurrentTeamName() {
            if (gameState.mode === 'solo') return gameState.teamName;
            return gameState.teamsList[gameState.currentTeamIndex];
        }

        function submitAnswer() {
            if (gameState.isAnswerSubmitted) return;
            stopTimer();
            
            const q = getCurrentQuestion();
            const qIdx = gameState.questionsOrder[gameState.questionIndex];
            let isCorrect = false;

            if (q.type === 'mcq' || q.type === 'chart' || q.type === 'experiment' || q.type === 'visual') {
                if (gameState.selectedOption === null) return;
                const currentOpts = gameState.shuffledOptions[qIdx] || q.options;
                const selected = currentOpts[gameState.selectedOption];
                isCorrect = selected.correct;
            } else if (q.type === 'tf') {
                if (gameState.tfAnswer === null) return;
                isCorrect = (gameState.tfAnswer === q.correctAnswer);
            } else if (q.type === 'order') {
                isCorrect = JSON.stringify(gameState.orderItems) === JSON.stringify(q.correctOrder);
            } else if (q.type === 'match') {
                if (Object.keys(gameState.matchingPairs).length < q.listA.length) return;
                isCorrect = true;
                for (let k in q.correctPairs) {
                    if (gameState.matchingPairs[k] !== q.correctPairs[k]) {
                        isCorrect = false;
                        break;
                    }
                }
            }

            gameState.isAnswerSubmitted = true;
            const currentTeam = getCurrentTeamName();
            const awayTeam = gameState.mode === 'solo' ? gameState.awayName : 'الكمبيوتر المنافس';

            if (isCorrect) {
                gameState.stats.correct++;
                gameState.scores[currentTeam] = (gameState.scores[currentTeam] || 0) + 1;
                gameState.lastGoalScored = 'home';
                sound.playGoal();
            } else {
                gameState.stats.incorrect++;
                gameState.scores[awayTeam] = (gameState.scores[awayTeam] || 0) + 1;
                gameState.lastGoalScored = 'away';
                sound.playError();
            }

            gameState.history.push({
                questionNum: gameState.questionIndex + 1,
                question: q.question,
                topic: q.topic,
                result: isCorrect ? 'correct' : 'incorrect',
                team: currentTeam,
                explanation: q.explanation
            });

            render();
        }

        function nextQuestion() {
            gameState.questionIndex++;
            if (gameState.questionIndex >= 20) {
                gameState.screen = 'match_over';
                sound.playWhistle();
            } else {
                if (gameState.mode === 'team') {
                    gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teamsList.length;
                }
                prepareCurrentQuestion();
                gameState.screen = 'match_play';
            }
            render();
        }

            const app = document.getElementById('app');
            app.innerHTML = '';

            if (gameState.screen === 'welcome') {
                app.innerHTML = renderWelcomeScreen();
            } else if (gameState.screen === 'mode_select') {

            } else if (gameState.screen === 'setup_teams') {

            } else if (gameState.screen === 'match_play') {

            } else if (gameState.screen === 'match_over') {

            }
        }

                    <main class="flex-1 relative football-field p-4 md:p-6 flex flex-col items-center justify-center overflow-hidden">
                        
                        <div class="absolute inset-4 md:inset-8 field-border rounded-3xl pointer-events-none flex flex-col justify-between overflow-hidden opacity-40">
                            <div class="w-40 h-10 mx-auto border-b-2 border-x-2 border-white/70 goal-net rounded-b-xl flex items-center justify-center">
                                <span class="text-[10px] text-white/50">مرمى المنافس</span>
                            </div>
                            <div class="w-full h-0.5 center-line relative flex items-center justify-center">
                                <div class="w-24 h-24 center-circle absolute"></div>
                            </div>
                            <div class="w-40 h-10 mx-auto border-t-2 border-x-2 border-white/70 goal-net rounded-t-xl flex items-center justify-center">
                                <span class="text-[10px] text-white/50">مرمى فريقك</span>
                            </div>
                        </div>

                        ${gameState.lastGoalScored === 'home' ? `
                            <div class="absolute z-30 flex flex-col items-center animate-shoot-away">
                                <div class="w-12 h-12 bg-white rounded-full shadow-2xl flex items-center justify-center text-slate-950 text-xl font-bold border-2 border-slate-900">⚽</div>
                                <div class="bg-emerald-600 text-white font-black text-lg px-4 py-1 rounded-full shadow-xl mt-2 animate-bounce">⚽ جوووووووووول! إجابة صحيحة</div>
                            </div>
                        ` : ''}
                        ${gameState.lastGoalScored === 'away' ? `
                            <div class="absolute z-30 flex flex-col items-center animate-shoot-home">
                                <div class="w-12 h-12 bg-white rounded-full shadow-2xl flex items-center justify-center text-slate-950 text-xl font-bold border-2 border-slate-900">⚽</div>
                                <div class="bg-red-600 text-white font-black text-lg px-4 py-1 rounded-full shadow-xl mt-2 animate-bounce">❌ هدف للمنافس! إجابة خاطئة</div>
                            </div>
                        ` : ''}

                        <div class="relative z-10 w-full max-w-3xl bg-slate-900/95 border-2 border-emerald-500/40 rounded-3xl p-5 md:p-8 shadow-2xl backdrop-blur-md my-auto">
                            
                            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                                <div class="flex items-center gap-2">
                                    <span class="bg-emerald-500 text-slate-950 font-black px-2.5 py-0.5 rounded-lg text-xs">سؤال ${gameState.questionIndex + 1}</span>
                                    <span class="text-xs text-emerald-400 font-bold">${q.topic}</span>
                                </div>
                                <div class="text-xs text-slate-400 font-semibold">الدور: <span class="text-white">${currentTeam}</span></div>
                            </div>

                            <h3 class="text-lg md:text-xl font-bold text-white mb-6 leading-relaxed">
                                ${q.question}
                            </h3>

                            ${renderQuestionWidget(q)}

                            <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center">
                                <div class="text-xs text-slate-400">
                                    ${gameState.isAnswerSubmitted ? '<span class="text-emerald-400 font-bold">تم تقييم الإجابة</span>' : 'اختر الإجابة ثم اضغط تأكيد'}
                                </div>

                                ${!gameState.isAnswerSubmitted ? `
                                    <button onclick="submitAnswer();" class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-slate-950 font-black px-6 py-3 rounded-xl shadow-lg transition-all transform hover:scale-105 border border-emerald-300">
                                        تأكيد الإجابة ⚽
                                    </button>
                                ` : `
                                    <button onclick="sound.playWhistle(); nextQuestion();" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black px-8 py-3 rounded-xl shadow-lg transition-all animate-pulse flex items-center gap-2">
                                        <span>السؤال التالي</span>
                                        <i class="fa-solid fa-arrow-left"></i>
                                    </button>
                                `}
                            </div>

                            ${gameState.isAnswerSubmitted ? `
                                <div class="mt-4 p-4 rounded-2xl bg-slate-800/90 border border-emerald-500/30 text-slate-200 text-sm animate-fade-in">
                                    <div class="font-bold text-emerald-400 mb-1 flex items-center gap-2">
                                        <i class="fa-solid fa-lightbulb"></i>
                                        <span>💡 لماذا؟ (التفسير العلمي):</span>
                                    </div>
                                    <p class="leading-relaxed">${q.explanation}</p>
                                </div>
                            ` : ''}

                        </div>
                    </main>
                </div>
            `;
        }

        function renderQuestionWidget(q) {
            const qIdx = gameState.questionsOrder[gameState.questionIndex];
            if (q.type === 'mcq' || q.type === 'chart' || q.type === 'experiment' || q.type === 'visual') {
                const currentOpts = gameState.shuffledOptions[qIdx] || q.options;
                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${currentOpts.map((opt, idx) => {
                            let btnStyle = "bg-slate-800/80 border-slate-700 hover:border-emerald-500/60 text-slate-200";
                            if (gameState.selectedOption === idx) {
                                btnStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-300 shadow-md";
                            }
                            if (gameState.isAnswerSubmitted) {
                                if (opt.correct) {
                                    btnStyle = "bg-green-600/30 border-green-500 text-green-300 font-bold";
                                } else if (gameState.selectedOption === idx && !opt.correct) {
                                    btnStyle = "bg-red-600/30 border-red-500 text-red-300";
                                }
                            }
                            return `
                                <button ${gameState.isAnswerSubmitted ? 'disabled' : ''} onclick="gameState.selectedOption=${idx}; render();" class="p-4 rounded-2xl border-2 text-right transition-all flex items-center justify-between ${btnStyle}">
                                    <span class="font-semibold text-sm md:text-base">${opt.text}</span>
                                    <span class="w-6 h-6 rounded-full border border-slate-600 flex items-center justify-center text-xs font-bold ${gameState.selectedOption===idx ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'text-slate-400'}">${opt.key}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            } else if (q.type === 'tf') {
                return `
                    <div class="flex gap-4 justify-center py-4">
                        <button ${gameState.isAnswerSubmitted ? 'disabled' : ''} onclick="gameState.tfAnswer=true; render();" class="flex-1 p-6 rounded-2xl border-2 font-black text-xl flex flex-col items-center gap-2 transition-all ${gameState.tfAnswer===true ? 'border-emerald-500 bg-emerald-500/20 text-emerald-300' : 'border-slate-700 bg-slate-800/60 text-slate-300 hover:border-slate-500'}">
                            <i class="fa-solid fa-circle-check text-3xl text-green-400"></i>
                            <span>صح</span>
                        </button>
                        <button ${gameState.isAnswerSubmitted ? 'disabled' : ''} onclick="gameState.tfAnswer=false; render();" class="flex-1 p-6 rounded-2xl border-2 font-black text-xl flex flex-col items-center gap-2 transition-all ${gameState.tfAnswer===false ? 'border-emerald-500 bg-emerald-500/20 text-emerald-300' : 'border-slate-700 bg-slate-800/60 text-slate-300 hover:border-slate-500'}">
                            <i class="fa-solid fa-circle-xmark text-3xl text-red-400"></i>
                            <span>خطأ</span>
                        </button>
                    </div>
                `;
            } else if (q.type === 'order') {
                return `
                    <div class="space-y-2">
                        <div class="text-xs text-amber-400 mb-2"><i class="fa-solid fa-arrows-up-down"></i> رتب الخطوات بالشكل الصحيح باستخدام أزرار الترتيب:</div>
                        ${gameState.orderItems.map((item, idx) => `
                            <div class="bg-slate-800 border border-slate-700 p-3 rounded-xl flex items-center justify-between text-sm">
                                <span class="font-semibold text-slate-200"><span class="text-emerald-400 font-bold ml-2">${idx+1}.</span> ${item}</span>
                                ${!gameState.isAnswerSubmitted ? `
                                    <div class="flex gap-1">
                                        <button onclick="moveOrderItem(${idx}, -1)" ${idx===0?'disabled':''} class="p-1.5 px-2.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-30 rounded-lg text-xs"><i class="fa-solid fa-chevron-up"></i></button>
                                        <button onclick="moveOrderItem(${idx}, 1)" ${idx===gameState.orderItems.length-1?'disabled':''} class="p-1.5 px-2.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-30 rounded-lg text-xs"><i class="fa-solid fa-chevron-down"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (q.type === 'match') {
                return `
                    <div>
                        <div class="text-xs text-amber-400 mb-3"><i class="fa-solid fa-hand-pointer"></i> اضغط على المصطلح من القائمة أ ثم اضغط على تعريفه المناسب في القائمة ب:</div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <div class="text-xs font-bold text-emerald-400">القائمة أ (المصطلحات):</div>
                                ${q.listA.map(term => {
                                    const isSelected = gameState.activeMatchTerm === term;
                                    const isMatched = gameState.matchingPairs[term];
                                    return `
                                        <button ${gameState.isAnswerSubmitted ? 'disabled' : ''} onclick="gameState.activeMatchTerm='${term}'; render();" class="w-full text-right p-3 rounded-xl border transition-all text-sm font-bold flex items-center justify-between ${isSelected ? 'border-emerald-500 bg-emerald-500/20 text-emerald-300' : isMatched ? 'border-green-600/50 bg-green-950/20 text-green-300' : 'border-slate-700 bg-slate-800 text-slate-200'}">
                                            <span>${term}</span>
                                            ${isMatched ? `<span class="text-xs text-emerald-400">✓ (${isMatched})</span>` : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                            <div class="space-y-2">
                                <div class="text-xs font-bold text-emerald-400">القائمة ب (التعاريف):</div>
                                ${q.listB.map(def => {
                                    return `
                                        <button ${gameState.isAnswerSubmitted || !gameState.activeMatchTerm ? 'disabled' : ''} onclick="matchTermWithDef('${def}');" class="w-full text-right p-3 rounded-xl border border-slate-700 bg-slate-800 hover:border-emerald-400 text-xs text-slate-200 transition-all">
                                            ${def}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        ${Object.keys(gameState.matchingPairs).length > 0 && !gameState.isAnswerSubmitted ? `
                            <div class="mt-3">
                                <button onclick="gameState.matchingPairs={}; gameState.activeMatchTerm=null; render();" class="text-xs text-red-400 hover:text-red-300 underline font-semibold">
                                    <i class="fa-solid fa-rotate-left"></i> ↩️ إلغاء التوصيل وإعادة المحاولة
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
            return '';
        }

        function moveOrderItem(index, direction) {
            const target = index + direction;
            if (target < 0 || target >= gameState.orderItems.length) return;
            const temp = gameState.orderItems[index];
            gameState.orderItems[index] = gameState.orderItems[target];
            gameState.orderItems[target] = temp;
            render();
        }

        function matchTermWithDef(def) {
            if (!gameState.activeMatchTerm) return;
            gameState.matchingPairs[gameState.activeMatchTerm] = def;
            gameState.activeMatchTerm = null;
            render();
        }

        function renderPauseModal() {
            if (!gameState.paused) return;
            const div = document.createElement('div');
            div.id = 'pauseModal';
            div.className = 'fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4';
            div.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl">
                    <h3 class="text-xl font-black text-white mb-2">المباراة متوقفة مؤقتاً</h3>
                    <p class="text-xs text-slate-400 mb-6">خذ استراحة قصيرة، يمكنك استئناف المباراة في أي وقت.</p>
                    <div class="space-y-3">
                        <button onclick="gameState.paused=false; document.getElementById('pauseModal').remove(); startTimer();" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl shadow-lg">
                            استئناف المباراة
                        </button>
                        <button onclick="gameState.screen='welcome'; document.getElementById('pauseModal').remove(); render();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl border border-slate-700">
                            الانسحاب للرئيسية
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(div);
        }

        function renderMatchOverScreen() {
            const currentTeam = gameState.mode === 'solo' ? gameState.teamName : gameState.teamsList[0];
            const myScore = gameState.scores[currentTeam] || 0;
            const awayScore = gameState.scores[gameState.mode === 'solo' ? gameState.awayName : 'الكمبيوتر المنافس'] || 0;

            let resultMsg = "";
            let resultColor = "text-emerald-400";
            if (myScore > awayScore) {
                resultMsg = "🏆 فوز رائع! لقد أصبحت بطل التحدي العلمي!";
            } else if (myScore === awayScore) {
                resultMsg = "🤝 مباراة قوية! تعادل رائع بين الفريقين!";
                resultColor = "text-amber-400";
            } else {
                resultMsg = "💪 مباراة رائعة! حاول مرة أخرى وحقق الفوز!";
                resultColor = "text-red-400";
            }

            const totalAnswered = gameState.stats.correct + gameState.stats.incorrect;
            const percentage = totalAnswered > 0 ? Math.round((gameState.stats.correct / 20) * 100) : 0;

            let levelTitle = "";
            let levelBadge = "";
            if (percentage >= 90) { levelTitle = "بطل العلوم"; levelBadge = "🏆"; }
            else if (percentage >= 80) { levelTitle = "نجم العلوم"; levelBadge = "⚽"; }
            else if (percentage >= 70) { levelTitle = "لاعب علمي متميز"; levelBadge = "🥇"; }
            else if (percentage >= 60) { levelTitle = "مستكشف العلوم"; levelBadge = "🔬"; }
            else { levelTitle = "متدرب العلوم"; levelBadge = "🌱"; }

            return `
                <div class="flex-1 flex flex-col items-center justify-center p-4 bg-gradient-to-b from-slate-900 to-slate-950 text-white overflow-y-auto py-10">
                    <div class="w-full max-w-2xl bg-slate-900/95 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-md text-center">
                        <div class="text-4xl mb-2">${levelBadge}</div>
                        <h2 class="text-2xl md:text-3xl font-black mb-2 ${resultColor}">${resultMsg}</h2>
                        <p class="text-xs text-slate-400 mb-6">نتائج وتقييم أداء الوحدة الثالثة - منهج كامبردج</p>

                        <div class="bg-slate-950/80 p-6 rounded-2xl border border-slate-800 mb-6 flex items-center justify-around">
                            <div class="text-center">
                                <div class="text-xs text-emerald-400 font-bold mb-1">${currentTeam}</div>
                                <div class="text-4xl font-black text-white">${myScore} ⚽</div>
                            </div>
                            <div class="text-2xl text-slate-600 font-bold">VS</div>
                            <div class="text-center">
                                <div class="text-xs text-red-400 font-bold">المنافس</div>
                                <div class="text-4xl font-black text-white">${awayScore} ⚽</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                                <div class="text-xs text-slate-400">إجابات صحيحة</div>
                                <div class="text-xl font-black text-green-400 mt-1">${gameState.stats.correct}</div>
                            </div>
                            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                                <div class="text-xs text-slate-400">إجابات خاطئة</div>
                                <div class="text-xl font-black text-red-400 mt-1">${gameState.stats.incorrect}</div>
                            </div>
                            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                                <div class="text-xs text-slate-400">نسبة الإتقان</div>
                                <div class="text-xl font-black text-emerald-400 mt-1">${percentage}%</div>
                            </div>
                            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                                <div class="text-xs text-slate-400">مستوى اللاعب</div>
                                <div class="text-sm font-black text-amber-400 mt-1 truncate">${levelTitle}</div>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-3 justify-center">
                            <button onclick="initGame(); gameState.screen='match_play'; render();" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-6 py-3.5 rounded-xl shadow-lg transition-all flex items-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>إعادة المباراة</span>
                            </button>
                            <button onclick="gameState.screen='review_answers'; render();" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-6 py-3.5 rounded-xl border border-slate-700 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-clipboard-list"></i>
                                <span>مراجعة الإجابات</span>
                            </button>
                            <button onclick="gameState.screen='welcome'; render();" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-3.5 rounded-xl border border-slate-700 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-house"></i>
                                <span>الرئيسية</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReviewScreen() {
            return `
                <div class="flex-1 flex flex-col p-4 md:p-8 bg-slate-950 text-white overflow-y-auto">
                    <div class="max-w-4xl mx-auto w-full">
                        <div class="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
                            <div>
                                <h2 class="text-2xl font-black text-emerald-400">📋 سجل مراجعة إجابات المباراة</h2>
                                <p class="text-xs text-slate-400 mt-1">تتبع إجاباتك السابقة والتفسيرات العلمية الدقيقة للوحدة الثالثة</p>
                            </div>
                            <button onclick="gameState.screen='match_over'; render();" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold border border-slate-700">
                                العودة لنتيجة المباراة
                            </button>
                        </div>

                        <div class="space-y-4">
                            ${gameState.history.map(item => `
                                <div class="bg-slate-900 border ${item.result==='correct' ? 'border-green-500/40' : 'border-red-500/40'} p-5 rounded-2xl shadow-lg">
                                    <div class="flex items-center justify-between mb-2">
                                        <div class="flex items-center gap-2">
                                            <span class="bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded text-xs font-bold">سؤال ${item.questionNum}</span>
                                            <span class="text-xs text-emerald-400 font-semibold">${item.topic}</span>
                                        </div>
                                        <div>
                                            ${item.result==='correct' ? '<span class="text-xs bg-green-500/20 text-green-400 px-2.5 py-1 rounded-full font-bold">✓ إجابة صحيحة (هدف)</span>' : '<span class="text-xs bg-red-500/20 text-red-400 px-2.5 py-1 rounded-full font-bold">✗ إجابة خاطئة (هدف للمنافس)</span>'}
                                        </div>
                                    </div>
                                    <h4 class="text-base font-bold text-white mb-3">${item.question}</h4>
                                    <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/80 text-xs text-slate-300">
                                        <span class="font-bold text-emerald-400 ml-1">💡 التفسير العلمي:</span> ${item.explanation}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
