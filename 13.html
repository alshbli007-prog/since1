    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playBoxOpen() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playCorrect() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
            playWrong() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(120, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
            playVictory() {
                this.init();
                const notes = [300, 450, 600, 750, 950];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + (idx * 0.12);
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                });
            }
        }
        const sfx = new SoundFX();
    </script>

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initRoundQuestions() {
            const shuffled = shuffleArray(MASTER_QUESTION_BANK);
            state.currentRoundQuestions = shuffled.slice(0, 10).map(q => {
                let cloned = JSON.parse(JSON.stringify(q));
                if (cloned.type === 'mcq' || cloned.type === 'true_false') {
                    cloned.options = shuffleArray(cloned.options);
                } else if (cloned.type === 'matching') {
                    cloned.shuffledAnswers = shuffleArray(cloned.pairs.map(p => p.answer));
                } else if (cloned.type === 'ordering') {
                    cloned.steps = shuffleArray(cloned.steps);
                }
                return cloned;
            });
            state.currentQuestionIndex = 0;
            state.openedBoxes = [];
            state.score = 0;
            state.stars = 0;
            state.labEnergy = 0;
            state.answersHistory = [];
        }

            const appEl = document.getElementById('app');

                    break;
                case 'MODE_SELECTION':
                    appEl.innerHTML = renderModeSelectionScreen();
                    break;
                case 'PLAYER_SETUP':
                    appEl.innerHTML = renderPlayerSetupScreen();
                    break;
                case 'PLAYING':
                    appEl.innerHTML = renderLabDashboard();
                    break;
                case 'QUESTION_VIEW':
                    appEl.innerHTML = renderQuestionBoxModal();
                    break;
                case 'FEEDBACK_VIEW':

                    break;

                if (state.timerSeconds <= 0) {
                    clearInterval(state.timerInterval);
                    handleTimeOut();

                        <span class="text-sm font-bold text-slate-200">${idx+1}. ${step}</span>
                        <div class="flex gap-1">
                            <button onclick="moveStep(${idx}, -1)" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-white"><i class="fa-solid fa-arrow-up"></i></button>
                            <button onclick="moveStep(${idx}, 1)" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-white"><i class="fa-solid fa-arrow-down"></i></button>
                        </div>
                    </div>
                    `;
                });
                html += '</div>';
                return html;
            }
            return '';
        }

        function updateMatchingSelection(idx, val) {
            state.matchingSelections[idx] = val;
        }

        function moveStep(idx, direction) {
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= state.orderingSteps.length) return;
            const temp = state.orderingSteps[idx];
            state.orderingSteps[idx] = state.orderingSteps[newIdx];
            state.orderingSteps[newIdx] = temp;
            render();
        }

        function validateAndSubmitAnswer() {
            if (state.timerInterval) clearInterval(state.timerInterval);

            const q = state.currentRoundQuestions[state.currentQuestionIndex];
            let isCorrect = false;

            if (q.type === 'mcq' || q.type === 'true_false') {
                if (!state.selectedOptionId) {
                    alertBoxModal("يرجى اختيار إجابة أولاً.");
                    return;
                }
                isCorrect = state.selectedOptionId === q.correctId;
            } else if (q.type === 'matching') {
                let allCorrect = true;
                q.pairs.forEach((pair, idx) => {
                    if (state.matchingSelections[idx] !== pair.answer) {
                        allCorrect = false;
                    }
                });
                isCorrect = allCorrect;
            } else if (q.type === 'ordering') {
                isCorrect = JSON.stringify(state.orderingSteps) === JSON.stringify(q.steps);
            }

            submitAnswer(isCorrect);
        }

        function alertBoxModal(msg) {
            const div = document.createElement('div');
            div.className = "fixed top-6 left-1/2 transform -translate-x-1/2 bg-amber-500 text-slate-950 font-bold px-6 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-2";
            div.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${msg}`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }

        function submitAnswer(isCorrect) {
            const q = state.currentRoundQuestions[state.currentQuestionIndex];
            
            if (isCorrect) {
                sfx.playCorrect();
                state.score += 100;
                state.stars += 1;
                state.labEnergy = Math.min(100, state.labEnergy + 10);
                if (state.gameMode === 'team') {
                    state.teams[state.currentTeamIndex].score += 100;
                    state.teams[state.currentTeamIndex].stars += 1;
                }
            } else {
                sfx.playWrong();
            }

            state.answersHistory.push({
                question: q.question,
                isCorrect: isCorrect,
                why: q.why,
                concept: q.concept
            });

            state.openedBoxes.push(state.selectedBoxIndex);
            state.view = 'FEEDBACK_VIEW';
            render();
        }

        function renderFeedbackModal() {
            const lastAns = state.answersHistory[state.answersHistory.length - 1];
            const isCorrect = lastAns.isCorrect;

            return `
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div class="bg-slate-900 border ${isCorrect ? 'border-emerald-500/50' : 'border-rose-500/50'} rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl text-center">
                    
                    <div class="w-16 h-16 mx-auto rounded-full flex items-center justify-center text-3xl mb-4 ${isCorrect ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500' : 'bg-rose-500/20 text-rose-400 border border-rose-500'}">
                        <i class="fa-solid ${isCorrect ? 'fa-check' : 'fa-xmark'}"></i>
                    </div>

                    <h3 class="text-2xl font-bold ${isCorrect ? 'text-emerald-400' : 'text-rose-400'} mb-2">
                        ${isCorrect ? 'إجابة صحيحة!' : 'إجابة غير صحيحة'}
                    </h3>

                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 text-right mb-6">
                        <span class="text-xs font-bold text-cyan-300 block mb-1"><i class="fa-solid fa-lightbulb"></i> لماذا؟</span>
                        <p class="text-sm text-slate-200 leading-relaxed">${lastAns.why}</p>
                    </div>

                    <button onclick="proceedBackToLab()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        متابعة التحدي <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>
            `;
        }

        function proceedBackToLab() {
            if (state.gameMode === 'team') {
                state.currentTeamIndex = (state.currentTeamIndex + 1) % state.teams.length;
            }

            if (state.openedBoxes.length >= 10) {
                sfx.playVictory();
                state.view = 'FINISHED';
            } else {
                state.view = 'PLAYING';
            }
            render();
        }

        function renderFinishedScreen() {
            const currentName = state.gameMode === 'team' ? state.teams.map(t => `${t.name}: ${t.score} نقطة`).join(' | ') : state.playerName;
            const percentage = (state.score / 1000) * 100;
            
            let rankTitle = "🌱 واصل الاستكشاف";
            let rankDesc = "أنت على الطريق الصحيح، راجع درس التبخر لتصبح خبيراً علمياً.";
            if (percentage >= 90) {
                rankTitle = "🏆 عبقري حالات المادة";
                rankDesc = "مذهل! أظهرت فهماً استثنائياً لسر التبخر وعوامل التأثير.";
            } else if (percentage >= 80) {
                rankTitle = "🥇 خبير التبخر";
                rankDesc = "ممتاز جداً! لديك معرفة علمية متقدمة ورائعة.";
            } else if (percentage >= 70) {
                rankTitle = "🥈 مستكشف علمي";
                rankDesc = "جيد جداً! استكشفت معظم أسرار التبخر بنجاح.";
            } else if (percentage >= 60) {
                rankTitle = "🥉 باحث واعد";
                rankDesc = "أداء طيب، يمكنك مراجعة المفهوم لتحسين نتيجتك.";
            }

            return `
            <div class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-900">
                <div class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl text-center">
                    <div class="text-5xl mb-3">🎉</div>
                    <h2 class="text-3xl font-black text-white mb-1">اكتمل مختبر التبخر بنجاح!</h2>
                    <p class="text-sm text-cyan-300 mb-6">${currentName}</p>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400 block">النقاط الإجمالية</span>
                            <span class="text-xl font-black text-amber-400">${state.score}/1000</span>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400 block">الإجابات الصحيحة</span>
                            <span class="text-xl font-black text-emerald-400">${state.stars}/10</span>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400 block">النجوم المكتسبة</span>
                            <span class="text-xl font-black text-amber-300">⭐ ${state.stars}</span>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400 block">النسبة المئوية</span>
                            <span class="text-xl font-black text-cyan-400">${percentage}%</span>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-blue-600/30 to-cyan-600/30 border border-cyan-400/40 rounded-2xl p-6 mb-6">
                        <span class="text-2xl block mb-1">${rankTitle}</span>
                        <p class="text-xs text-slate-300">${rankDesc}</p>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="state.view='REVIEW'; render();" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-magnifying-glass"></i> مراجعة التحديات
                        </button>
                        <button onclick="restartGame()" class="bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate"></i> العب من جديد
                        </button>
                    </div>
                </div>
            </div>
            `;
        }

        function renderReviewScreen() {
            let html = `
            <div class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-900">
                <div class="max-w-3xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col max-h-[85vh]">
                    <h2 class="text-2xl font-bold text-white mb-4 text-center"><i class="fa-solid fa-clipboard-question text-cyan-400"></i> مراجعة إجابات التحديات</h2>
                    
                    <div class="flex-1 overflow-y-auto space-y-4 pr-2 mb-6">
            `;

            state.answersHistory.forEach((item, idx) => {
                html += `
                <div class="bg-slate-900/80 border ${item.isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'} rounded-2xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-cyan-300">السؤال (${item.concept})</span>
                        <span class="text-xs font-bold ${item.isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${item.isCorrect ? 'صحيح ✓' : 'خطأ ✗'}</span>
                    </div>
                    <p class="text-sm text-white font-medium mb-2">${item.question}</p>
                    <div class="bg-slate-800/90 p-3 rounded-xl border border-slate-700 text-xs text-slate-300">
                        <span class="font-bold text-cyan-400 block mb-1">الشرح العلمي (لماذا؟):</span>
                        ${item.why}
                    </div>
                </div>
                `;
            });

            html += `
                    </div>
                    <button onclick="state.view='FINISHED'; render();" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition">
                        العودة لنتيجة المختبر
                    </button>
                </div>
            </div>
            `;
            return html;
        }

        function restartGame() {
            initRoundQuestions();
            state.view = 'PLAYING';
            render();
        }

        window.onload = function() {
            render();
        };
    </script>

    <div id="app" class="flex flex-col min-h-screen"></div>

</body>
</html>
