        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, delay = 0) {
                try {
                    this.init();
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    }, delay * 1000);
                } catch(e) {}
            }
            playStart() {
                this.playTone(300, 'sine', 0.2, 0);

        function prepareQuestions() {
            // Force a balanced correct answer key distribution across a, b, c, d (e.g. indices 0, 1, 2, 3)
            // Questions 1, 5, 10 -> 'a' (index 0)
            // Questions 2, 6 -> 'b' (index 1)
            // Questions 3, 7 -> 'c' (index 2)
            // Questions 4 -> 'd' (index 3)
            const preferredCorrectIndices = { 0: 0, 1: 1, 2: 2, 3: 3, 4: 0, 5: 1, 6: 2, 7: 0, 9: 0 };

            QUESTIONS = MASTER_QUESTIONS.map((q, qIdx) => {
                let qCopy = JSON.parse(JSON.stringify(q));
                if (qCopy.type === 'mcq') {
                    // Find correct option object
                    const correctObj = qCopy.options.find(o => o.text === qCopy.correctText);
                    // Remove correctObj from options
                    let otherOpts = qCopy.options.filter(o => o.text !== qCopy.correctText);
                    // Shuffle other options
                    otherOpts.sort(() => Math.random() - 0.5);

                    // Determine target index for correct answer
                    let targetIdx = preferredCorrectIndices[qIdx] !== undefined ? preferredCorrectIndices[qIdx] : Math.floor(Math.random() * 4);
                    
                    let finalOpts = [];
                    let otherIdx = 0;
                    for (let i = 0; i < 4; i++) {
                        if (i === targetIdx) {
                            finalOpts.push(correctObj);
                        } else if (otherOpts[otherIdx]) {
                            finalOpts.push(otherOpts[otherIdx]);
                            otherIdx++;
                        }
                    }
                    qCopy.options = finalOpts.map((o, idx) => ({
                        key: ['a', 'b', 'c', 'd'][idx],
                        text: o.text
                    }));
                    qCopy.correct = ['a', 'b', 'c', 'd'][targetIdx];
                }
                return qCopy;
            });
        }

                                    <label class="block text-sm font-bold text-slate-300 mb-2">أسماء الفرق المشاركة:</label>

                                        ${gameState.teams.map((t, idx) => `
                                            <input type="text" data-team-index="${idx}" value="${t.name}" placeholder="اسم الفريق ${idx + 1}" class="team-input w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500 text-right">

        }

        function setGameMode(mode) {
            gameState.mode = mode;
            if (mode === 'team' && gameState.teams.length === 0) {
                gameState.teams = [
                    { name: "فريق ألفا", score: 0 },
                    { name: "فريق بيتا", score: 0 }
                ];
            }
            render();
        }

        function setTeamCount(count) {
            let newTeams = [];
            for (let i = 0; i < count; i++) {
                newTeams.push({
                    name: gameState.teams[i] ? gameState.teams[i].name : `فريق ${i + 1}`,
                    score: 0
                });
            }
            gameState.teams = newTeams;
            render();
        }

        function goToSetup() {
            soundFX.playSelect();
            gameState.view = 'setup';
            if (gameState.mode === 'team' && gameState.teams.length === 0) {
                gameState.teams = [{ name: "فريق الصقور", score: 0 }, { name: "فريق النجوم", score: 0 }];
            }
            render();
        }

        function startGameSession() {
            soundFX.playStart();
            prepareQuestions(); // Reshuffle options to ensure fresh distribution on every new game

            if (gameState.mode === 'solo') {
                const input = document.getElementById('player-name-input');
                gameState.playerName = input && input.value.trim() !== '' ? input.value.trim() : 'الممتسابق البطل';
            } else {
                const inputs = document.querySelectorAll('.team-input');
                inputs.forEach((inp, idx) => {
                    if (gameState.teams[idx]) {
                        gameState.teams[idx].name = inp.value.trim() !== '' ? inp.value.trim() : `فريق ${idx + 1}`;
                    }
                });
            }
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.wrongCount = 0;
            gameState.unansweredCount = 0;
            gameState.answersHistory = [];
            gameState.view = 'playing';
            initQuestionState();
        }

        function initQuestionState() {
            const q = QUESTIONS[gameState.currentQuestionIndex];
            gameState.timer = q.time;
            gameState.selectedOption = null;
            gameState.isConfirmed = false;
            gameState.lifelineActiveState = { eliminatedOptions: [], expertMessage: '' };
            gameState.matchingState = { selectedLeft: null, connections: {} };
            
            if (q.type === 'ordering') {
                let shuffled = [...q.items.map(item => item.id)];
                shuffled.sort(() => Math.random() - 0.5);
                gameState.orderingState.userOrder = shuffled;
            }

            startTimer();
            render();
        }

        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                if (gameState.timer > 0) {
                    gameState.timer--;
                    if (gameState.timer <= 5) {
                        soundFX.playTimerTick();
                    }
                    updateTimerDisplay();
                } else {
                    clearInterval(gameState.timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if (el) {
                el.innerText = `${gameState.timer} ث`;
                if (gameState.timer <= 10) {
                    el.classList.add('text-red-500', 'animate-pulse');
                }
            }
        }

        function handleTimeOut() {
            if (gameState.isConfirmed) return;
            gameState.unansweredCount++;
            const q = QUESTIONS[gameState.currentQuestionIndex];
            gameState.answersHistory.push({
                questionNumber: gameState.currentQuestionIndex + 1,
                questionText: q.text,
                userAnswer: "انتهى الوقت",
                correctAnswer: getCorrectAnswerText(q),
                isCorrect: false,
                explanation: q.explanation
            });
            goToFeedback(false);
        }

        function getCorrectAnswerText(q) {
            if (q.type === 'mcq') {
                const correctOpt = q.options.find(o => o.key === q.correct);
                return correctOpt ? `${q.correct.toUpperCase()}) ${correctOpt.text}` : q.correct;
            } else if (q.type === 'matching') {
                return "توصيل صحيح للعلاقات العلمية";
            } else if (q.type === 'ordering') {
                return "الترتيب الصحيح لدرجات الحرارة من الأقل للأعلى";
            }
            return "";
        }

                                        <circle cx="50" cy="125" r="16" fill="#f59e0b"/>
                                    </svg>
                                    <div class="text-[11px] text-slate-300 space-y-8 font-mono pl-2">
                                        <div class="bg-slate-950 px-2 py-1 rounded border border-slate-800">212°F</div>
                                        <div class="bg-slate-950 px-2 py-1 rounded border border-slate-800">32°F</div>
                                    </div>
                                </div>
                            </div>
                            <!-- Thermometer Drawing C -->
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col items-center">
                                <span class="text-slate-200 font-bold text-xs mb-3">رسم مقياس C</span>
                                <div class="flex items-center gap-6">
                                    <svg viewBox="0 0 100 150" class="w-24 h-32">
                                        <rect x="35" y="10" width="30" height="110" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
                                        <rect x="44" y="25" width="12" height="90" rx="6" fill="#a855f7"/>
                                        <circle cx="50" cy="125" r="16" fill="#a855f7"/>
                                    </svg>
                                    <div class="text-[11px] text-slate-300 space-y-8 font-mono pl-2">
                                        <div class="bg-slate-950 px-2 py-1 rounded border border-slate-800">373K</div>
                                        <div class="bg-slate-950 px-2 py-1 rounded border border-slate-800">273K</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                case 'final_challenge_visual':
                    return `
                        <div class="flex flex-wrap gap-4 justify-center items-center text-xs text-slate-300 w-full px-4">
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center">
                                <p class="text-slate-200 font-bold mb-1">سلسيوس</p>
                                <p>تدريج مئوي</p>
                            </div>
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center">
                                <p class="text-slate-200 font-bold mb-1">كلفن</p>
                                <p>الصفر المطلق</p>
                            </div>
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center">
                                <p class="text-slate-200 font-bold mb-1">فهرنهايت</p>
                                <p>تدريج تقليدي</p>
                            </div>
                        </div>
                    `;
                default:
                    return '';
            }
        }

        function renderInteractionArea(q) {
            if (q.type === 'mcq') {
                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${q.options.map((opt, i) => {
                            const isEliminated = gameState.lifelineActiveState.eliminatedOptions.includes(opt.key);
                            const isSelected = gameState.selectedOption === opt.key;
                            const labelLetter = ['أ', 'ب', 'ج', 'د'][i];
                            
                            if (isEliminated) {
                                return `<div class="p-3 bg-slate-950/40 border border-slate-900 rounded-xl opacity-30 text-slate-600 flex items-center gap-3 cursor-not-allowed">
                                    <span class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center font-bold text-xs">${labelLetter}</span>
                                    <span class="text-sm">${opt.text}</span>
                                </div>`;
                            }

                            return `
                                <button onclick="selectOption('${opt.key}')" ${gameState.isConfirmed ? 'disabled' : ''} class="p-3.5 rounded-xl border text-right transition-all flex items-center gap-3 ${isSelected ? 'bg-amber-500/20 border-amber-500 text-amber-300 shadow-[0_0_15px_rgba(245,158,11,0.3)]' : 'bg-slate-900/80 border-slate-800 hover:border-slate-600 text-slate-200'}">
                                    <span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-amber-400">${labelLetter}</span>
                                    <span class="text-sm font-semibold">${opt.text}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            } else if (q.type === 'matching') {
                const { selectedLeft, connections } = gameState.matchingState;
                const leftItems = [...q.pairs];
                // Non-opposing right items layout
                const rightItems = [q.pairs[2], q.pairs[0], q.pairs[3], q.pairs[1]];

                return `
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4">
                        <p class="text-xs text-amber-400 text-center font-bold">اضغط على المصطلح في القائمة الأولى ثم العنصر المطابق في القائمة الثانية غير المتقابلة للتوصيل:</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <p class="text-xs font-bold text-slate-400 mb-1">المصطلحات:</p>
                                ${leftItems.map(p => {
                                    const isConnected = connections[p.leftId] !== undefined;
                                    const isSelected = selectedLeft === p.leftId;
                                    return `
                                        <button onclick="selectMatchingLeft(${p.leftId})" class="w-full p-3 rounded-xl border text-right flex justify-between items-center ${isConnected ? 'bg-emerald-950/40 border-emerald-500/60 text-emerald-300' : isSelected ? 'bg-amber-500/30 border-amber-500 text-amber-300' : 'bg-slate-900 border-slate-800 text-slate-200'}">
                                            <span>${p.leftText}</span>
                                            ${isConnected ? `<span class="text-xs font-mono bg-emerald-500/20 px-2 py-0.5 rounded text-emerald-300">موصول 🔗</span>` : isSelected ? '<span class="text-xs text-amber-400">محدد...</span>' : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                            <div class="space-y-2">
                                <p class="text-xs font-bold text-slate-400 mb-1">القيم والتعاريف:</p>
                                ${rightItems.map(p => {
                                    const connectedLeftId = Object.keys(connections).find(k => connections[k] === p.rightKey);
                                    const isConnectedToAny = connectedLeftId !== undefined;
                                    return `
                                        <button onclick="selectMatchingRight('${p.rightKey}')" class="w-full p-3 rounded-xl border text-right flex justify-between items-center ${isConnectedToAny ? 'bg-emerald-950/40 border-emerald-500/60 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-200'}">
                                            <span>${p.rightText}</span>
                                            <span class="text-xs font-mono bg-slate-800 px-2 py-0.5 rounded text-amber-400">${p.rightKey.toUpperCase()}</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="border-t border-slate-800 pt-3 mt-4">
                            <p class="text-xs font-bold text-slate-300 mb-2">التوصيلات الحالية:</p>
                            <div class="space-y-2">
                                ${Object.keys(connections).length === 0 ? '<p class="text-xs text-slate-500">لم يتم توصيل أي عناصر بعد.</p>' : ''}
                                ${Object.keys(connections).map(leftId => {
                                    const leftItem = q.pairs.find(p => p.leftId == leftId);
                                    const rightKey = connections[leftId];
                                    const rightItem = q.pairs.find(p => p.rightKey == rightKey);
                                    return `
                                        <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 px-3 py-2 rounded-lg text-xs">
                                            <span class="text-slate-200">${leftItem.leftText} ↔ ${rightItem.rightText}</span>
                                            <button onclick="cancelConnection(${leftId})" class="text-red-400 hover:text-red-300 font-bold bg-red-500/10 hover:bg-red-500/20 px-2.5 py-1 rounded transition-all">
                                                [ إلغاء التوصيل ]
                                            </button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (q.type === 'ordering') {
                const { userOrder } = gameState.orderingState;
                return `
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4">
                        <p class="text-xs text-amber-400 text-center font-bold">استخدم أزرار التحريك لتسلسل العبارات العلمية من الأقل إلى الأعلى دون أرقام مسبقة:</p>
                        <div class="max-w-xl mx-auto space-y-3">
                            ${userOrder.map((itemId, idx) => {
                                const item = q.items.find(i => i.id === itemId);
                                return `
                                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                                        <div class="flex items-center gap-3">
                                            <span class="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs">${idx + 1}</span>
                                            <span class="text-sm text-slate-200 font-semibold">${item.text}</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button onclick="moveOrderItem(${idx}, -1)" ${idx === 0 ? 'disabled opacity-30' : ''} class="px-2.5 py-1 bg-slate-800 rounded hover:bg-slate-700 text-xs font-bold text-slate-300">⬆️ لأعلى</button>
                                            <button onclick="moveOrderItem(${idx}, 1)" ${idx === userOrder.length - 1 ? 'disabled opacity-30' : ''} class="px-2.5 py-1 bg-slate-800 rounded hover:bg-slate-700 text-xs font-bold text-slate-300">⬇️ لأسفل</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function selectOption(key) {
            soundFX.playSelect();
            gameState.selectedOption = key;
            render();
        }

        function selectMatchingLeft(leftId) {
            soundFX.playSelect();
            gameState.matchingState.selectedLeft = leftId;
            render();
        }

        function selectMatchingRight(rightKey) {
            const { selectedLeft, connections } = gameState.matchingState;
            if (selectedLeft !== null) {
                soundFX.playSelect();
                connections[selectedLeft] = rightKey;
                gameState.matchingState.selectedLeft = null;
                render();
            }
        }

        function cancelConnection(leftId) {
            soundFX.playSelect();
            delete gameState.matchingState.connections[leftId];
            render();
        }

        function moveOrderItem(index, direction) {
            soundFX.playSelect();
            const order = gameState.orderingState.userOrder;
            const targetIndex = index + direction;
            if (targetIndex >= 0 && targetIndex < order.length) {
                const temp = order[index];
                order[index] = order[targetIndex];
                order[targetIndex] = temp;
                render();
            }
        }

        function canConfirm() {
            const q = QUESTIONS[gameState.currentQuestionIndex];
            if (q.type === 'mcq') return gameState.selectedOption !== null;
            if (q.type === 'matching') return Object.keys(gameState.matchingState.connections).length === q.pairs.length;
            if (q.type === 'ordering') return true;
            return false;
        }

        function useLifeline(type) {
            if (gameState.lifelinedUsed(type) || gameState.isConfirmed) return;
            soundFX.playLifeline();
            gameState.lifelines[type] = true;
            const q = QUESTIONS[gameState.currentQuestionIndex];

            if (type === 'fiftyFifty' && q.type === 'mcq') {
                const wrongOptions = q.options.filter(o => o.key !== q.correct).map(o => o.key);
                wrongOptions.sort(() => Math.random() - 0.5);
                gameState.lifelineActiveState.eliminatedOptions = wrongOptions.slice(0, 2);
            } else if (type === 'expert') {
                gameState.lifelineActiveState.expertMessage = `الخبير العلمي يرجح الإجابة الصحيحة بناءً على خصائص المقاييس الحرارية.`;
            }
            render();
        }

        gameState.lifelinedUsed = function(type) {
            return gameState.lifelines[type];
        };

        function confirmAnswer() {
            if (!canConfirm() || gameState.isConfirmed) return;
            gameState.isConfirmed = true;
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);

            const q = QUESTIONS[gameState.currentQuestionIndex];
            let isCorrect = false;
            let userAnswerStr = "";

            if (q.type === 'mcq') {
                userAnswerStr = gameState.selectedOption.toUpperCase();
                isCorrect = gameState.selectedOption === q.correct;
            } else if (q.type === 'matching') {
                const conn = gameState.matchingState.connections;
                let matchesOk = true;
                q.pairs.forEach(p => {
                    if (conn[p.leftId] !== p.rightKey) matchesOk = false;
                });
                isCorrect = matchesOk;
                userAnswerStr = "توصيل شبكي للمصطلحات";
            } else if (q.type === 'ordering') {
                const userOrd = gameState.orderingState.userOrder;
                isCorrect = JSON.stringify(userOrd) === JSON.stringify(q.correctOrder);
                userAnswerStr = "ترتيب تصاعدي للعبارات الحرارية";
            }

            const currentPrize = PRIZES[gameState.currentQuestionIndex];

            if (isCorrect) {
                soundFX.playCorrect();
                gameState.correctCount++;
                gameState.score += currentPrize.points;
                if (gameState.mode === 'team') {
                    gameState.teams[gameState.currentTeamIndex].score += currentPrize.points;
                }
            } else {
                soundFX.playWrong();
                gameState.wrongCount++;
            }

            gameState.answersHistory.push({
                questionNumber: gameState.currentQuestionIndex + 1,
                questionText: q.text,
                userAnswer: userAnswerStr,
                correctAnswer: getCorrectAnswerText(q),
                isCorrect: isCorrect,
                explanation: q.explanation
            });

            goToFeedback(isCorrect);
        }

        function goToFeedback(isCorrect) {
            gameState.view = 'feedback';
            render();
        }

        function renderFeedbackScreen() {
            const lastAnswer = gameState.answersHistory[gameState.answersHistory.length - 1];
            const isLastQuestion = gameState.currentQuestionIndex === QUESTIONS.length - 1;

            return `
                <div class="flex-1 flex flex-col items-center justify-center max-w-xl mx-auto w-full p-6 bg-slate-900/95 border border-slate-800 rounded-3xl studio-glow text-center">
                    <div class="text-6xl mb-4 animate-bounce">
                        ${lastAnswer.isCorrect ? '✅' : '❌'}
                    </div>
                    <h2 class="text-2xl md:text-3xl font-black mb-2 ${lastAnswer.isCorrect ? 'text-emerald-400' : 'text-red-400'}">
                        ${lastAnswer.isCorrect ? 'إجابة صحيحة!' : 'إجابة غير صحيحة.'}
                    </h2>
                    <p class="text-slate-300 font-semibold mb-6">النقاط الحالية: <span class="text-amber-400 font-bold">${gameState.score} نقطة</span></p>

                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 w-full text-right mb-6">
                        <p class="text-xs font-bold text-amber-400 mb-1">💡 لماذا؟ (التفسير العلمي):</p>
                        <p class="text-sm text-slate-200 leading-relaxed">${lastAnswer.explanation}</p>
                    </div>

                    <button onclick="nextStepAfterFeedback(${isLastQuestion})" class="w-full py-4 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-black text-lg rounded-xl shadow-lg transition-all">
                        ${isLastQuestion ? '🏆 عرض النتيجة النهائية' : 'متابعة التحدي ➔'}
                    </button>
                </div>
            `;
        }

        function nextStepAfterFeedback(isLast) {
            soundFX.playSelect();
            if (isLast) {
                soundFX.playWin();
                gameState.view = 'gameover';
            } else {
                gameState.currentQuestionIndex++;
                if (gameState.mode === 'team') {
                    gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
                }
                gameState.view = 'playing';
                initQuestionState();
            }
            render();
        }

        function renderGameOverScreen() {
            const totalQ = QUESTIONS.length;
            const percentage = Math.round((gameState.correctCount / totalQ) * 100);
            
            let rankTitle = "متدرب العلوم";
            if (percentage >= 90) rankTitle = "🧠 عبقري العلوم";
            else if (percentage >= 80) rankTitle = "🔬 خبير علمي";
            else if (percentage >= 70) rankTitle = "🌟 عالم واعد";
            else if (percentage >= 60) rankTitle = "🚀 مستكشف المعرفة";

            return `
                <div class="flex-1 flex flex-col items-center justify-center max-w-2xl mx-auto w-full p-6 bg-slate-900/95 border border-slate-800 rounded-3xl studio-glow text-center">
                    <div class="text-5xl mb-3">🏆</div>
                    <h2 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 mb-2">
                        تحدي المليون العلمي
                    </h2>
                    <p class="text-sm font-semibold text-slate-300 mb-6">تهانينا لإتمام التحدي بنجاح وتفوق!</p>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 w-full mb-6">
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
                            <span class="text-xs text-slate-400 block mb-1">النقاط الكلية</span>
                            <span class="text-xl font-black text-amber-400">${gameState.score} / 1000</span>
                        </div>
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
                            <span class="text-xs text-slate-400 block mb-1">الإجابات الصحيحة</span>
                            <span class="text-xl font-black text-emerald-400">${gameState.correctCount} / 10</span>
                        </div>
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
                            <span class="text-xs text-slate-400 block mb-1">الخاطئة / غير المجابة</span>
                            <span class="text-xl font-black text-red-400">${gameState.wrongCount + gameState.unansweredCount}</span>
                        </div>
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
                            <span class="text-xs text-slate-400 block mb-1">النسبة المئوية</span>
                            <span class="text-xl font-black text-blue-400">${percentage}%</span>
                        </div>
                    </div>

                    <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 w-full mb-6">
                        <span class="text-xs text-amber-400 block mb-1">رتبتك العلمية المستحقة:</span>
                        <span class="text-2xl font-black text-amber-300">${rankTitle}</span>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3 w-full">
                        <button onclick="restartGame()" class="flex-1 py-3.5 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-black rounded-xl shadow-lg transition-all">
                            🔄 العب من جديد
                        </button>
                        <button onclick="openReview()" class="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-black rounded-xl border border-slate-700 transition-all">
                            📋 مراجعة الإجابات
                        </button>
                    </div>
                </div>
            `;
        }

        function renderReviewScreen() {
            return `
                <div class="flex-1 flex flex-col max-w-4xl mx-auto w-full p-4 md:p-6 bg-slate-900/95 border border-slate-800 rounded-3xl studio-glow">
                    <div class="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
                        <h2 class="text-2xl font-black text-amber-400">📋 مراجعة إجابات التحدي العلمي</h2>
                        <button onclick="backToGameOver()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700">
                            العودة للنتائج ➔
                        </button>
                    </div>

                    <div class="space-y-4 overflow-y-auto max-h-[60vh] pr-2">
                        ${gameState.answersHistory.map((ans) => `
                            <div class="bg-slate-950 border ${ans.isCorrect ? 'border-emerald-500/30' : 'border-red-500/30'} rounded-2xl p-4 space-y-2">
                                <div class="flex items-center justify-between text-xs">
                                    <span class="text-amber-400 font-bold">السؤال ${ans.questionNumber}</span>
                                    <span class="${ans.isCorrect ? 'text-emerald-400 bg-emerald-500/10' : 'text-red-400 bg-red-500/10'} px-2.5 py-0.5 rounded-full font-bold">
                                        ${ans.isCorrect ? '✓ صحيح' : '✗ غير صحيح'}
                                    </span>
                                </div>
                                <p class="text-sm font-bold text-slate-100">${ans.questionText}</p>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-900">
                                    <p class="text-slate-300"><span class="text-slate-500">إجابتك:</span> <span class="font-semibold">${ans.userAnswer}</span></p>
                                    <p class="text-emerald-400"><span class="text-slate-500">الإجابة الصحيحة:</span> <span class="font-semibold">${ans.correctAnswer}</span></p>
                                </div>
                                <p class="text-xs text-amber-300/90 bg-amber-500/5 p-2 rounded-lg mt-2">💡 التفسير: ${ans.explanation}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openReview() {
            soundFX.playSelect();
            gameState.view = 'review';
            render();
        }

        function backToGameOver() {
            soundFX.playSelect();
            gameState.view = 'gameover';
            render();
        }

        function restartGame() {
            soundFX.playSelect();
            gameState.view = 'welcome';
            render();
        }

        window.onload = function() {
            prepareQuestions();
            render();
        };
    </script>
</body>
</html>
