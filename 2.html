  <script>
    /* Web Audio API Engine for original, royalty-free, responsive sound effects */
    const AudioEngine = {
      ctx: null,
      enabled: true,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      playTone(freq, type, duration, delay = 0, gainVal = 0.15) {
        if (!this.enabled) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime + delay;

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {
          console.debug("Audio play error", e);
        }
      },

      playClick() {
        this.playTone(600, 'sine', 0.08, 0, 0.1);
      },

      playStartFanfare() {
        if (!this.enabled) return;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((note, idx) => {
          this.playTone(note, 'triangle', 0.35, idx * 0.12, 0.2);
        });
      },

      playTick() {
        this.playTone(950, 'sine', 0.04, 0, 0.05);
      },

      playCorrect() {
        if (!this.enabled) return;
        this.playTone(523.25, 'triangle', 0.25, 0, 0.25);
        this.playTone(659.25, 'triangle', 0.3, 0.12, 0.25);
        this.playTone(783.99, 'triangle', 0.5, 0.24, 0.25);
        this.playTone(1046.50, 'sine', 0.6, 0.36, 0.3);
      },

      playWrong() {
        if (!this.enabled) return;
        this.playTone(220, 'sawtooth', 0.3, 0, 0.2);
        this.playTone(196, 'sawtooth', 0.45, 0.2, 0.2);
      },

      playLifeline() {
        if (!this.enabled) return;
        this.playTone(440, 'sine', 0.15, 0, 0.15);
        this.playTone(880, 'triangle', 0.3, 0.1, 0.2);
        this.playTone(1320, 'sine', 0.4, 0.2, 0.2);
      },

      playWaterAbsorb() {
        if (!this.enabled) return;
        for (let i = 0; i < 4; i++) {
          this.playTone(350 + (i * 90), 'sine', 0.18, i * 0.08, 0.18);
        }
      },

      playGrowth() {
        if (!this.enabled) return;
        const arpeggio = [330, 392, 493.88, 587.33, 659.25];
        arpeggio.forEach((f, i) => {
          this.playTone(f, 'sine', 0.4, i * 0.09, 0.18);
        });
      },

      playFinalMillion() {
        if (!this.enabled) return;
        const fanfare = [261.63, 392, 523.25, 659.25, 783.99, 1046.50];
        fanfare.forEach((f, i) => {
          this.playTone(f, 'square', 0.5, i * 0.14, 0.15);
        });
      },

      playVictory() {
        if (!this.enabled) return;
        const notes = [392, 523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((f, i) => {
          this.playTone(f, 'triangle', 0.6, i * 0.15, 0.25);
        });
      }
    };

    function toggleSound() {
      AudioEngine.enabled = !AudioEngine.enabled;
      const icon = document.getElementById('sound-icon');
      if (AudioEngine.enabled) {
        icon.className = 'fas fa-volume-up text-base';
        AudioEngine.playClick();
      } else {
        icon.className = 'fas fa-volume-mute text-base text-red-400';
      }
    }

    function toggleFullscreen() {
      AudioEngine.playClick();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

      4. Example: 5 seeds, 4 germinated, 5th did not => 5th embryo is not alive.
      5. Before germination: absorbs water, swells, uses food store for growth energy.
      6. After germination: withers, shrinks because food store is consumed.
      7. Sequence: Embryo fed by food store -> Absorbs water & swells -> First root grows downwards -> Stem grows upwards -> Leaves grow -> Leaves grow and seed withers as food is consumed, leaves now supply food.

    const GameState = {
      // Configuration
      mode: 'SOLO', // 'SOLO' or 'TEAM'
      teams: [], // [{ name: 'الفريق 1', score: 0, answers: [] }]
      currentTeamIndex: 0,
      studentName: 'البطل الصغير',

      // Progress
      currentQuestionIndex: 0,
      timerEnabled: false,
      timerSeconds: 30,
      timerInterval: null,
      totalTimeElapsed: 0,
      globalTimerInterval: null,

      // State flags
      selectedOptionId: null,
      orderingSelection: [], // For Q9
      answerConfirmed: false,
      isDoubleActionLocked: false,

      // Lifelines (used once)
      lifelines: {
        fiftyFifty: true,  // مساعدة المختبر
        expert: true,      // رأي الخبراء
        hint: true         // تلميح العالم
      },
      eliminatedOptions: [],

      // Stats per team / player
      reviewHistory: [],

      reset() {
        this.currentQuestionIndex = 0;
        this.selectedOptionId = null;
        this.orderingSelection = [];
        this.answerConfirmed = false;
        this.isDoubleActionLocked = false;
        this.lifelines = { fiftyFifty: true, expert: true, hint: true };
        this.eliminatedOptions = [];
        this.reviewHistory = [];
        this.totalTimeElapsed = 0;
        this.stopTimer();
        if (this.globalTimerInterval) clearInterval(this.globalTimerInterval);
        this.teams = [];
        this.currentTeamIndex = 0;
      },

      getCurrentTeam() {
        if (this.mode === 'TEAM') {
          return this.teams[this.currentTeamIndex] || { name: 'الفريق', score: 0 };
        }
        return { name: this.studentName, score: this.teams[0]?.score || 0 };
      },

      addScoreToCurrentTeam(points) {
        if (!this.teams[this.currentTeamIndex]) {
          this.teams[this.currentTeamIndex] = { name: this.studentName, score: 0 };
        }
        this.teams[this.currentTeamIndex].score += points;
      },

      getSeedStage() {
        const qIdx = this.currentQuestionIndex;
        if (qIdx <= 2) return 0; // Dry bean
        if (qIdx <= 4) return 1; // Swollen
        if (qIdx <= 6) return 2; // Root downwards
        if (qIdx === 7) return 3; // Stem upwards
        if (qIdx === 8) return 4; // Leaves
        return 5; // Complete seedling + withered seed
      },

      startTimer(seconds, onTick, onExpire) {
        this.stopTimer();
        if (!this.timerEnabled) return;
        this.timerSeconds = seconds;
        onTick(this.timerSeconds);

        this.timerInterval = setInterval(() => {
          this.timerSeconds--;
          if (this.timerSeconds > 0 && this.timerSeconds <= 5) {
            AudioEngine.playTick();
          }
          onTick(this.timerSeconds);

          if (this.timerSeconds <= 0) {
            this.stopTimer();
            if (onExpire) onExpire();
          }
        }, 1000);
      },

      stopTimer() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      }
    };
  </script>

          <p class="text-xs sm:text-sm text-cyan-300 mb-6">

          </p>

          <!-- Countdown display -->
          <div id="cinematic-countdown" class="w-20 h-20 rounded-full bg-amber-500 text-slate-950 font-black text-4xl flex items-center justify-center mx-auto shadow-2xl animate-pulse">
            3
          </div>

        </div>
      `;

      let count = 3;
      const countdownEl = document.getElementById('cinematic-countdown');
      const msgEl = document.getElementById('cinematic-msg');

      const cdInterval = setInterval(() => {
        count--;
        if (count > 0) {
          AudioEngine.playTick();
          if (countdownEl) countdownEl.innerText = count;
        } else if (count === 0) {
          AudioEngine.playFinalMillion();
          if (countdownEl) {
            countdownEl.className = "w-auto px-6 h-16 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-black text-xl flex items-center justify-center mx-auto shadow-xl";

          }
          if (msgEl) msgEl.innerText = "رحلة إنبات البذرة تبدأ الآن!";
        } else {
          clearInterval(cdInterval);
          renderQuestionScreen();
        }
      }, 1000);
    }
  </script>

  <script>

      GameState.answerConfirmed = false;

      GameState.orderingSelection = [];
      GameState.eliminatedOptions = [];
      GameState.isDoubleActionLocked = false;

      const isFinalMillion = (GameState.currentQuestionIndex === 9);
      if (isFinalMillion) {
        AudioEngine.playFinalMillion();
      }

      const container = document.getElementById('app-container');
      const currentTeam = GameState.getCurrentTeam();

      container.innerHTML = `
        <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
          
          <!-- LEFT/CENTER COLUMN: Question Stage (8 cols) -->
          <div class="lg:col-span-8 flex flex-col gap-3">

              <!-- Player / Team Identity -->
              <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/50 flex items-center justify-center text-amber-400 font-black text-lg">
                  ${GameState.mode === 'TEAM' ? '👥' : '👤'}

                <div>
                  <span class="text-xs text-slate-400 block">${GameState.mode === 'TEAM' ? 'دور الفريق الحالي:' : 'العالم الصغير:'}</span>
                  <span class="text-sm sm:text-base font-black text-amber-300">${currentTeam.name}</span>

              </div>

              <!-- Points & Question Badge -->
              <div class="text-center">
                <span class="text-xs px-3 py-1 rounded-full ${isFinalMillion ? 'bg-red-500/30 text-red-300 border border-red-500' : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40'} font-bold block">
                  ${q.badge}

                <span class="text-xs text-slate-400 mt-0.5 block">الرصيد: <strong class="text-emerald-400 text-sm font-black">${currentTeam.score}</strong> نقطة</span>

              <!-- Timer (if active) -->

                </div>
              </div>

            </div>

            <!-- LIFELINES BAR -->
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2 flex items-center justify-around gap-2 shadow">
              
              <!-- 50:50 -->

                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition ${GameState.lifelines.fiftyFifty && q.type !== 'ORDERING' ? 'bg-slate-800 text-cyan-300 hover:bg-cyan-900/60 hover:border-cyan-400 border border-slate-700' : 'bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed'}"
                ${!GameState.lifelines.fiftyFifty || q.type === 'ORDERING' ? 'disabled' : ''}>
                <span>🔬</span>
                <span>مساعدة المختبر (حذف 2)</span>

                ${!GameState.lifelines.hint ? 'disabled' : ''}>

              el.innerText = left;
              if (left <= 5) {
                el.className = "font-black text-red-500 text-lg animate-ping";
              }
            }
          },
          () => {
            // Timer expired -> auto confirm or record 0 pts
            handleTimerExpire();
          }
        );
      }
    }

    function renderLadderHTML() {
      const currentQIdx = GameState.currentQuestionIndex;
      return LADDER_STEPS.map((step, idx) => {
        let activeClass = '';
        if (step.qIndex === currentQIdx && !step.isSafety) {
          activeClass = 'ladder-active';
        } else if (step.qIndex < currentQIdx) {
          activeClass = 'ladder-passed';
        }

        if (step.isSafety) {
          const isSafetyReached = currentQIdx >= 5;
          return `
            <div class="px-3 py-1.5 rounded-xl text-center flex items-center justify-between ladder-safety text-amber-300 ${isSafetyReached ? 'bg-amber-500/25 border-amber-400' : ''}">
              <span>🛡️ نقطة الأمان</span>
              <span class="font-black">350 نقطة</span>
            </div>
          `;
        }

        return `
          <div class="px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-950/60 text-slate-300 flex items-center justify-between transition ${activeClass}">
            <span class="text-[11px]">السؤال ${step.qIndex + 1}</span>
            <span class="font-black">${step.label}</span>
          </div>
        `;
      }).join('');
    }

    function renderQuestionOptionsHTML(q) {
      if (q.type === 'ORDERING') {
        // Render 4 available cards and 4 slots
        return `
          <div class="flex flex-col gap-4">
            <!-- Target Slots -->
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
              ${[0, 1, 2, 3].map(i => `
                <div 
                  id="order-slot-${i}" 
                  onclick="removeOrderSlotItem(${i})"
                  class="bg-slate-950/90 border-2 border-dashed border-slate-700 hover:border-red-400 rounded-2xl p-3 min-h-[75px] flex flex-col items-center justify-center text-center cursor-pointer transition">
                  <span class="text-[10px] text-slate-500 block mb-1">المرحلة ${i + 1}</span>
                  <span id="order-slot-text-${i}" class="text-xs font-bold text-amber-300">انقر لوضع بطاقة</span>
                </div>
              `).join('')}
            </div>

            <!-- Available Options Cards -->
            <div class="text-xs text-slate-400 font-bold mt-2">البطاقات المتاحة للترتيب:</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${q.items.map(item => `
                <button 
                  id="order-item-${item.key}" 
                  onclick="addOrderCard('${item.key}')"
                  class="p-3 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 hover:border-cyan-400 rounded-xl text-right text-xs sm:text-sm font-semibold text-slate-200 transition flex items-center gap-2">
                  <span class="w-6 h-6 rounded-full bg-cyan-900/60 text-cyan-300 flex items-center justify-center font-bold text-xs shrink-0">${item.key}</span>
                  <span>${item.text}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Standard Multiple Choice
      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          ${q.options.map(opt => `
            <button 
              id="opt-btn-${opt.id}" 
              onclick="selectSingleOption('${opt.id}')"
              class="group relative p-4 bg-slate-800/80 hover:bg-slate-700/80 border-2 border-slate-700 hover:border-amber-400/80 rounded-2xl text-right text-xs sm:text-sm font-bold text-slate-200 transition shadow flex items-center gap-3">
              <span class="w-8 h-8 rounded-xl bg-slate-900 text-amber-400 border border-slate-700 group-hover:border-amber-400 flex items-center justify-center text-xs font-black shrink-0">
                ${opt.id}
              </span>
              <span class="flex-1 leading-relaxed">${opt.text}</span>
            </button>
          `).join('')}
        </div>
      `;
    }
  </script>

  <script>
    function selectSingleOption(optId) {
      if (GameState.answerConfirmed) return;
      if (GameState.eliminatedOptions.includes(optId)) return;

      AudioEngine.playClick();
      GameState.selectedOptionId = optId;

      const q = QUESTIONS_DATA[GameState.currentQuestionIndex];
      q.options.forEach(opt => {
        const btn = document.getElementById(`opt-btn-${opt.id}`);
        if (!btn) return;
        if (opt.id === optId) {
          btn.className = "group relative p-4 bg-amber-500/20 border-2 border-amber-400 rounded-2xl text-right text-xs sm:text-sm font-bold text-amber-200 transition shadow flex items-center gap-3";
        } else if (!GameState.eliminatedOptions.includes(opt.id)) {
          btn.className = "group relative p-4 bg-slate-800/80 hover:bg-slate-700/80 border-2 border-slate-700 hover:border-amber-400/80 rounded-2xl text-right text-xs sm:text-sm font-bold text-slate-200 transition shadow flex items-center gap-3";
        }
      });

      // Enable Confirm Button
      const confirmBtn = document.getElementById('btn-confirm-answer');
      if (confirmBtn) {
        confirmBtn.disabled = false;
        confirmBtn.className = "px-8 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black text-base shadow-lg hover:scale-105 active:scale-95 transition cursor-pointer flex items-center gap-2";
      }
    }

    /* Q9: Order Cards Logic */
    function addOrderCard(key) {
      if (GameState.answerConfirmed) return;
      if (GameState.orderingSelection.includes(key)) return;
      if (GameState.orderingSelection.length >= 4) return;

      AudioEngine.playClick();
      GameState.orderingSelection.push(key);
      updateOrderUI();
    }

    function removeOrderSlotItem(index) {
      if (GameState.answerConfirmed) return;
      if (!GameState.orderingSelection[index]) return;

      AudioEngine.playClick();
      GameState.orderingSelection.splice(index, 1);
      updateOrderUI();
    }

    function updateOrderUI() {
      const q = QUESTIONS_DATA[GameState.currentQuestionIndex];
      if (q.type !== 'ORDERING') return;

      // Update 4 slots
      for (let i = 0; i < 4; i++) {
        const key = GameState.orderingSelection[i];
        const slotEl = document.getElementById(`order-slot-${i}`);
        const textEl = document.getElementById(`order-slot-text-${i}`);

        if (key) {
          const itemObj = q.items.find(it => it.key === key);
          slotEl.className = "bg-amber-950/60 border-2 border-amber-400 rounded-2xl p-3 min-h-[75px] flex flex-col items-center justify-center text-center cursor-pointer transition";
          textEl.innerHTML = `<span class="text-xs font-bold text-amber-200">(${key}) ${itemObj.text}</span><span class="text-[9px] text-red-400 mt-1 block">✕ اضغط للإزالة</span>`;
        } else {
          slotEl.className = "bg-slate-950/90 border-2 border-dashed border-slate-700 hover:border-slate-500 rounded-2xl p-3 min-h-[75px] flex flex-col items-center justify-center text-center cursor-pointer transition";
          textEl.innerHTML = `<span class="text-xs font-bold text-slate-500">انقر على بطاقة لتثبيتها</span>`;
        }
      }

      // Update cards opacity
      q.items.forEach(item => {
        const btn = document.getElementById(`order-item-${item.key}`);
        if (!btn) return;
        if (GameState.orderingSelection.includes(item.key)) {
          btn.classList.add('opacity-30', 'pointer-events-none');
        } else {
          btn.classList.remove('opacity-30', 'pointer-events-none');
        }
      });

      // Enable confirm if all 4 placed
      const confirmBtn = document.getElementById('btn-confirm-answer');
      if (confirmBtn) {
        if (GameState.orderingSelection.length === 4) {
          confirmBtn.disabled = false;
          confirmBtn.className = "px-8 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black text-base shadow-lg hover:scale-105 active:scale-95 transition cursor-pointer flex items-center gap-2";
        } else {
          confirmBtn.disabled = true;
          confirmBtn.className = "px-8 py-3.5 rounded-2xl bg-slate-800 text-slate-500 font-black text-base transition shadow cursor-not-allowed flex items-center gap-2";
        }
      }
    }

    /* Lifelines execution */
    function useLifelineFifty() {
      if (!GameState.lifelines.fiftyFifty) return;
      const q = QUESTIONS_DATA[GameState.currentQuestionIndex];
      if (q.type === 'ORDERING') return;

      AudioEngine.playLifeline();
      GameState.lifelines.fiftyFifty = false;

      // Find 2 wrong options to eliminate
      const wrongOptions = q.options.filter(o => o.id !== q.correctId).map(o => o.id);
      // Shuffle & pick 2
      const toEliminate = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 2);
      GameState.eliminatedOptions = toEliminate;

      toEliminate.forEach(id => {
        const btn = document.getElementById(`opt-btn-${id}`);
        if (btn) {
          btn.classList.add('opacity-20', 'pointer-events-none');
        }
      });

      const lifelineBtn = document.getElementById('btn-lifeline-fifty');
      if (lifelineBtn) {
        lifelineBtn.disabled = true;
        lifelineBtn.className = "bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold";
      }
    }

    function useLifelineExpert() {
      if (!GameState.lifelines.expert) return;
      const q = QUESTIONS_DATA[GameState.currentQuestionIndex];
      if (q.type === 'ORDERING') return;

      AudioEngine.playLifeline();
      GameState.lifelines.expert = false;

      const weights = q.expertWeight || { A: 25, B: 25, C: 25, D: 25 };

      showModal(`
        <div class="text-amber-400 text-3xl mb-2">🧠</div>
        <h3 class="text-lg font-black text-white mb-2">استطلاع رأي خبراء العلوم</h3>
        <p class="text-xs text-slate-300 mb-4">قام فريق من مدرسي وباحثي العلوم بدراسة السؤال وكانت ترجيحاتهم كالتالي:</p>
        
        <div class="space-y-2 mb-5">
          ${q.options.map(opt => `
            <div>
              <div class="flex justify-between text-xs font-bold mb-1">
                <span>(${opt.id}) ${opt.text.substring(0, 26)}...</span>
                <span class="text-amber-300">${weights[opt.id] || 10}%</span>
              </div>
              <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                <div class="bg-gradient-to-r from-amber-500 to-yellow-400 h-2.5 rounded-full" style="width: ${weights[opt.id] || 10}%"></div>
              </div>
            </div>
          `).join('')}
        </div>

        <button onclick="closeModal()" class="px-6 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition">
          فهمت ذلك، شكرًا!
        </button>
      `);

      const lifelineBtn = document.getElementById('btn-lifeline-expert');
      if (lifelineBtn) {
        lifelineBtn.disabled = true;
        lifelineBtn.className = "bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold";
      }
    }

    function useLifelineHint() {
      if (!GameState.lifelines.hint) return;
      const q = QUESTIONS_DATA[GameState.currentQuestionIndex];

      AudioEngine.playLifeline();
      GameState.lifelines.hint = false;

      showModal(`
        <div class="text-emerald-400 text-3xl mb-2">💡</div>
        <h3 class="text-lg font-black text-white mb-2">تلميح العالم الذكي</h3>
        <div class="bg-emerald-950/70 border border-emerald-500/60 rounded-xl p-3 text-xs sm:text-sm text-emerald-200 font-semibold mb-5 leading-relaxed">
          « ${q.hint} »
        </div>
        <button onclick="closeModal()" class="px-6 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs hover:bg-emerald-400 transition">
          العودة للسؤال
        </button>
      `);

      const lifelineBtn = document.getElementById('btn-lifeline-hint');
      if (lifelineBtn) {
        lifelineBtn.disabled = true;
        lifelineBtn.className = "bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold";
      }
    }

    function showModal(html) {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      content.innerHTML = html;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      AudioEngine.playClick();
      const modal = document.getElementById('modal-container');
      modal.classList.add('hidden');
    }
  </script>

  <script>
    function confirmCurrentAnswer() {
      if (GameState.isDoubleActionLocked) return;
      GameState.isDoubleActionLocked = true;
      GameState.stopTimer();

      const q = QUESTIONS_DATA[GameState.currentQuestionIndex];
      let isCorrect = false;

      if (q.type === 'ORDERING') {
        const studentOrderStr = GameState.orderingSelection.join('');
        const correctOrderStr = q.correctOrder.join('');
        isCorrect = (studentOrderStr === correctOrderStr);
      } else {
        isCorrect = (GameState.selectedOptionId === q.correctId);
      }

      // Record History
      const userChoiceText = q.type === 'ORDERING' 
        ? GameState.orderingSelection.join(' ➔ ') 
        : (q.options.find(o => o.id === GameState.selectedOptionId)?.text || 'لم يتم اختيار إجابة');

      const correctChoiceText = q.type === 'ORDERING'
        ? q.correctOrder.join(' ➔ ')
        : q.options.find(o => o.id === q.correctId)?.text;

      GameState.reviewHistory.push({
        questionIndex: GameState.currentQuestionIndex,
        title: q.title,
        question: q.question,
        userChoice: userChoiceText,
        correctChoice: correctChoiceText,
        isCorrect: isCorrect,
        explanation: q.explanation,
        concept: q.concept,
        pointsAwarded: isCorrect ? q.points : 0
      });

      if (isCorrect) {
        AudioEngine.playCorrect();
        GameState.addScoreToCurrentTeam(q.points);
        if (GameState.currentQuestionIndex === 3) AudioEngine.playWaterAbsorb();
        if (GameState.currentQuestionIndex >= 5) AudioEngine.playGrowth();
      } else {
        AudioEngine.playWrong();
      }

      renderFeedbackOverlay(isCorrect, q);
    }

    function handleTimerExpire() {
      if (GameState.isDoubleActionLocked) return;
      GameState.isDoubleActionLocked = true;
      AudioEngine.playWrong();

      const q = QUESTIONS_DATA[GameState.currentQuestionIndex];
      GameState.reviewHistory.push({
        questionIndex: GameState.currentQuestionIndex,
        title: q.title,
        question: q.question,
        userChoice: 'انتهى الوقت دون إجابة',
        correctChoice: q.type === 'ORDERING' ? q.correctOrder.join(' ➔ ') : q.options.find(o => o.id === q.correctId)?.text,
        isCorrect: false,
        explanation: q.explanation,
        concept: q.concept,
        pointsAwarded: 0
      });

      renderFeedbackOverlay(false, q, true);
    }

    function renderFeedbackOverlay(isCorrect, q, timedOut = false) {
      const container = document.getElementById('options-container');
      const confirmBtnWrapper = document.getElementById('btn-confirm-answer').parentNode;

      let resultHeader = '';
      if (isCorrect) {
        resultHeader = `
          <div class="bg-emerald-950/80 border-2 border-emerald-500 rounded-2xl p-4 text-center mb-4 animate-bounce">
            <span class="text-4xl block mb-1">🎉</span>
            <h4 class="text-xl sm:text-2xl font-black text-emerald-300">إجابة صحيحة وممتازة!</h4>
            <span class="text-xs sm:text-sm font-bold text-amber-300">+${q.points} نقطة أُضيفت إلى رصيدك</span>
          </div>
        `;
      } else {
        resultHeader = `
          <div class="bg-red-950/80 border-2 border-red-500 rounded-2xl p-4 text-center mb-4">
            <span class="text-4xl block mb-1">❌</span>
            <h4 class="text-xl sm:text-2xl font-black text-red-300">${timedOut ? 'انتهى الوقت المحدد!' : 'إجابة غير صحيحة'}</h4>
            <span class="text-xs sm:text-sm font-bold text-slate-300">لا بأس! في تحدي المليون الخطأ لا ينهي اللعبة وتستمر لتعلم المزيد!</span>
          </div>
        `;
      }

      const correctAnsDisplay = q.type === 'ORDERING'
        ? q.correctOrder.map(k => `[${k}] ${q.items.find(it => it.key === k).text}`).join(' ➔ ')
        : `(${q.correctId}) ${q.options.find(o => o.id === q.correctId)?.text}`;

      container.innerHTML = `
        ${resultHeader}

        <!-- Show Correct Answer explicitly if wrong -->
        ${!isCorrect ? `
          <div class="bg-slate-950 border border-slate-700 rounded-2xl p-3 mb-3 text-right">
            <span class="text-xs text-slate-400 block mb-0.5">الإجابة الصحيحة المعتمدة:</span>
            <span class="text-xs sm:text-sm font-bold text-emerald-400 block">${correctAnsDisplay}</span>
          </div>
        ` : ''}

        <!-- WHY / SCIENTIFIC EXPLANATION -->
        <div class="bg-slate-950/90 border border-amber-500/60 rounded-2xl p-4 text-right shadow-inner">
          <div class="flex items-center gap-2 mb-2 text-amber-400 font-black text-sm sm:text-base">
            <span>💡</span>
            <span>لماذا؟ (التفسير العلمي المعتمد):</span>
          </div>
          <p class="text-xs sm:text-sm text-slate-200 leading-relaxed font-semibold">
            « ${q.explanation} »
          </p>
        </div>
      `;

      // Next / Continue button
      const isLast = (GameState.currentQuestionIndex >= QUESTIONS_DATA.length - 1);
      confirmBtnWrapper.innerHTML = `
        <button 
          onclick="proceedToNextQuestion()" 
          class="px-10 py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black text-base sm:text-lg shadow-xl hover:scale-105 active:scale-95 transition flex items-center gap-3">
          <span>${isLast ? '🏆 الانتقال إلى النتيجة النهائية' : '➡️ متابعة التحدي'}</span>
          <i class="fas fa-arrow-left"></i>
        </button>
      `;
    }
  </script>

  <script>
    function proceedToNextQuestion() {
      AudioEngine.playClick();

      // Check if finished 10 questions
      if (GameState.currentQuestionIndex >= QUESTIONS_DATA.length - 1) {
        renderFinalResultScreen();
        return;
      }

      GameState.currentQuestionIndex++;

      // If team mode, rotate turn cleanly
      if (GameState.mode === 'TEAM') {
        const prevIndex = GameState.currentTeamIndex;
        GameState.currentTeamIndex = (GameState.currentTeamIndex + 1) % GameState.teams.length;
        renderTeamTransitionScreen(prevIndex, GameState.currentTeamIndex);
      } else {
        renderQuestionScreen();
      }
    }

    function renderTeamTransitionScreen(prevTeamIdx, nextTeamIdx) {
      const container = document.getElementById('app-container');
      const nextTeam = GameState.teams[nextTeamIdx];

      container.innerHTML = `
        <div class="w-full max-w-md bg-slate-900/95 border-2 border-cyan-500 rounded-3xl p-6 sm:p-8 shadow-2xl text-center backdrop-blur animate-pulse-subtle">
          <span class="text-4xl block mb-2">🔄</span>
          <h3 class="text-xl sm:text-2xl font-black text-white mb-1">انتقال الدور</h3>
          <p class="text-xs text-slate-300 mb-6">السؤال التالي مخصص للفريق القادم:</p>

          <div class="bg-slate-950 border-2 border-amber-400 rounded-2xl p-4 mb-6 shadow-lg">
            <span class="text-xs text-amber-300 font-bold block mb-1">استعد يا:</span>
            <h2 class="text-2xl font-black text-white">${nextTeam.name}</h2>
            <span class="text-xs text-emerald-400 font-bold mt-1 block">رصيدكم الحالي: ${nextTeam.score} نقطة</span>
          </div>

          <button 
            onclick="renderQuestionScreen()" 
            class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black text-base shadow-lg hover:scale-102 active:scale-95 transition">
            عرض سؤال ${nextTeam.name}
          </button>
        </div>
      `;
    }
  </script>

  <script>
    function renderFinalResultScreen() {
      AudioEngine.playVictory();
      const container = document.getElementById('app-container');

      const totalCorrect = GameState.reviewHistory.filter(h => h.isCorrect).length;
      const totalWrong = GameState.reviewHistory.filter(h => !h.isCorrect && h.userChoice !== 'انتهى الوقت دون إجابة').length;
      const totalUnanswered = GameState.reviewHistory.filter(h => h.userChoice === 'انتهى الوقت دون إجابة').length;

      // Primary score calculation
      let displayScore = 0;
      if (GameState.mode === 'SOLO') {
        displayScore = GameState.teams[0]?.score || 0;
      } else {
        // Combined or highest team
        displayScore = GameState.teams.reduce((max, t) => t.score > max ? t.score : max, 0);
      }

      const percent = Math.round((displayScore / 1000) * 100);

      // Rank Badges according to requirements
      let rankTitle = '';
      let rankColor = '';
      if (percent >= 90) {
        rankTitle = '🌱 خبير الإنبات';
        rankColor = 'text-emerald-400 border-emerald-400 bg-emerald-950/80';
      } else if (percent >= 80) {
        rankTitle = '🌿 مستكشف نمو متميز';
        rankColor = 'text-teal-400 border-teal-400 bg-teal-950/80';
      } else if (percent >= 70) {
        rankTitle = '🌱 عالم البذور الواعد';
        rankColor = 'text-cyan-400 border-cyan-400 bg-cyan-950/80';
      } else if (percent >= 60) {
        rankTitle = '🔬 باحث الإنبات';
        rankColor = 'text-amber-400 border-amber-400 bg-amber-950/80';
      } else {
        rankTitle = '🌱 رحلتك بدأت… واصل الاستكشاف!';
        rankColor = 'text-slate-300 border-slate-500 bg-slate-900/80';
      }

      // Calculate Stars (out of 5)
      const starsCount = Math.max(1, Math.min(5, Math.round((percent / 100) * 5)));
      const starsHTML = '⭐'.repeat(starsCount);

      // Team scores table if team mode
      let teamTableHTML = '';
      if (GameState.mode === 'TEAM') {
        teamTableHTML = `
          <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 mb-6 text-right">
            <h4 class="text-xs font-bold text-amber-300 mb-2">📊 نتائج الفرق المتنافسة:</h4>
            <div class="space-y-2">
              ${GameState.teams.map((t, idx) => `
                <div class="flex items-center justify-between p-2 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                  <span class="font-bold text-white">${idx + 1}. ${t.name}</span>
                  <span class="font-black text-amber-400">${t.score} نقطة</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="w-full max-w-3xl bg-slate-900/95 border-2 border-amber-500 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur text-center relative overflow-hidden animate-pulse-subtle">
          
          <span class="text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/50 px-4 py-1 rounded-full uppercase">
            نهاية التحدي الكبير
          </span>

          <h1 class="text-2xl sm:text-4xl font-black text-white mt-3 mb-1">
            🏆 «نتيجة تحدي المليون العلمي»
          </h1>
          <p class="text-xs sm:text-sm text-slate-300 mb-6">درس كيف تنمو البذور؟ – الصف الخامس</p>

          <!-- Fully grown seedling visual -->
          <div class="mb-4">
            ${renderSeedStageSVG(5)}
          </div>

          <!-- Rank Badge -->
          <div class="inline-block border-2 ${rankColor} px-6 py-2 rounded-2xl shadow-lg mb-6">
            <span class="text-xs text-slate-400 block">الرتبة العلمية المستحقة:</span>
            <span class="text-lg sm:text-2xl font-black">${rankTitle}</span>
            <div class="text-sm mt-0.5">${starsHTML}</div>
          </div>

          <!-- Stats Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-xl mx-auto mb-6 text-center">
            
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
              <span class="text-slate-400 text-xs block">مجموع النقاط</span>
              <span class="text-xl sm:text-2xl font-black text-amber-400">${displayScore}</span>
              <span class="text-[10px] text-slate-500 block">من 1000 نقطة</span>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
              <span class="text-slate-400 text-xs block">النسبة المئوية</span>
              <span class="text-xl sm:text-2xl font-black text-cyan-400">${percent}%</span>
              <span class="text-[10px] text-slate-500 block">إتقان الدرس</span>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
              <span class="text-slate-400 text-xs block">إجابات صحيحة</span>
              <span class="text-xl sm:text-2xl font-black text-emerald-400">${totalCorrect}</span>
              <span class="text-[10px] text-slate-500 block">من 10 أسئلة</span>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
              <span class="text-slate-400 text-xs block">أخطاء وتجاوز</span>
              <span class="text-xl sm:text-2xl font-black text-red-400">${totalWrong + totalUnanswered}</span>
              <span class="text-[10px] text-slate-500 block">تحتاج مراجعة</span>
            </div>

          </div>

          ${teamTableHTML}

          <!-- Action Buttons -->
          <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            
            <button 
              onclick="renderReviewScreen()" 
              class="w-full sm:w-auto px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm border border-slate-700 transition flex items-center justify-center gap-2">
              <i class="fas fa-search text-cyan-400"></i>
              <span>🔎 مراجعة الإجابات والتفسيرات</span>
            </button>

            <button 
              onclick="renderStartScreen()" 
              class="w-full sm:w-auto px-8 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black text-sm shadow-lg hover:scale-105 active:scale-95 transition flex items-center justify-center gap-2">
              <i class="fas fa-redo-alt"></i>
              <span>🔄 لعب مرة أخرى (تصفير كامل)</span>
            </button>

          </div>

        </div>
      `;
    }
  </script>

  <script>
    function renderReviewScreen() {
      AudioEngine.playClick();
      const container = document.getElementById('app-container');

      const conceptsToRevise = [];
      GameState.reviewHistory.forEach(h => {
        if (!h.isCorrect && h.concept) {
          if (!conceptsToRevise.includes(h.concept)) {
            conceptsToRevise.push(h.concept);
          }
        }
      });

      container.innerHTML = `
        <div class="w-full max-w-4xl bg-slate-900/95 border border-slate-700 rounded-3xl p-4 sm:p-8 shadow-2xl backdrop-blur">
          
          <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
              <h2 class="text-xl sm:text-2xl font-black text-white">🔎 مراجعة الإجابات العلمية</h2>
              <span class="text-xs text-slate-400">تحليل الأسئلة العشرة والتفسير العلمي لكل خطوة</span>
            </div>
            <button 
              onclick="renderFinalResultScreen()" 
              class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700">
              العودة للشهادة ➔
            </button>
          </div>

          <!-- Concepts needing review banner -->
          ${conceptsToRevise.length > 0 ? `
            <div class="bg-amber-950/60 border border-amber-500/70 rounded-2xl p-4 mb-6 text-right">
              <div class="flex items-center gap-2 text-amber-400 font-bold text-sm mb-2">
                <span>📚</span>
                <span>مفاهيم تحتاج إلى مراجعة وتثبيت:</span>
              </div>
              <ul class="list-disc list-inside text-xs text-amber-200 space-y-1">
                ${conceptsToRevise.map(c => `<li>${c}</li>`).join('')}
              </ul>
            </div>
          ` : `
            <div class="bg-emerald-950/60 border border-emerald-500/70 rounded-2xl p-4 mb-6 text-center text-emerald-300 font-bold text-sm">
              🌟 ممتاز جداً! أتقنت جميع المفاهيم العلمية للدرس بنسبة 100%!
            </div>
          `}

          <!-- Question-by-question Cards -->
          <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
            ${GameState.reviewHistory.map((item, idx) => `
              <div class="bg-slate-950 border ${item.isCorrect ? 'border-emerald-500/40' : 'border-red-500/40'} rounded-2xl p-4 text-right shadow">
                
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-bold text-slate-400">السؤال ${idx + 1}: ${item.title}</span>
                  <span class="text-xs font-black px-2.5 py-0.5 rounded-full ${item.isCorrect ? 'bg-emerald-500/20 text-emerald-300' : 'bg-red-500/20 text-red-300'}">
                    ${item.isCorrect ? `✓ صحيح (+${item.pointsAwarded} نقطة)` : '✗ غير صحيح'}
                  </span>
                </div>

                <p class="text-xs sm:text-sm font-bold text-white mb-3 leading-relaxed">
                  ${item.question}
                </p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs mb-3">
                  <div class="p-2 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="text-slate-400 block mb-0.5">إجابتك:</span>
                    <span class="font-bold ${item.isCorrect ? 'text-emerald-400' : 'text-red-400'}">${item.userChoice}</span>
                  </div>
                  <div class="p-2 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="text-slate-400 block mb-0.5">الإجابة الصحيحة:</span>
                    <span class="font-bold text-emerald-400">${item.correctChoice}</span>
                  </div>
                </div>

                <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-300">
                  <strong class="text-amber-400 block mb-1">💡 التفسير العلمي:</strong>
                  « ${item.explanation} »
                </div>

              </div>
            `).join('')}
          </div>

          <div class="mt-6 text-center">
            <button 
              onclick="renderStartScreen()" 
              class="px-8 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black text-sm shadow-lg hover:scale-105 active:scale-95 transition">
              🔄 إعادة التحدي من البداية
            </button>
          </div>

        </div>
      `;
    }
  </script>

  <script>
    window.onload = function() {
      // Audio warmup on first user interaction
      const warmup = () => {
        AudioEngine.init();
        window.removeEventListener('click', warmup);
        window.removeEventListener('touchstart', warmup);
      };
      window.addEventListener('click', warmup);
      window.addEventListener('touchstart', warmup);

      // Render the official Start Screen
      renderStartScreen();
    };
  </script>
</body>
</html>
