        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, gainVal = 0.1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) { console.error(e); }
            }
            click() { this.playTone(600, 'sine', 0.08, 0.05); }
            confirm() { 
                this.playTone(440, 'triangle', 0.15, 0.1);
                setTimeout(() => this.playTone(554.37, 'triangle', 0.15, 0.1), 100);
                setTimeout(() => this.playTone(659.25, 'triangle', 0.3, 0.1), 200);
            }
            correct() {
                this.playTone(523.25, 'sine', 0.15, 0.15);

                notes.forEach((n, idx) => {
                    setTimeout(() => this.playTone(n, 'triangle', 0.25, 0.15), idx * 120);
                });
            }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startNewGame() {
            sfx.click();
            let pool = shuffleArray(questionBank);
            state.questions = pool.slice(0, 10);
            state.currentQuestionIndex = 0;
            state.score = 0;
            state.correctCount = 0;
            state.wrongCount = 0;
            state.unansweredCount = 0;
            state.stars = 0;
            state.lifelines = { fiftyFifty: true, expert: true, hint: true };
            state.history = [];
            state.teams = state.teams.map(t => ({ ...t, score: 0 }));
            state.currentTeamIndex = 0;
            prepareQuestion();
            state.currentScreen = 'GAME';
            render();
        }

        function prepareQuestion() {
            state.selectedOptionId = null;
            state.confirmed = false;
            state.feedbackShown = false;
            state.expertHintActive = false;
            state.hintActive = false;
            state.removedOptions = [];
            
            let q = state.questions[state.currentQuestionIndex];
            if (q.options) {
                q.shuffledOptions = shuffleArray(q.options);
            }
            if (q.isInteractiveOrdering && q.steps) {
                state.orderingUserList = shuffleArray(q.steps);
            }
            state.matchingUserSelections = {};

            let idx = state.currentQuestionIndex;
            if (idx < 6) state.timer = 30;
            else if (idx < 8) state.timer = 40;
            else if (idx === 8) state.timer = 45;
            else state.timer = 60;

            startTimer();
        }

        function startTimer() {
            clearInterval(state.timerInterval);
            state.paused = false;
            state.timerInterval = setInterval(() => {
                if (!state.paused && !state.confirmed && state.currentScreen === 'GAME') {
                    if (state.timer > 0) {
                        state.timer--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(state.timerInterval);
                        handleTimeOut();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-count');
            const bar = document.getElementById('timer-bar');
            if (el) el.innerText = state.timer;
            if (bar) {
                let maxT = state.currentQuestionIndex < 6 ? 30 : (state.currentQuestionIndex < 8 ? 40 : (state.currentQuestionIndex === 8 ? 45 : 60));
                let pct = (state.timer / maxT) * 100;
                bar.style.width = pct + '%';
                if (pct < 30) bar.className = 'h-full bg-red-500 transition-all duration-1000';
                else bar.className = 'h-full bg-cyan-400 transition-all duration-1000';
            }
        }

        function handleTimeOut() {
            sfx.wrong();
            state.confirmed = true;
            state.feedbackShown = true;
            state.isCorrect = false;
            state.unansweredCount++;
            let q = state.questions[state.currentQuestionIndex];
            state.history.push({
                question: q.question,
                userAnswer: 'انتهى الوقت (بدون إجابة)',
                correctAnswer: q.options && q.options[0] ? q.options[0].text : 'الإجابة النموذجية',
                isCorrect: false,
                why: q.why
            });
            render();
        }

        function useFiftyFifty() {
            if (!state.lifelines.fiftyFifty || state.confirmed) return;
            sfx.lifeline();
            state.lifelines.fiftyFifty = false;
            let q = state.questions[state.currentQuestionIndex];
            if (q.shuffledOptions && q.shuffledOptions.length > 2) {
                let wrongOpts = q.shuffledOptions.filter(o => o.id !== q.correctId);
                wrongOpts = shuffleArray(wrongOpts);
                if (wrongOpts.length >= 2) {
                    state.removedOptions = [wrongOpts[0].id, wrongOpts[1].id];
                }
            }
            render();
        }

        function useExpert() {
            if (!state.lifelines.expert || state.confirmed) return;
            sfx.lifeline();
            state.lifelines.expert = false;
            state.expertHintActive = true;
            render();
        }

        function useHint() {
            if (!state.lifelines.hint || state.confirmed) return;
            sfx.lifeline();
            state.lifelines.hint = false;
            state.hintActive = true;
            render();
        }

        function confirmAnswer() {
            let q = state.questions[state.currentQuestionIndex];
            
            if (q.isInteractiveOrdering) {
                let userCurrentOrder = state.orderingUserList.map(s => s.id);
                let isMatch = userCurrentOrder.every((val, index) => val === q.correctOrder[index]);
                state.selectedOptionId = isMatch ? 'correct_order_choice' : 'wrong_order';
            } else if (q.isInteractiveMatching) {
                let allCorrect = q.pairs.every(p => state.matchingUserSelections[p.left] === p.right);
                state.selectedOptionId = allCorrect ? 'matching_all_correct' : 'wrong_matching';
            }

            if (!state.selectedOptionId || state.confirmed) return;
            
            clearInterval(state.timerInterval);
            sfx.confirm();
            state.confirmed = true;
            state.feedbackShown = true;

            state.isCorrect = (state.selectedOptionId === q.correctId);
            let earnedPoints = prizeLadder[9 - state.currentQuestionIndex].points;

            if (state.isCorrect) {
                sfx.correct();
                state.score += earnedPoints;
                state.correctCount++;
                state.stars += 1;
                if (state.gameMode === 'TEAM') {
                    state.teams[state.currentTeamIndex].score += earnedPoints;
                }
            } else {
                sfx.wrong();
                state.wrongCount++;
            }

            let userOptObj = q.options ? q.options.find(o => o.id === state.selectedOptionId) : null;
            let correctOptObj = q.options ? q.options.find(o => o.id === q.correctId) : null;

            state.history.push({
                question: q.question,
                userAnswer: userOptObj ? userOptObj.text : (state.isCorrect ? 'إجابة صحيحة' : 'إجابة غير دقيقة'),
                correctAnswer: correctOptObj ? correctOptObj.text : 'الترتيب أو التوصيل السليم',
                isCorrect: state.isCorrect,
                why: q.why
            });

            render();
        }

        function nextQuestion() {
            sfx.click();
            if (state.gameMode === 'TEAM') {
                state.currentTeamIndex = (state.currentTeamIndex + 1) % state.teams.length;
            }
            if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex++;
                prepareQuestion();
                render();
            } else {
                sfx.victory();
                state.currentScreen = 'FINISHED';
                render();
            }
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            if (state.currentScreen === 'HOME') {
                app.innerHTML = renderHomeScreen();
            } else if (state.currentScreen === 'MODE_SELECT') {
                app.innerHTML = renderModeSelectScreen();
            } else if (state.currentScreen === 'PLAYER_SETUP') {
                app.innerHTML = renderPlayerSetupScreen();
            } else if (state.currentScreen === 'GAME') {
                app.innerHTML = renderGameScreen();
                updateTimerDisplay();
            } else if (state.currentScreen === 'FINISHED') {
                app.innerHTML = renderFinishedScreen();
            } else if (state.currentScreen === 'REVIEW') {
                app.innerHTML = renderReviewScreen();
            }
        }

        function saveSetupAndStart() {
            sfx.click();
            if (state.gameMode === 'SINGLE') {
                const inp = document.getElementById('player-name-input');
                if (inp && inp.value.trim()) state.playerName = inp.value.trim();
            } else {
                const t1 = document.getElementById('team1-input');
                const t2 = document.getElementById('team2-input');
                if (t1 && t1.value.trim()) state.teams[0].name = t1.value.trim();
                if (t2 && t2.value.trim()) state.teams[1].name = t2.value.trim();
            }
            startNewGame();
        }

        function renderGameScreen() {
            let q = state.questions[state.currentQuestionIndex];
            let currentPrize = prizeLadder[9 - state.currentQuestionIndex];

            return `
                <div class="flex-1 flex flex-col justify-between w-full max-w-6xl mx-auto py-1 animate-fade">
                    <!-- Studio Top Bar -->
                    <div class="flex flex-wrap items-center justify-between gap-2 p-2.5 rounded-xl studio-glass mb-2 border border-sky-500/20">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-0.5 bg-amber-500/20 border border-amber-500/40 rounded-full text-amber-300 text-[11px] font-bold">
                                🏆 السؤال ${state.currentQuestionIndex + 1} / 10
                            </span>
                            <span class="px-2.5 py-0.5 bg-cyan-500/20 border border-cyan-500/40 rounded-full text-cyan-300 text-[11px] font-bold">
                                ${state.gameMode === 'SINGLE' ? `👤 ${state.playerName}` : `👥 دور: ${state.teams[state.currentTeamIndex].name}`}
                            </span>
                        </div>

                        <!-- Timer Widget -->
                        <div class="flex items-center gap-1.5 bg-slate-900/80 px-2.5 py-0.5 rounded-full border border-sky-500/30">
                            <i class="fa-solid fa-clock text-cyan-400 animate-pulse text-xs"></i>
                            <span id="timer-count" class="font-mono font-bold text-xs text-cyan-300">${state.timer}</span>
                            <span class="text-[9px] text-slate-400">ث</span>
                            <div class="w-12 h-1 bg-slate-800 rounded-full overflow-hidden ml-1">
                                <div id="timer-bar" class="h-full bg-cyan-400 transition-all duration-1000" style="width: 100%;"></div>
                            </div>
                        </div>

                        <!-- Lifelines & Score -->
                        <div class="flex items-center gap-1.5">
                            <button onclick="useFiftyFifty()" title="مساعدة المختبر (حذف إجابتين)" ${!state.lifelines.fiftyFifty || state.confirmed ? 'opacity-40 cursor-not-allowed' : ''} class="w-7 h-7 rounded-lg bg-blue-600/30 border border-blue-400/50 flex items-center justify-center text-blue-200 text-xs hover:bg-blue-600/50 transition-all">
                                <i class="fa-solid fa-flask"></i>
                            </button>
                            <button onclick="useExpert()" title="رأي الخبير" ${!state.lifelines.expert || state.confirmed ? 'opacity-40 cursor-not-allowed' : ''} class="w-7 h-7 rounded-lg bg-purple-600/30 border border-purple-400/50 flex items-center justify-center text-purple-200 text-xs hover:bg-purple-600/50 transition-all">
                                <i class="fa-solid fa-brain"></i>
                            </button>
                            <button onclick="useHint()" title="تلميح العالم" ${!state.lifelines.hint || state.confirmed ? 'opacity-40 cursor-not-allowed' : ''} class="w-7 h-7 rounded-lg bg-amber-600/30 border border-amber-400/50 flex items-center justify-center text-amber-200 text-xs hover:bg-amber-600/50 transition-all">
                                <i class="fa-solid fa-lightbulb"></i>
                            </button>
                            <div class="px-2.5 py-0.5 bg-emerald-500/20 border border-emerald-500/40 rounded-full text-emerald-300 text-[11px] font-bold">
                                💰 ${state.score} ن
                            </div>
                        </div>
                    </div>

                    <!-- Expert & Hint banners if active -->
                    ${renderExpertBanner()}
                    ${renderHintBanner()}

                    <!-- Core Question & Prize Ladder Grid (Strict Side Placement for Desktop & Tablet) -->
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-2.5 flex-1 items-start">
                        
                        <!-- Question & Options Area (3 Columns on Desktop) -->
                        <div class="lg:col-span-3 flex flex-col gap-2.5">
                            
                            <!-- Question Title & Visual Container -->
                            <div class="studio-card rounded-xl p-3 sm:p-4 border border-sky-500/30 relative">
                                <div class="flex items-center justify-between mb-1.5">
                                    <span class="text-[11px] font-bold text-cyan-300 px-2 py-0.5 bg-cyan-950/60 rounded border border-cyan-500/30">
                                        ${q.title}
                                    </span>
                                    <span class="text-[11px] font-bold text-amber-300">
                                        ⭐ قيمة السؤال: ${currentPrize.points} نقطة
                                    </span>
                                </div>
                                <h2 class="text-xs sm:text-sm md:text-base font-bold text-white mb-2 leading-snug">
                                    ${q.question}
                                </h2>

                                <!-- Dynamic Experiment / Image / Visual Asset -->
                                ${q.imageHTML}
                            </div>

                            <!-- Interactive Special Question Types (Ordering or Matching) or Compact Standard Options Grid -->
                            ${renderQuestionInputs(q)}

                            <!-- Confirm & Feedback Action Area -->
                            <div class="flex items-center justify-between gap-2 mt-1">
                                ${!state.confirmed ? `
                                    <button onclick="confirmAnswer()" ${!state.selectedOptionId && !q.isInteractiveOrdering && !q.isInteractiveMatching ? 'opacity-50 cursor-not-allowed' : ''} class="w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-xs sm:text-sm rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-check-circle"></i> تأكيد الإجابة
                                    </button>
                                ` : `
                                    <div class="w-full flex flex-col gap-2">
                                        <div class="p-2.5 rounded-xl ${state.isCorrect ? 'bg-emerald-950/80 border border-emerald-500/60 text-emerald-200' : 'bg-red-950/80 border border-red-500/60 text-red-200'} flex items-center justify-between">
                                            <span class="font-bold text-xs flex items-center gap-2">
                                                ${state.isCorrect ? '🎉 إجابة صحيحة! أحسنت!' : '❌ إجابة غير صحيحة'}
                                            </span>
                                            <span class="text-[10px] opacity-80">المفهوم: علمي موثوق</span>
                                        </div>
                                        
                                        <!-- Why & Concept Explanation -->
                                        <div class="p-2.5 rounded-xl bg-slate-900/90 border border-sky-500/40 text-slate-200 text-xs">
                                            <p class="font-bold text-cyan-300 mb-0.5"><i class="fa-solid fa-circle-question"></i> لماذا؟ والشرح العلمي:</p>
                                            <p class="leading-relaxed text-[11px]">${q.why}</p>
                                        </div>

                                        <button onclick="nextQuestion()" class="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black text-xs sm:text-sm rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                                            تابع التحدي <i class="fa-solid fa-arrow-left"></i>
                                        </button>
                                    </div>
                                `}
                            </div>

                        </div>

                        <!-- Prize Ladder Column (Strictly on the side, NEVER below options) -->
                        <div class="studio-card rounded-xl p-2.5 border border-amber-500/30 flex flex-col gap-1 h-full max-h-[480px] overflow-y-auto">
                            <h3 class="text-center font-bold text-[11px] text-amber-300 mb-1 border-b border-amber-500/20 pb-1">
                                سلم الجوائز (مليون العلوم)
                            </h3>
                            <div class="flex flex-col gap-1">
                                ${prizeLadder.map((step, idx) => {
                                    let qIndex = 9 - idx;
                                    let isActive = (qIndex === state.currentQuestionIndex);
                                    let isPassed = (qIndex < state.currentQuestionIndex);
                                    let stepClass = "prize-step p-1 px-2 rounded-md text-[11px] flex items-center justify-between border border-slate-700/50 ";
                                    
                                    if (isActive) {
                                        stepClass += " active bg-amber-500 text-slate-950 font-bold shadow-md";
                                    } else if (isPassed) {
                                        stepClass += " passed bg-emerald-950/50 text-emerald-300 border-emerald-500/40";
                                    } else {
                                        stepClass += " bg-slate-900/80 text-slate-300";
                                    }
                                    if (step.safe) stepClass += " safe border-dashed border-sky-400";

                                    return `
                                        <div class="${stepClass}">
                                            <span class="font-mono font-bold">سـ ${step.level}</span>
                                            <span class="font-black">${step.points} ن</span>
                                        </div>
                                    `;
                                }).reverse().join('')}
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        function renderQuestionInputs(q) {
            if (q.isInteractiveOrdering) {
                return `
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-sky-500/30 flex flex-col gap-2">
                        <p class="text-xs text-slate-300 text-center font-semibold mb-1">اضغط على العناصر لتحريكها وترتيبها تصاعدياً:</p>
                        <div class="flex flex-col gap-1.5">
                            ${state.orderingUserList.map((st, i) => `
                                <div onclick="moveOrderingItem(${i})" class="p-2.5 bg-slate-800 border border-sky-500/40 rounded-lg text-xs text-white font-bold flex items-center justify-between cursor-pointer hover:bg-slate-700 transition-all">
                                    <span>${i + 1}. ${st.text}</span>
                                    <i class="fa-solid fa-arrows-up-down text-cyan-400 text-[11px]"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (q.isInteractiveMatching) {
                return `
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-sky-500/30 flex flex-col gap-2">
                        <p class="text-xs text-slate-300 text-center font-semibold mb-1">اختر العنصر ثم اختر ما يناسبه من القائمة المقابلة:</p>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="flex flex-col gap-2">
                                ${q.pairs.map(p => `
                                    <div class="p-2 bg-slate-800 border border-sky-500/30 rounded-lg text-xs text-cyan-300 font-bold text-center">
                                        ${p.left}
                                    </div>
                                `).join('')}
                            </div>
                            <div class="flex flex-col gap-2">
                                ${q.pairs.map(p => {
                                    let currentSel = state.matchingUserSelections[p.left] || '';
                                    return `
                                        <select onchange="updateMatchingSelection('${p.left}', this.value)" class="p-2 bg-slate-800 border border-cyan-500/40 rounded-lg text-xs text-white font-medium focus:outline-none">
                                            <option value="">-- اختر المطابقة --</option>
                                            ${shuffleArray(q.pairs).map(item => `
                                                <option value="${item.right}" ${currentSel === item.right ? 'selected' : ''}>${item.right}</option>
                                            `).join('')}
                                        </select>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${q.shuffledOptions.map((opt, i) => {
                            let isRemoved = state.removedOptions.includes(opt.id);
                            let isSelected = state.selectedOptionId === opt.id;
                            let btnClass = "studio-card p-2.5 rounded-xl border text-right transition-all flex items-center gap-2.5 relative group ";
                            
                            if (isRemoved) {
                                return `<div class="p-2.5 rounded-xl bg-slate-950/40 border border-slate-800 opacity-25 cursor-not-allowed flex items-center gap-2.5 text-[11px] text-slate-600"><span>(محذوفة)</span></div>`;
                            }

                            if (state.confirmed) {
                                if (opt.id === q.correctId) {
                                    btnClass += " bg-emerald-950/85 border-emerald-500 text-emerald-100 shadow-[0_0_12px_rgba(16,185,129,0.4)]";
                                } else if (isSelected) {
                                    btnClass += " bg-red-950/85 border-red-500 text-red-100 shadow-[0_0_12px_rgba(239,68,68,0.4)]";
                                } else {
                                    btnClass += " opacity-50 border-slate-700 bg-slate-900/50";
                                }
                            } else {
                                if (isSelected) {
                                    btnClass += " border-cyan-400 bg-cyan-950/40 shadow-[0_0_12px_rgba(56,189,248,0.3)] scale-[1.01]";
                                } else {
                                    btnClass += " border-sky-500/30 hover:border-sky-400 hover:bg-slate-800/80 bg-slate-900/80 text-slate-200";
                                }
                            }

                            let letter = ['أ', 'ب', 'ج', 'د'][i];

                            return `
                                <button onclick="selectOption('${opt.id}')" ${state.confirmed ? 'disabled' : ''} class="${btnClass}">
                                    <div class="w-6 h-6 rounded-md bg-sky-500/20 border border-sky-500/40 flex items-center justify-center text-cyan-300 font-bold text-[11px] shrink-0">
                                        ${letter}
                                    </div>
                                    <div class="text-xs sm:text-[13px] font-semibold leading-snug flex-1">
                                        ${opt.text}
                                    </div>
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        function moveOrderingItem(idx) {
            if (state.confirmed) return;
            sfx.click();
            if (idx > 0) {
                let temp = state.orderingUserList[idx];
                state.orderingUserList[idx] = state.orderingUserList[idx - 1];
                state.orderingUserList[idx - 1] = temp;
                render();
            }
        }

        function updateMatchingSelection(leftKey, rightVal) {
            if (state.confirmed) return;
            sfx.click();
            state.matchingUserSelections[leftKey] = rightVal;
        }

        function selectOption(id) {
            if (state.confirmed) return;
            sfx.click();
            state.selectedOptionId = id;
            render();
        }

        function renderExpertBanner() {
            if (!state.expertHintActive) return '';
            let q = state.questions[state.currentQuestionIndex];
            let correctOpt = q.options ? q.options.find(o => o.id === q.correctId) : null;
            return `
                <div class="p-2.5 bg-purple-950/80 border border-purple-500/60 rounded-xl text-purple-200 text-xs mb-2 flex items-center gap-2.5 animate-fade">
                    <i class="fa-solid fa-brain text-lg text-purple-400"></i>
                    <div>
                        <span class="font-bold">رأي الخبير العلمي:</span> أعتقد بنسبة كبيرة أن الإجابة الصحيحة هي: <strong class="text-white underline">${correctOpt ? correctOpt.text : 'التوصيل أو الترتيب السليم'}</strong>.
                    </div>
                </div>
            `;
        }

        function renderHintBanner() {
            if (!state.hintActive) return '';
            return `
                <div class="p-2.5 bg-amber-950/80 border border-amber-500/60 rounded-xl text-amber-200 text-xs mb-2 flex items-center gap-2.5 animate-fade">
                    <i class="fa-solid fa-lightbulb text-lg text-amber-400"></i>
                    <div>
                        <span class="font-bold">تلميح العالم:</span> تذكر دائمًا أن التكثيف يتطلب غازًا (بخار ماء) يلامس سطحًا باردًا ليفقد حرارته ويتحول إلى سائل!
                    </div>
                </div>
            `;
        }

        function renderFinishedScreen() {
            let percentage = Math.round((state.correctCount / 10) * 100);
            let rankTitle = "🚀 متدرب العلوم";
            if (percentage >= 90) rankTitle = "🏆 عبقري العلوم";
            else if (percentage >= 80) rankTitle = "🥇 خبير علمي";
            else if (percentage >= 70) rankTitle = "🔬 عالم واعد";
            else if (percentage >= 60) rankTitle = "🧠 مستكشف المعرفة";

            return `
                <div class="flex-1 flex flex-col items-center justify-center p-4 animate-fade">
                    <div class="studio-card rounded-2xl p-6 sm:p-8 w-full max-w-md text-center relative overflow-hidden">
                        <div class="w-14 h-14 bg-amber-500/20 border border-amber-500/40 rounded-full flex items-center justify-center text-2xl mx-auto mb-3 text-amber-300 shadow-lg">
                            🏆
                        </div>
                        <h2 class="text-xl sm:text-2xl font-black text-white mb-1">انتهى تحدي المليون العلمي!</h2>
                        <p class="text-xs text-cyan-300 mb-5">أداء رائع في درس التكثيف - سلطنة عُمان</p>

                        <div class="grid grid-cols-2 gap-2.5 mb-5">
                            <div class="bg-slate-900/90 p-2.5 rounded-xl border border-sky-500/30">
                                <span class="text-[11px] text-slate-400 block mb-0.5">النقاط الكلية</span>
                                <span class="text-lg font-black text-amber-300">${state.score}</span>
                            </div>
                            <div class="bg-slate-900/90 p-2.5 rounded-xl border border-sky-500/30">
                                <span class="text-[11px] text-slate-400 block mb-0.5">الرتبة العلمية</span>
                                <span class="text-[11px] font-bold text-cyan-200">${rankTitle}</span>
                            </div>
                        </div>

                        <div class="flex flex-col gap-1.5 mb-5 text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <div class="flex justify-between"><span>الإجابات الصحيحة:</span><strong class="text-emerald-400">${state.correctCount}</strong></div>
                            <div class="flex justify-between"><span>الإجابات الخاطئة:</span><strong class="text-red-400">${state.wrongCount}</strong></div>
                            <div class="flex justify-between"><span>نسبة النجاح:</span><strong class="text-cyan-400">${percentage}%</strong></div>
                        </div>

                        <div class="flex flex-col gap-2.5">
                            <button onclick="sfx.click(); state.currentScreen='REVIEW'; render();" class="w-full py-2.5 bg-purple-600/80 hover:bg-purple-600 text-white font-bold text-xs rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-book-open"></i> مراجعة الإجابات والشرح
                            </button>

                            <button onclick="startNewGame()" class="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i> العب من جديد (أسئلة وعشوائية جديدة)
                            </button>

                            <button onclick="sfx.click(); state.currentScreen='HOME'; render();" class="text-[11px] text-slate-400 hover:text-cyan-300 transition-colors mt-1">
                                العودة للشاشة الرئيسية
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReviewScreen() {
            return `
                <div class="flex-1 flex flex-col max-w-3xl mx-auto p-3 animate-fade w-full">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-base font-black text-cyan-300 flex items-center gap-2">
                            <i class="fa-solid fa-book-open"></i> مراجعة إجابات التحدي
                        </h2>
                        <button onclick="sfx.click(); state.currentScreen='FINISHED'; render();" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition-all">
                            العودة للنتائج
                        </button>
                    </div>

                    <div class="flex flex-col gap-2.5 overflow-y-auto max-h-[70vh] pb-3">
                        ${state.history.map((item, idx) => `
                            <div class="studio-card p-3 rounded-xl border ${item.isCorrect ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-red-500/40 bg-red-950/10'}">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-[11px] font-bold text-slate-300">السؤال ${idx + 1}</span>
                                    <span class="text-[11px] font-bold ${item.isCorrect ? 'text-emerald-400' : 'text-red-400'}">
                                        ${item.isCorrect ? '✓ صحيح' : '✗ غير صحيح'}
                                    </span>
                                </div>
                                <h3 class="text-xs sm:text-sm font-bold text-white mb-1.5">${item.question}</h3>
                                <div class="text-[11px] text-slate-300 flex flex-col gap-1 mb-1.5 bg-slate-900/60 p-2 rounded-lg">
                                    <div>إجابتك: <strong class="${item.isCorrect ? 'text-emerald-300' : 'text-red-300'}">${item.userAnswer}</strong></div>
                                    <div>الإجابة الصحيحة: <strong class="text-cyan-300">${item.correctAnswer}</strong></div>
                                </div>
                                <div class="text-[11px] text-slate-200 bg-sky-950/30 border border-sky-500/30 p-2 rounded-lg">
                                    <strong class="text-cyan-300">التفسير العلمي:</strong> ${item.why}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.onload = function () {
            render();
        };
    </script>
</body>
</html>
