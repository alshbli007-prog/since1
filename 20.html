    <!-- Audio & Game Script -->
    <script>
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(165, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'clue') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'solve') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'sine';
                        o.frequency.setValueAtTime(freq, now + i * 0.08);
                        g.gain.setValueAtTime(0.15, now + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.start(now + i * 0.08);
                        o.stop(now + 1.2);
                    });
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        function toggleAudio() {

            document.getElementById('audio-toggle-btn').innerText = soundEnabled ? '🔊' : '🔇';

        function shuffleArray(array) {
            const arr = [...array];

                [arr[i], arr[j]] = [arr[j], arr[i]];

        let questionsData = [];

        function prepareGameQuestions() {
            questionsData = rawQuestionsData.map(q => {
                let newQ = { ...q };
                if (newQ.options) {
                    newQ.options = shuffleArray(newQ.options);
                }
                return newQ;
            });
        }

        function render() {
            const container = document.getElementById('app-container');
            const headerStats = document.getElementById('header-stats');
            const timerContainer = document.getElementById('timer-container');

            if (gameState.status === 'START') {
                headerStats.classList.add('hidden');
                container.innerHTML = renderStartScreen();
            } else if (gameState.status === 'MODE_SELECTION') {
                headerStats.classList.add('hidden');
                container.innerHTML = renderModeSelectionScreen();
            } else if (gameState.status === 'PLAYER_SETUP') {
                headerStats.classList.add('hidden');
                container.innerHTML = renderPlayerSetupScreen();
            } else if (gameState.status === 'TEAM_SETUP') {
                headerStats.classList.add('hidden');
                container.innerHTML = renderTeamSetupScreen();
            } else if (gameState.status === 'READY') {
                headerStats.classList.add('hidden');
                container.innerHTML = renderReadyScreen();
            } else if (gameState.status === 'QUESTION' || gameState.status === 'FEEDBACK') {
                headerStats.classList.remove('hidden');
                timerContainer.classList.remove('hidden');
                document.getElementById('stat-player').innerText = gameState.mode === 'solo' ? gameState.playerName : gameState.teams[gameState.currentTeamIndex].name;
                document.getElementById('stat-score').innerText = gameState.score;
                document.getElementById('stat-clues').innerText = gameState.cluesUnlocked;
                container.innerHTML = renderQuestionScreen();
            } else if (gameState.status === 'FINISHED') {
                headerStats.classList.remove('hidden');
                timerContainer.classList.add('hidden');
                container.innerHTML = renderFinishedScreen();
            } else if (gameState.status === 'REVIEW') {
                headerStats.classList.add('hidden');
                container.innerHTML = renderReviewScreen();
            }
        }

        function renderQuestionScreen() {
            const q = questionsData[gameState.currentQuestionIndex];

        function renderSceneAsset(sceneType) {
            if (sceneType === 'ice_melt') {
                return `
                    <div class="flex items-center justify-center gap-6 text-center">
                        <div class="flex flex-col items-center">

                        </div>

                        <div class="flex flex-col items-center">
                            <div class="w-16 h-16 bg-cyan-900/60 rounded-xl flex items-center justify-center shadow-md text-2xl border-2 border-cyan-500/50">💧</div>
                            <span class="text-xs text-slate-300 mt-2">تحول الحالة</span>
                        </div>
                    </div>
                `;
            } else if (sceneType === 'particles') {
                return `
                    <div class="grid grid-cols-2 gap-6 w-full max-w-md">
                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-center">
                            <span class="text-xs text-blue-400 font-bold block mb-2">النموذج A</span>
                            <div class="flex flex-wrap justify-center gap-1 p-2 bg-slate-950 rounded-lg">
                                <div class="w-4 h-4 bg-slate-400 rounded-full"></div>
                                <div class="w-4 h-4 bg-slate-400 rounded-full"></div>
                                <div class="w-4 h-4 bg-slate-400 rounded-full"></div>
                                <div class="w-4 h-4 bg-slate-400 rounded-full"></div>
                            </div>
                        </div>
                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-center">
                            <span class="text-xs text-cyan-400 font-bold block mb-2">النموذج B</span>
                            <div class="flex flex-wrap justify-center gap-3 p-2 bg-slate-950 rounded-lg">
                                <div class="w-4 h-4 bg-blue-400 rounded-full animate-bounce"></div>
                                <div class="w-4 h-4 bg-blue-400 rounded-full animate-pulse"></div>
                                <div class="w-4 h-4 bg-blue-400 rounded-full"></div>
                                <div class="w-4 h-4 bg-blue-400 rounded-full animate-bounce"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (sceneType === 'thermometer') {
                return `
                    <div class="flex items-center gap-6">
                        <div class="flex flex-col items-center">
                            <div class="w-8 h-32 bg-slate-900 border-2 border-slate-700 rounded-full relative flex items-end justify-center overflow-hidden">
                                <div class="w-4 bg-blue-500 rounded-b-full h-[40%]"></div>
                            </div>
                            <span class="text-xs text-blue-300 font-bold mt-2">مقياس الحرارة</span>
                        </div>
                        <div class="text-slate-300 text-xs bg-slate-900 p-3 rounded-xl border border-slate-800 max-w-xs">
                            رصد دقيق لقراءات مقياس الحرارة والملاحظة المعملية لعينات الثلج.
                        </div>
                    </div>
                `;
            } else if (sceneType === 'sun_vs_flame') {
                return `
                    <div class="flex items-center justify-around w-full gap-4">
                        <div class="text-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <span class="text-2xl">☀️</span>
                            <p class="text-xs text-slate-300 mt-1">طاقة الشمس الطبيعية</p>
                        </div>
                        <div class="text-xl text-blue-400 font-bold">VS</div>
                        <div class="text-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <span class="text-2xl">🔥</span>
                            <p class="text-xs text-slate-300 mt-1">مصدر حراري مباشر</p>
                        </div>
                    </div>
                `;
            } else if (sceneType === 'graph_point' || sceneType === 'graph_trend') {
                // Corrected Scientific Melting Curve:
                // Temperature starts at -5°C (y=90), rises to 0°C (y=60), then plateaus flat at 0°C for melting, then rises as liquid.
                // Point ع is precisely placed at the *beginning* of the flat plateau (x=85, y=60).
                return `
                    <div class="w-full max-w-md bg-slate-900 p-4 rounded-xl border border-slate-800 text-center">
                        <div class="h-32 w-full border-b border-l border-slate-700 relative flex items-end">
                            <div class="absolute inset-0 flex items-center justify-center p-2">
                                <svg class="w-full h-full" viewBox="0 0 240 120" preserveAspectRatio="none">
                                    <line x1="20" y1="100" x2="220" y2="100" stroke="#334155" stroke-dasharray="2" />
                                    <line x1="20" y1="60" x2="220" y2="60" stroke="#334155" stroke-dasharray="2" />
                                    
                                    <!-- Curve path: rises from (-5°C at y=90) to (0°C at y=60), plateaus flat from x=80 to x=160, then rises -->
                                    <path d="M 30 90 L 80 60 L 160 60 L 210 20" fill="none" stroke="#3b82f6" stroke-width="3" />
                                    
                                    <!-- Point ع precisely at the beginning of the flat plateau -->
                                    <circle cx="80" cy="60" r="6" fill="#f59e0b" />
                                    <text x="70" y="48" fill="#f59e0b" font-size="14" font-weight="bold">ع</text>
                                </svg>
                            </div>
                        </div>
                        <span class="text-xs text-slate-400 mt-2 block">رسم بياني لتسخين الثلج (النقطة ع تمثل بداية ثبوت درجة الحرارة عند الانصهار)</span>
                    </div>
                `;
            } else if (sceneType === 'sorting_steps') {
                return `
                    <div class="text-xs text-blue-300 bg-slate-900 px-4 py-2 rounded-lg border border-slate-800">
                        ترتيب تسلسلي لمراحل حدوث الانصهار في المعمل
                    </div>
                `;
            } else if (sceneType === 'matching_scene') {
                return `
                    <div class="text-xs text-cyan-300 bg-slate-900 px-4 py-2 rounded-lg border border-slate-800">
                        لوحة توصيل الأدلة والمفاهيم العلمية للدرس
                    </div>
                `;
            } else if (sceneType === 'salt_scene') {
                return `
                    <div class="flex items-center gap-6">
                        <div class="text-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <span class="text-2xl">🧪🧂</span>
                            <p class="text-xs text-slate-300 mt-1">مختبر المحاليل والعينات</p>
                        </div>
                        <div class="text-slate-300 text-xs bg-slate-900 p-3 rounded-xl border border-slate-800 max-w-xs">
                            فحص أثر إضافة الملح على درجات انصهار الثلج.
                        </div>
                    </div>
                `;
            } else if (sceneType === 'final_lab') {
                return `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-center w-full">
                        <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 text-xs">🔬 دليل الانصهار</div>
                        <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 text-xs">🌡️ ميزان الحرارة</div>
                        <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 text-xs">🧬 نموذج الجزيئات</div>
                        <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 text-xs">🧂 عينة الملح</div>
                    </div>
                `;
            }
            return `<div class="text-slate-400 text-xs">غرفة التحقيق العلمي</div>`;
        }

        function renderQuestionInteraction(q, isFeedback) {
            if (q.type === 'sorting') {
                return renderSortingInteraction(q, isFeedback);
            } else if (q.type === 'matching') {
                return renderMatchingInteraction(q, isFeedback);
            } else {
                return q.options.map(opt => {
                    let btnStyle = "bg-slate-800/80 hover:bg-slate-750 border-slate-700 text-slate-200";
                    if (isFeedback) {
                        if (opt.id === q.correctOptionId) {
                            btnStyle = "bg-emerald-900/60 border-emerald-500 text-emerald-200 font-bold";
                        } else if (opt.id === gameState.selectedOptionId) {
                            btnStyle = "bg-red-900/60 border-red-500 text-red-200";
                        } else {
                            btnStyle = "bg-slate-900/50 border-slate-800 text-slate-500 opacity-50";
                        }
                    } else if (gameState.selectedOptionId === opt.id) {
                        btnStyle = "bg-blue-900/60 border-blue-500 text-blue-200 font-bold";
                    }

                    return `
                        <button ${isFeedback ? 'disabled' : `onclick="selectOption('${opt.id}')"`} 
                            class="w-full text-right p-4 rounded-xl border transition flex items-center justify-between ${btnStyle}">
                            <span class="text-sm md:text-base">${opt.text}</span>
                            <span class="w-6 h-6 rounded-full border border-slate-600 flex items-center justify-center text-xs font-mono">
                                ${gameState.selectedOptionId === opt.id ? '✓' : ''}
                            </span>
                        </button>
                    `;
                }).join('') + (!isFeedback ? `
                    <div class="pt-4">
                        <button onclick="confirmAnswer()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-sm">
                            تأكيد الإجابة 🔒
                        </button>
                    </div>
                ` : '');
            }
        }

        function renderSortingInteraction(q, isFeedback) {
            if (gameState.sortingOrder.length === 0) {
                gameState.sortingOrder = [...q.items].sort(() => Math.random() - 0.5).map(i => i.id);
            }

            return `
                <div class="space-y-2 mb-4">
                    <p class="text-xs text-slate-400">انقر على الأسهم لتعديل الترتيب التصاعدي العلمي السليم:</p>
                    <div class="space-y-2">
                        ${gameState.sortingOrder.map((itemId, idx) => {
                            const item = q.items.find(i => i.id === itemId);
                            return `
                                <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl flex items-center justify-between text-sm">
                                    <span>${idx + 1}. ${item.text}</span>
                                    ${!isFeedback ? `
                                        <div class="flex gap-1">
                                            <button onclick="moveSortingItem(${idx}, -1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs">⬆️</button>
                                            <button onclick="moveSortingItem(${idx}, 1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs">⬇️</button>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                ${!isFeedback ? `
                    <button onclick="confirmSortingAnswer()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-sm">
                        تأكيد الترتيب 🔒
                    </button>
                ` : ''}
            `;
        }

        function renderMatchingInteraction(q, isFeedback) {
            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div class="space-y-2">
                        <span class="text-xs font-bold text-blue-400 block mb-1">المفاهيم العلمية:</span>
                        ${q.leftItems.map(left => {
                            const connectedRightId = gameState.matchingPairs[left.id];
                            const connectedRight = connectedRightId ? q.rightItems.find(r => r.id === connectedRightId) : null;
                            return `
                                <div class="bg-slate-900 border ${connectedRight ? 'border-blue-500' : 'border-slate-700'} p-3 rounded-xl text-sm flex flex-col gap-2">
                                    <div class="flex justify-between items-center">
                                        <span>${left.text}</span>
                                        ${!isFeedback && !connectedRight ? `
                                            <button onclick="selectMatchingLeft('${left.id}')" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs">
                                                ${gameState.tempLeftSelected === left.id ? 'محدد...' : 'اختر للربط'}
                                            </button>
                                        ` : ''}
                                    </div>
                                    ${connectedRight ? `
                                        <div class="flex justify-between items-center bg-blue-950/40 p-2 rounded-lg border border-blue-800/50 text-xs">
                                            <span class="text-blue-300">🔗 متصل مع: ${connectedRight.text}</span>
                                            ${!isFeedback ? `
                                                <button onclick="cancelMatch('${left.id}')" class="px-2 py-1 bg-red-900/60 hover:bg-red-800 text-red-200 rounded text-xs font-bold">
                                                    إلغاء التوصيل
                                                </button>
                                            ` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div class="space-y-2">
                        <span class="text-xs font-bold text-cyan-400 block mb-1">التفسيرات والإجابات:</span>
                        ${q.rightItems.map(right => {
                            const isAlreadyConnected = Object.values(gameState.matchingPairs).includes(right.id);
                            return `
                                <div class="bg-slate-900 border ${isAlreadyConnected ? 'border-emerald-500/50 opacity-75' : 'border-slate-700'} p-3 rounded-xl text-sm flex justify-between items-center">
                                    <span>${right.text}</span>
                                    ${!isFeedback && gameState.tempLeftSelected && !isAlreadyConnected ? `
                                        <button onclick="createMatch('${gameState.tempLeftSelected}', '${right.id}')" class="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs">
                                            ربط هنا 🔗
                                        </button>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                ${!isFeedback ? `
                    <button onclick="confirmMatchingAnswer()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-sm">
                        تأكيد التوصيل 🔒
                    </button>
                ` : ''}
            `;
        }

        function renderFeedbackBox(q) {
            const isCorrect = gameState.lastAnswerCorrect;
            return `
                <div class="mt-6 p-4 rounded-xl border ${isCorrect ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-200' : 'bg-red-950/40 border-red-500/40 text-red-200'} space-y-2 animate-pulseSlow">
                    <div class="font-bold text-base">
                        ${isCorrect ? '🎉 دليل صحيح! +100 نقطة' : '🔎 الدليل غير مكتمل'}
                    </div>
                    <div>
                        <span class="font-semibold text-xs opacity-80 block mb-1">لماذا؟</span>
                        <p class="text-xs md:text-sm leading-relaxed">${q.explanation}</p>
                    </div>
                    <div class="pt-2">
                        <button onclick="nextQuestion()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-sm">
                            متابعة التحقيق ➔
                        </button>
                    </div>
                </div>
            `;
        }

        function renderFinishedScreen() {
            const percentage = Math.round((gameState.correctAnswersCount / 10) * 100);
            let rankTitle = "🌟 محقق تحت التدريب";
            if (percentage >= 90) rankTitle = "🧠 عبقري العلوم";
            else if (percentage >= 80) rankTitle = "🔬 خبير علمي";
            else if (percentage >= 70) rankTitle = "🕵️ محقق علمي متميز";
            else if (percentage >= 60) rankTitle = "🔎 مستكشف المعرفة";

            const investigatorName = gameState.mode === 'solo' ? gameState.playerName : gameState.teams[gameState.currentTeamIndex].name;

            return `
                <div class="lab-card rounded-2xl p-6 md:p-8 max-w-2xl w-full text-center shadow-2xl border border-blue-500/30 space-y-6">
                    <span class="text-6xl block">🔓</span>
                    <h2 class="text-2xl md:text-3xl font-black text-white">تم حل القضية بالكامل!</h2>
                    <p class="text-xs text-blue-300">تهانينا للمحقق العلمي <strong class="text-white">${investigatorName}</strong> على إنجاز التحقيق</p>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 block">النقاط الكلية</span>
                            <span class="text-xl font-bold text-amber-400">${gameState.score} / 1000</span>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 block">الإجابات الصحيحة</span>
                            <span class="text-xl font-bold text-emerald-400">${gameState.correctAnswersCount}</span>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 block">الأدلة المكتشفة</span>
                            <span class="text-xl font-bold text-cyan-400">${gameState.cluesUnlocked} / 10</span>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 block">النسبة المئوية</span>
                            <span class="text-xl font-bold text-blue-400">${percentage}%</span>
                        </div>
                    </div>

                    <div class="bg-blue-950/50 p-4 rounded-xl border border-blue-800/60">
                        <span class="text-xs text-slate-400 block mb-1">رتبة المحقق العلمي:</span>
                        <span class="text-xl font-black text-amber-300">${rankTitle}</span>
                    </div>

                    <p class="text-xs text-slate-400">يمكنك إعادة التحقيق واكتشاف أدلة جديدة أو مراجعة الأسئلة العلمية!</p>

                    <div class="flex flex-col md:flex-row gap-3 justify-center pt-2">
                        <button onclick="playSound('click'); setGameStatus('REVIEW')" class="py-3 px-6 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold rounded-xl text-sm transition">
                            📋 مراجعة التحقيق والأدلة
                        </button>
                        <button onclick="playSound('click'); restartGame()" class="py-3 px-6 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition shadow-lg">
                            🔄 العب من جديد
                        </button>
                    </div>
                </div>
            `;
        }

        function renderReviewScreen() {
            return `
                <div class="lab-card rounded-2xl p-6 md:p-8 max-w-4xl w-full space-y-6 border border-blue-500/30">
                    <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                        <h3 class="text-xl font-bold text-white">📋 سجل مراجعة التحقيق والأدلة العلمية</h3>
                        <button onclick="playSound('click'); setGameStatus('FINISHED')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300">العودة للنتائج</button>
                    </div>

                    <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                        ${gameState.questionResults.map((res, index) => `
                            <div class="bg-slate-900/90 border ${res.correct ? 'border-emerald-500/40' : 'border-red-500/40'} p-4 rounded-xl space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="font-bold text-blue-300">السؤال ${index + 1}: ${res.title}</span>
                                    <span class="${res.correct ? 'text-emerald-400' : 'text-red-400'} font-bold">${res.correct ? '✓ صحيح (+100)' : '✗ خطأ (0)'}</span>
                                </div>
                                <p class="text-sm text-slate-200">${res.questionText}</p>
                                <div class="text-xs text-slate-400 bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-1">
                                    <p>إجابتك: <strong class="text-white">${res.userAnswerText}</strong></p>
                                    <p>الإجابة الصحيحة: <strong class="text-emerald-300">${res.correctAnswerText}</strong></p>
                                    <p class="text-blue-300 pt-1">💡 التفسير العلمي: ${res.explanation}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function setGameStatus(status) {
            gameState.status = status;
            stopTimer();
            render();
            if (status === 'QUESTION') {
                startTimer();
            }
        }

        function selectMode(mode) {
            gameState.mode = mode;
            if (mode === 'solo') {
                setGameStatus('PLAYER_SETUP');
            } else {
                setGameStatus('TEAM_SETUP');
                setTimeout(updateTeamInputs, 50);
            }
        }

        function submitPlayerName() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();
            if (!name) {
                alert('الرجاء إدخال اسم المحقق');
                return;
            }
            gameState.playerName = name;
            playSound('click');
            setGameStatus('READY');
        }

        function updateTeamInputs() {
            const count = parseInt(document.getElementById('team-count-select').value);
            const container = document.getElementById('team-inputs-container');
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `<div><input type="text" id="team-name-${i}" placeholder="اسم الفريق ${i + 1}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500" value="فريق ${i + 1}"></div>`;
            }
            container.innerHTML = html;
        }

        function submitTeams() {
            const count = parseInt(document.getElementById('team-count-select').value);
            gameState.teams = [];
            for (let i = 0; i < count; i++) {
                const name = document.getElementById(`team-name-${i}`).value.trim() || `فريق ${i + 1}`;
                gameState.teams.push({ name: name, score: 0 });
            }
            gameState.currentTeamIndex = 0;
            playSound('click');
            setGameStatus('READY');
        }

        function startInvestigationLoop() {
            prepareGameQuestions();
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.cluesUnlocked = 0;
            gameState.correctAnswersCount = 0;
            gameState.wrongAnswersCount = 0;
            gameState.unansweredCount = 0;
            gameState.questionResults = [];
            setGameStatus('QUESTION');
        }

        function startTimer() {
            gameState.timer = 30;
            gameState.isTimerActive = true;
            document.getElementById('stat-timer').innerText = gameState.timer;

            if (gameState.timerInterval) clearInterval(gameState.timerInterval);

            gameState.timerInterval = setInterval(() => {
                gameState.timer--;
                const timerEl = document.getElementById('stat-timer');
                if (timerEl) timerEl.innerText = gameState.timer;

                if (gameState.timer <= 0) {
                    clearInterval(gameState.timerInterval);
                    gameState.isTimerActive = false;
                    handleTimeOut();
                }
            }, 1000);
        }

        function stopTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
            gameState.isTimerActive = false;
        }

        function handleTimeOut() {
            const q = questionsData[gameState.currentQuestionIndex];
            gameState.lastAnswerCorrect = false;
            gameState.wrongAnswersCount++;
            gameState.unansweredCount++;
            gameState.selectedOptionId = null;

            gameState.questionResults.push({
                title: q.title,
                questionText: q.questionText,
                userAnswerText: 'انتهى الوقت دون إجابة',
                correctAnswerText: q.options ? q.options.find(o => o.id === q.correctOptionId).text : 'الإجابة العلمية الصحيحة',
                explanation: q.explanation,
                correct: false
            });

            playSound('error');
            setGameStatus('FEEDBACK');
        }

        function selectOption(optionId) {
            gameState.selectedOptionId = optionId;
            playSound('click');
            render();
        }

        function confirmAnswer() {
            if (!gameState.selectedOptionId) {
                alert('الرجاء اختيار إجابة أولاً');
                return;
            }
            stopTimer();

            const q = questionsData[gameState.currentQuestionIndex];
            const isCorrect = gameState.selectedOptionId === q.correctOptionId;
            gameState.lastAnswerCorrect = isCorrect;

            let userAnswerText = q.options.find(o => o.id === gameState.selectedOptionId).text;
            let correctAnswerText = q.options.find(o => o.id === q.correctOptionId).text;

            if (isCorrect) {
                gameState.score += 100;
                gameState.cluesUnlocked++;
                gameState.correctAnswersCount++;
                playSound('success');
                playSound('clue');
            } else {
                gameState.wrongAnswersCount++;
                playSound('error');
            }

            gameState.questionResults.push({
                title: q.title,
                questionText: q.questionText,
                userAnswerText: userAnswerText,
                correctAnswerText: correctAnswerText,
                explanation: q.explanation,
                correct: isCorrect
            });

            setGameStatus('FEEDBACK');
        }

        function moveSortingItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= gameState.sortingOrder.length) return;
            const temp = gameState.sortingOrder[index];
            gameState.sortingOrder[index] = gameState.sortingOrder[newIndex];
            gameState.sortingOrder[newIndex] = temp;
            playSound('click');
            render();
        }

        function confirmSortingAnswer() {
            stopTimer();
            const q = questionsData[gameState.currentQuestionIndex];
            const isCorrect = JSON.stringify(gameState.sortingOrder) === JSON.stringify(q.correctOrder);
            gameState.lastAnswerCorrect = isCorrect;

            if (isCorrect) {
                gameState.score += 100;
                gameState.cluesUnlocked++;
                gameState.correctAnswersCount++;
                playSound('success');
                playSound('clue');
            } else {
                gameState.wrongAnswersCount++;
                playSound('error');
            }

            gameState.questionResults.push({
                title: q.title,
                questionText: q.questionText,
                userAnswerText: 'ترتيب تسلسلي مقترن',
                correctAnswerText: 'الترتيب العلمي السليم',
                explanation: q.explanation,
                correct: isCorrect
            });

            setGameStatus('FEEDBACK');
        }

        function selectMatchingLeft(leftId) {
            gameState.tempLeftSelected = leftId;
            playSound('click');
            render();
        }

        function createMatch(leftId, rightId) {
            gameState.matchingPairs[leftId] = rightId;
            gameState.tempLeftSelected = null;
            playSound('click');
            render();
        }

        function cancelMatch(leftId) {
            delete gameState.matchingPairs[leftId];
            playSound('click');
            render();
        }

        function confirmMatchingAnswer() {
            stopTimer();
            const q = questionsData[gameState.currentQuestionIndex];
            let isCorrect = true;
            for (let key of Object.keys(q.correctPairs)) {
                if (gameState.matchingPairs[key] !== q.correctPairs[key]) {
                    isCorrect = false;
                    break;
                }
            }
            if (Object.keys(gameState.matchingPairs).length !== Object.keys(q.correctPairs).length) {
                isCorrect = false;
            }

            gameState.lastAnswerCorrect = isCorrect;

            if (isCorrect) {
                gameState.score += 100;
                gameState.cluesUnlocked++;
                gameState.correctAnswersCount++;
                playSound('success');
                playSound('clue');
            } else {
                gameState.wrongAnswersCount++;
                playSound('error');
            }

            gameState.questionResults.push({
                title: q.title,
                questionText: q.questionText,
                userAnswerText: 'توصيل الأدلة العلمية',
                correctAnswerText: 'المطابقة الصحيحة',
                explanation: q.explanation,
                correct: isCorrect
            });

            setGameStatus('FEEDBACK');
        }

        function nextQuestion() {
            gameState.currentQuestionIndex++;
            gameState.selectedOptionId = null;
            gameState.sortingOrder = [];
            gameState.matchingPairs = {};
            gameState.tempLeftSelected = null;

            if (gameState.mode === 'teams' && gameState.teams.length > 0) {
                gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
            }

            if (gameState.currentQuestionIndex >= questionsData.length) {
                playSound('solve');
                setGameStatus('FINISHED');
            } else {
                setGameStatus('QUESTION');
            }
        }

        function restartGame() {
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.cluesUnlocked = 0;
            gameState.selectedOptionId = null;
            gameState.sortingOrder = [];
            gameState.matchingPairs = {};
            gameState.questionResults = [];
            setGameStatus('START');
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
