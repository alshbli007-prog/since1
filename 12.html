        // --- مولد الأصوات عبر Web Audio API ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (window.reduceMotion) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'boxOpen') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(500, now + 0.1);
                osc.frequency.setValueAtTime(700, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(120, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'star') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'win') {
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const nOsc = audioCtx.createOscillator();
                    const nGain = audioCtx.createGain();
                    nOsc.connect(nGain);
                    nGain.connect(audioCtx.destination);
                    nOsc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    nGain.gain.setValueAtTime(0.2, now + idx * 0.12);
                    nGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
                    nOsc.start(now + idx * 0.12);
                    nOsc.stop(now + idx * 0.12 + 0.3);
                });
            }
        }

                <div class="flex-1 flex flex-col items-center justify-center p-4 max-w-xl mx-auto w-full animate-fade-in text-center">
                    <div class="bg-slate-800/90 border border-emerald-500/40 rounded-2xl p-6 w-full shadow-2xl">
                        <div class="text-5xl mb-2">🎉</div>
                        <h2 class="text-3xl font-black text-white mb-1">اكتملت دورة الحياة بنجاح!</h2>
                        <p class="text-sm text-emerald-300 mb-4">${gameState.mode === 'solo' ? gameState.playerName : 'جميع الفرق المشاركة'}</p>

                        <div class="bg-slate-900/80 rounded-xl p-4 border border-slate-700 mb-6 grid grid-cols-2 gap-4 text-right">
                            <div>
                                <p class="text-xs text-slate-400">إجمالي النقاط:</p>
                                <p class="text-xl font-bold text-amber-400">${gameState.score} / 1000</p>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400">النجوم المكتسبة:</p>
                                <p class="text-xl font-bold text-emerald-400">⭐ ${gameState.stars} / 10</p>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400">نسبة النجاح:</p>
                                <p class="text-xl font-bold text-teal-300">${percentage}%</p>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400">الرتبة العلمية:</p>
                                <p class="text-sm font-bold ${rankColor}">${rankTitle}</p>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-3">
                            <button onclick="setScreen('REVIEW')" class="flex-1 bg-teal-700 hover:bg-teal-600 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                                🔎 مراجعة التحديات
                            </button>
                            <button onclick="startNewSession()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                                🔄 العب من جديد
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }
            else if (gameState.screen === 'REVIEW') {
                html = `
                <div class="flex-1 flex flex-col items-center justify-center p-4 max-w-3xl mx-auto w-full animate-fade-in">
                    <div class="bg-slate-800/90 border border-emerald-500/40 rounded-2xl p-6 w-full shadow-2xl mb-4">
                        <h2 class="text-2xl font-bold text-emerald-400 mb-2 text-center">🔎 مراجعة التحديات والمفاهيم</h2>
                        <p class="text-xs text-slate-300 text-center mb-6">استعرض الأسئلة والإجابات الصحيحة والتفسيرات العلمية لتثبيت معلوماتك.</p>

                        <div class="flex flex-col gap-4 max-h-[60vh] overflow-y-auto pr-2">
                            ${gameState.answersLog.map((log, idx) => `
                                <div class="bg-slate-900/80 border ${log.correct ? 'border-emerald-500/40' : 'border-rose-500/40'} rounded-xl p-4">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-xs font-bold text-emerald-300">السؤال ${idx + 1}: ${log.concept}</span>
                                        <span class="text-sm">${log.correct ? '✅ صحيح' : '❌ غير صحيح'}</span>
                                    </div>
                                    <p class="text-sm font-semibold text-white mb-2">${log.question}</p>
                                    <div class="text-xs text-slate-300 bg-slate-800/60 p-2 rounded-lg mb-1">
                                        <span class="text-emerald-400 font-bold">الإجابة الصحيحة:</span> ${log.correctAnswerText}
                                    </div>
                                    <div class="text-xs text-slate-400 italic">
                                        💡 ${log.explanation}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="mt-6 flex justify-center">
                            <button onclick="setScreen('FINISHED')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition">
                                العودة لنتيجة المغامرة
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }

            app.innerHTML = html;
        }

        function updateTeamInputs(count) {
            const container = document.getElementById('teamNamesContainer');
            const defaultNames = ["فريق البراعم 🌱", "فريق الزهور 🌼", "فريق الثمار 🍅", "فريق البذور 🌰"];
            let html = '';
            for (let i = 0; i < parseInt(count); i++) {
                html += `<input type="text" class="team-name-input bg-slate-900 border border-teal-500/50 rounded-xl px-4 py-2.5 text-white" value="${defaultNames[i]}">`;
            }
            container.innerHTML = html;
        }

        function confirmSetupAndStart() {
            if (gameState.mode === 'solo') {
                const nameInput = document.getElementById('playerNameInput');
                if (nameInput && nameInput.value.trim() !== '') {
                    gameState.playerName = nameInput.value.trim();
                }
            } else {
                const inputs = document.querySelectorAll('.team-name-input');
                gameState.teams = Array.from(inputs).map((inp, idx) => ({
                    id: idx,
                    name: inp.value.trim() || `فريق ${idx + 1}`,
                    score: 0
                }));
            }
            const timerToggle = document.getElementById('timerEnabledToggle');
            if (timerToggle) {
                gameState.timerEnabled = timerToggle.checked;
            }
            startNewSession();
        }

        function openBox(boxNum) {
            if (gameState.openedBoxes.includes(boxNum)) return;
            gameState.openedBoxes.push(boxNum);

            playSound('boxOpen');
            gameState.selectedBox = boxNum;
            gameState.screen = 'QUESTION';
            gameState.selectedAnswer = null;
            gameState.timeRemaining = 30;
            
            render();

            if (gameState.timerEnabled) {
                if (gameState.timerInterval) clearInterval(gameState.timerInterval);
                gameState.timerInterval = setInterval(() => {
                    gameState.timeRemaining--;
                    const timeEl = document.getElementById('timeLeft');
                    if (timeEl) timeEl.textContent = gameState.timeRemaining;
                    if (gameState.timeRemaining <= 0) {
                        clearInterval(gameState.timerInterval);
                        handleAnswerSubmission(null, true);
                    }
                }, 1000);
            }
        }

        function renderStandardOptions(q) {
            const shuffledOpts = [...q.options].sort(() => 0.5 - Math.random());
            return `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                    ${shuffledOpts.map(opt => `
                        <button onclick="handleAnswerSubmission('${opt.id}')" class="bg-slate-900/80 hover:bg-emerald-950/60 border border-emerald-500/30 hover:border-emerald-400 text-white font-medium p-4 rounded-xl transition text-right shadow flex items-center justify-between group">
                            <span>${opt.text}</span>
                            <span class="w-6 h-6 rounded-full bg-slate-800 text-emerald-400 flex items-center justify-center text-xs group-hover:bg-emerald-600 group-hover:text-white transition">${opt.id}</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function renderMatchingQuestion(q) {
            if (!gameState.matchPairs || gameState.matchPairs.length === 0) {
                gameState.matchPairs = [...q.pairs];
                gameState.userMatches = {};
                gameState.matchLeft = null;
            }
            const rightOptions = [...q.pairs].map(p => p.a).sort(() => 0.5 - Math.random());

            return `
                <div class="flex flex-col gap-4 my-2">
                    <p class="text-xs text-slate-300 bg-slate-900/60 p-2 rounded-lg">اختر عنصراً من اليمين ثم العنصر المطابق له من اليسار:</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <span class="text-xs font-bold text-emerald-300">العناصر:</span>
                            ${q.pairs.map((p, idx) => `
                                <button onclick="selectMatchLeft(${idx})" class="p-3 rounded-xl border text-right font-bold text-sm transition ${gameState.matchLeft === idx ? 'bg-emerald-600 border-white' : gameState.userMatches[idx] !== undefined ? 'bg-teal-900/60 border-teal-500' : 'bg-slate-900 border-slate-700 hover:border-emerald-400'}">
                                    ${p.q} ${gameState.userMatches[idx] !== undefined ? ` ➔ (${gameState.userMatches[idx]})` : ''}
                                </button>
                            `).join('')}
                        </div>
                        <div class="flex flex-col gap-2">
                            <span class="text-xs font-bold text-teal-300">الخيارات المطابقة:</span>
                            ${rightOptions.map(ans => `
                                <button onclick="selectMatchRight('${ans}')" class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-teal-400 text-right font-medium text-sm transition">
                                    ${ans}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    <button onclick="submitMatchingAnswer()" class="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow">
                        ✅ تأكيد الإجابة
                    </button>
                </div>
            `;
        }

        function selectMatchLeft(idx) {
            gameState.matchLeft = idx;
            render();
        }

        function selectMatchRight(ans) {
            if (gameState.matchLeft !== null) {
                gameState.userMatches[gameState.matchLeft] = ans;
                gameState.matchLeft = null;
                playSound('star');
                render();
            }
        }

        function submitMatchingAnswer() {
            const q = gameState.activeQuestions[gameState.currentQuestionIndex];
            let allCorrect = true;
            q.pairs.forEach((p, idx) => {
                if (gameState.userMatches[idx] !== p.a) allCorrect = false;
            });
            handleAnswerSubmissionResult(allCorrect, q);
        }

        function renderSortingQuestion(q) {
            if (!gameState.sortItems || gameState.sortItems.length === 0) {
                gameState.sortItems = [...q.items].map((text, originalIndex) => ({ text, originalIndex })).sort(() => 0.5 - Math.random());
            }

            return `
                <div class="flex flex-col gap-3 my-2">
                    <p class="text-xs text-slate-300 bg-slate-900/60 p-2 rounded-lg">استخدم أزرار التحريك (⬆⬇) لترتيب الخطوات بالتسلسل الصحيح:</p>
                    <div class="flex flex-col gap-2">
                        ${gameState.sortItems.map((item, idx) => `
                            <div class="bg-slate-900 border border-emerald-500/40 p-3 rounded-xl flex items-center justify-between">
                                <span class="font-bold text-sm text-emerald-200">${idx + 1}. ${item.text}</span>
                                <div class="flex gap-2">
                                    <button onclick="moveSortItem(${idx}, -1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-emerald-700 text-white flex items-center justify-center font-bold">⬆</button>
                                    <button onclick="moveSortItem(${idx}, 1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-emerald-700 text-white flex items-center justify-center font-bold">⬇</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="submitSortingAnswer()" class="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow">
                        ✅ تأكيد الإجابة
                    </button>
                </div>
            `;
        }

        function moveSortItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < gameState.sortItems.length) {
                const temp = gameState.sortItems[index];
                gameState.sortItems[index] = gameState.sortItems[newIndex];
                gameState.sortItems[newIndex] = temp;
                playSound('star');
                render();
            }
        }

        function submitSortingAnswer() {
            const q = gameState.activeQuestions[gameState.currentQuestionIndex];
            let isCorrect = true;
            gameState.sortItems.forEach((item, idx) => {
                if (item.originalIndex !== q.correctOrder[idx]) isCorrect = false;
            });
            handleAnswerSubmissionResult(isCorrect, q);
        }

        function handleAnswerSubmission(optionId, isTimeout = false) {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            const q = gameState.activeQuestions[gameState.currentQuestionIndex];
            
            let isCorrect = false;
            let correctOption = q.options.find(o => o.correct);
            let correctText = correctOption ? correctOption.text : "";

            if (!isTimeout && optionId) {
                const selected = q.options.find(o => o.id === optionId);
                if (selected && selected.correct) {
                    isCorrect = true;
                }
            }

            handleAnswerSubmissionResult(isCorrect, q, correctText);
        }

        function handleAnswerSubmissionResult(isCorrect, q, customCorrectText = "") {
            gameState.isCorrect = isCorrect;
            
            if (isCorrect) {
                gameState.score += 100;
                gameState.stars += 1;
                if (gameState.mode === 'team' && gameState.teams.length > 0) {
                    gameState.teams[gameState.currentTeamIndex].score += 100;
                }
                playSound('correct');
            } else {
                playSound('wrong');
            }

            const correctOpt = q.options ? q.options.find(o => o.correct) : null;
            const correctText = customCorrectText || (correctOpt ? correctOpt.text : "الترتيب أو المطابقة الصحيحة الموضحة بالأعلى");

            gameState.answersLog.push({
                question: q.question,
                correct: isCorrect,
                correctAnswerText: correctText,
                explanation: q.explanation,
                concept: q.concept
            });

            gameState.screen = 'FEEDBACK';
            render();
        }

        function proceedToNext() {
            gameState.matchPairs = [];
            gameState.sortItems = [];
            gameState.currentQuestionIndex++;

            if (gameState.mode === 'team' && gameState.teams.length > 0) {
                gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
            }

            if (gameState.currentQuestionIndex >= 10) {
                gameState.screen = 'FINISHED';
                playSound('win');
            } else {
                gameState.screen = 'BOX_SELECTION';
            }
            render();
        }

        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
