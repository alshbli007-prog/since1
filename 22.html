    <script>
        const SoundEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            },
            play(type) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (type === 'click') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                    } else if (type === 'correct') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(523.25, now);
                        osc.frequency.setValueAtTime(659.25, now + 0.1);
                        osc.frequency.setValueAtTime(783.99, now + 0.2);
                        osc.frequency.setValueAtTime(1046.50, now + 0.3);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                        osc.start(now);
                        osc.stop(now + 0.6);
                    } else if (type === 'incorrect') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(220, now);
                        osc.frequency.linearRampToValueAtTime(130, now + 0.25);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                    } else if (type === 'win') {
                        const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.50];
                        notes.forEach((freq, idx) => {
                            const o = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            o.connect(g);
                            g.connect(this.ctx.destination);
                            o.frequency.setValueAtTime(freq, now + idx * 0.08);
                            g.gain.setValueAtTime(0.15, now + idx * 0.08);
                            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                            o.start(now + idx * 0.08);
                            o.stop(now + idx * 0.08 + 0.2);
                        });
                    }
                } catch(e) { console.log('Audio error:', e); }
            }
        };

            document.getElementById('modal-icon').innerText = icon;

            document.getElementById('modal-text').innerText = text;
            const btn = document.getElementById('modal-btn');
            btn.onclick = () => {
                closeModal();
                if (callback) callback();
            };
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
            SoundEngine.play('win');
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        function startTeamGame() {
            GameState.teams = [];
            for (let i = 0; i < GameState.teamCount; i++) {
                const nameInput = document.getElementById(`team-name-${i}`);
                GameState.teams.push({
                    name: nameInput ? nameInput.value : `فريق ${i+1}`,
                    score: 0,
                    stars: 0
                });
            }
            GameState.currentTeamIndex = 0;
            startCountdown(GameState.teams[0].name);
        }

        function startCountdown(identifier) {
            GameState.state = 'COUNTDOWN';
            if (GameState.mode === 'solo') {
                GameState.playerName = identifier;
            }
            
            GameState.currentQuestionIndex = 0;
            GameState.score = 0;
            GameState.stars = 0;
            GameState.correctCount = 0;
            GameState.incorrectCount = 0;
            GameState.unansweredCount = 0;
            GameState.userAnswersHistory = [];
            GameState.lifelines = { labHelp: true, expertOpinion: true, scientistHint: true };
            
            // Pick exactly 10 questions randomly from MASTER_QUESTION_BANK
            let shuffledBank = [...MASTER_QUESTION_BANK].sort(() => Math.random() - 0.5);
            GameState.questions = shuffledBank.slice(0, 10);

            const container = document.getElementById('main-container');
            let count = 3;

            container.innerHTML = `

                    <p class="text-slate-400 text-sm mt-6">استعد للتركيز والتفكير العلمي الدقيق...</p>
                </div>
            `;

            SoundEngine.play('click');
            const timer = setInterval(() => {
                count--;
                const numEl = document.getElementById('countdown-number');
                if (count > 0) {
                    if (numEl) numEl.innerText = count;
                    SoundEngine.play('click');
                } else if (count === 0) {
                    if (numEl) numEl.innerText = '🚀 انطلق!';
                    SoundEngine.play('correct');
                } else {
                    clearInterval(timer);
                    renderQuestionScreen();
                }
            }, 1000);
        }

                        <p class="text-xs text-cyan-300 font-semibold text-center">موقف استقصائي علمي للصف الخامس</p>
                    </div>
                `;
            }
        }

        function renderAnswerOptionsForQuestion(q) {
            if (q.type === 'matching_interactive') {
                if (!q._shuffledPairsMatch) {
                    q._shuffledPairsMatch = [...q.pairs].sort(() => Math.random() - 0.5);
                }
                const pairs = q.pairs;
                const shuffledMatches = q._shuffledPairsMatch;

                let connectionsHtml = '';
                const connectedEntries = Object.entries(GameState.matchingState.connections);
                if (connectedEntries.length > 0) {
                    connectionsHtml = `
                        <div class="w-full bg-slate-950 p-3 rounded-xl border border-cyan-500/40 mb-3 shadow-md">
                            <p class="text-xs font-bold text-cyan-300 mb-2">🔗 التوصيلات الحالية (انقر على زر الإلغاء للتعديل):</p>
                            <div class="flex flex-col gap-2">
                                ${connectedEntries.map(([termId, defId]) => {
                                    const termObj = pairs.find(p => p.id === termId);
                                    const defObj = pairs.find(p => p.id === defId);
                                    return `
                                        <div class="flex items-center justify-between bg-cyan-950/60 border border-cyan-500/30 px-3 py-2 rounded-xl text-xs text-cyan-200">
                                            <span class="font-bold">"${termObj ? termObj.term : ''}" ⟷ "${defObj ? defObj.match : ''}"</span>
                                            <button onclick="cancelMatchingConnection('${termId}')" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-bold transition-all shadow">
                                                ✕ إلغاء التوصيل
                                            </button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="flex flex-col gap-3">
                        ${connectionsHtml}
                        <p class="text-xs text-slate-300">1. انقر على مصطلح من القائمة الأولى • 2. انقر على تعريفه المناسب:</p>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="flex flex-col gap-2">
                                <p class="text-xs font-bold text-cyan-400">المصطلحات:</p>
                                ${pairs.map(p => {
                                    const isConnected = GameState.matchingState.connections[p.id] !== undefined;
                                    const isSelected = GameState.matchingState.selectedTerm === p.id;
                                    let btnClass = "p-2.5 rounded-xl bg-slate-900 border text-xs font-bold text-slate-200 text-right transition-all ";
                                    if (isConnected) btnClass += "border-emerald-400 bg-emerald-950/40 text-emerald-300";
                                    else if (isSelected) btnClass += "border-cyan-400 bg-cyan-950 shadow-[0_0_10px_rgba(6,182,212,0.5)]";
                                    else btnClass += "border-slate-700 hover:border-cyan-400";
                                    return `
                                        <button onclick="selectMatchingTerm('${p.id}', 'term')" id="match-term-${p.id}" class="${btnClass}">
                                            ${p.term} ${isConnected ? ' ✓' : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                            <div class="flex flex-col gap-2">
                                <p class="text-xs font-bold text-amber-400">التعريفات:</p>
                                ${shuffledMatches.map(p => {
                                    const isDefConnected = Object.values(GameState.matchingState.connections).includes(p.id);
                                    let defClass = "p-2.5 rounded-xl bg-slate-900 border text-xs font-semibold text-slate-300 text-right transition-all ";
                                    if (isDefConnected) defClass += "border-emerald-400 bg-emerald-950/40 text-emerald-200";
                                    else defClass += "border-slate-700 hover:border-amber-400";
                                    return `
                                        <button onclick="selectMatchingTerm('${p.id}', 'match')" id="match-def-${p.id}" class="${defClass}">
                                            ${p.match} ${isDefConnected ? ' ✓' : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (q.type === 'ordering_interactive') {
                return `
                    <div class="flex flex-col gap-2">
                        <p class="text-xs text-slate-300">انقر على خطوتين لتبديل مكانيهما حتى يصبح الترتيب صحيحاً:</p>
                        <div id="ordering-list" class="flex flex-col gap-2">
                            ${GameState.orderingState.items.map((item, idx) => `
                                <div onclick="handleOrderingClick('${item.id}')" id="ord-item-${item.id}" class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-cyan-400 text-xs font-bold text-slate-200 flex items-center justify-between cursor-pointer transition-all">
                                    <span>${idx + 1}. ${item.text.replace(/^\d+\.\s*/, '')}</span>
                                    <span class="text-cyan-400">↕️ انقر للتبديل</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                return q._shuffledOptions.map((opt, idx) => `
                    <button onclick="selectOption('${opt.id}')" id="opt-btn-${opt.id}" class="option-btn w-full text-right p-3.5 rounded-xl bg-slate-900/90 border border-slate-700 hover:border-cyan-400 text-slate-200 text-sm font-semibold transition-all flex items-center justify-between group">
                        <span class="flex items-center gap-3">
                            <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold text-cyan-400">
                                ${['أ', 'ب', 'ج', 'د'][idx]}
                            </span>
                            <span>${opt.text}</span>
                        </span>
                        <span id="opt-indicator-${opt.id}" class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center"></span>
                    </button>
                `).join('');
            }
        }

        function selectMatchingTerm(id, type) {
            SoundEngine.play('click');
            const q = GameState.questions[GameState.currentQuestionIndex];
            if (type === 'term') {
                GameState.matchingState.selectedTerm = id;
            } else if (type === 'match' && GameState.matchingState.selectedTerm) {
                GameState.matchingState.connections[GameState.matchingState.selectedTerm] = id;
                GameState.matchingState.selectedTerm = null;
            }

            const optContainer = document.getElementById('interactive-options-container');
            if (optContainer) {
                optContainer.innerHTML = renderAnswerOptionsForQuestion(q);
            }

            const confirmBtn = document.getElementById('confirm-answer-btn');
            if (confirmBtn) {
                if (Object.keys(GameState.matchingState.connections).length === q.pairs.length) {
                    confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    confirmBtn.removeAttribute('disabled');
                } else {
                    confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    confirmBtn.setAttribute('disabled', 'true');
                }
            }
        }

        function cancelMatchingConnection(termId) {
            SoundEngine.play('click');
            delete GameState.matchingState.connections[termId];
            const q = GameState.questions[GameState.currentQuestionIndex];
            
            const optContainer = document.getElementById('interactive-options-container');
            if (optContainer) {
                optContainer.innerHTML = renderAnswerOptionsForQuestion(q);
            }

            const confirmBtn = document.getElementById('confirm-answer-btn');
            if (confirmBtn) {
                if (Object.keys(GameState.matchingState.connections).length === q.pairs.length) {
                    confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    confirmBtn.removeAttribute('disabled');
                } else {
                    confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    confirmBtn.setAttribute('disabled', 'true');
                }
            }
        }

        let firstOrderCardId = null;
        function handleOrderingClick(id) {
            SoundEngine.play('click');
            if (!firstOrderCardId) {
                firstOrderCardId = id;
                const el = document.getElementById(`ord-item-${id}`);
                if (el) el.classList.add('border-cyan-400', 'bg-cyan-950');
            } else {
                let items = GameState.orderingState.items;
                let idx1 = items.findIndex(x => x.id === firstOrderCardId);
                let idx2 = items.findIndex(x => x.id === id);
                if (idx1 !== -1 && idx2 !== -1) {
                    let temp = items[idx1];
                    items[idx1] = items[idx2];
                    items[idx2] = temp;
                }
                firstOrderCardId = null;
                
                const listEl = document.getElementById('ordering-list');
                if (listEl) {
                    listEl.innerHTML = items.map((item, idx) => `
                        <div onclick="handleOrderingClick('${item.id}')" id="ord-item-${item.id}" class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-cyan-400 text-xs font-bold text-slate-200 flex items-center justify-between cursor-pointer transition-all">
                            <span>${idx + 1}. ${item.text.replace(/^\d+\.\s*/, '')}</span>
                            <span class="text-cyan-400">↕️ انقر للتبديل</span>
                        </div>
                    `).join('');
                }

                const confirmBtn = document.getElementById('confirm-answer-btn');
                if (confirmBtn) {
                    confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    confirmBtn.removeAttribute('disabled');
                }
            }
        }

        function startTimerForCurrentQuestion() {
            clearInterval(GameState.timerInterval);
            GameState.timeLeft = GameState.currentQuestionIndex < 6 ? 30 : (GameState.currentQuestionIndex < 8 ? 40 : 50);
            
            const timerBox = document.getElementById('timer-box');
            const timerDisplay = document.getElementById('timer-display');
            timerBox.classList.remove('hidden');
            timerBox.classList.add('flex');
            timerDisplay.innerText = GameState.timeLeft;

            GameState.timerInterval = setInterval(() => {
                GameState.timeLeft--;
                timerDisplay.innerText = GameState.timeLeft;
                if (GameState.timeLeft <= 0) {
                    clearInterval(GameState.timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            GameState.unansweredCount++;
            GameState.userAnswersHistory.push({
                question: GameState.questions[GameState.currentQuestionIndex].title,
                userAnswer: 'انتهى الوقت (بدون إجابة)',
                correctAnswer: 'انظر الشرح العلمي',
                isCorrect: false,
                explanation: GameState.questions[GameState.currentQuestionIndex].explanation
            });
            showModal('انتهى الوقت! ⏱️', 'لم تقم بالإجابة خلال الوقت المحدد. لن تتأثر نقاطك السابقة، وسننتقل للسؤال التالي مع الشرح.', '⏰', () => {
                nextQuestionOrFinish();
            });
        }

        function selectOption(optId) {
            if (GameState.state !== 'QUESTION') return;
            SoundEngine.play('click');
            GameState.selectedOptionId = optId;

            const q = GameState.questions[GameState.currentQuestionIndex];
            q._shuffledOptions.forEach(opt => {
                const btn = document.getElementById(`opt-btn-${opt.id}`);
                const indicator = document.getElementById(`opt-indicator-${opt.id}`);
                if (btn) {
                    if (opt.id === optId) {
                        btn.className = "option-btn w-full text-right p-3.5 rounded-xl bg-cyan-950/80 border-2 border-cyan-400 text-cyan-200 text-sm font-bold transition-all flex items-center justify-between";
                        if (indicator) indicator.className = "w-4 h-4 rounded-full bg-cyan-400 flex items-center justify-center";
                    } else {
                        btn.className = "option-btn w-full text-right p-3.5 rounded-xl bg-slate-900/90 border border-slate-700 hover:border-cyan-400 text-slate-200 text-sm font-semibold transition-all flex items-center justify-between";
                        if (indicator) indicator.className = "w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center";
                    }
                }
            });

            const confirmBtn = document.getElementById('confirm-answer-btn');
            if (confirmBtn) {
                confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                confirmBtn.removeAttribute('disabled');
            }
        }

        function useLifeline(type) {
            if (!GameState.lifelines[type]) return;
            const q = GameState.questions[GameState.currentQuestionIndex];
            if (type === 'labHelp' && q.type !== 'multiple_choice_img') return;

            GameState.lifelines[type] = false;
            SoundEngine.play('correct');

            if (type === 'labHelp') {
                const incorrectOpts = q.options.filter(o => !o.correct);
                if (incorrectOpts.length >= 2) {
                    const toEliminate = [incorrectOpts[0].id, incorrectOpts[1].id];
                    toEliminate.forEach(id => {
                        const btn = document.getElementById(`opt-btn-${id}`);
                        if (btn) {
                            btn.style.opacity = '0.3';
                            btn.style.pointerEvents = 'none';
                        }
                    });
                }
                showModal('🔬 مساعدة المختبر', 'تم حذف خيارين خاطئين من الخيارات المتاحة!', '🧪');
            } else if (type === 'expertOpinion') {
                showModal('🧠 رأي الخبراء', `يعتقد خبراء المختبر أن الإجابة الصحيحة مرتبطة بـ: "${q.concept}" — ركز في الشرح العلمي.`, '💡');
            } else if (type === 'scientistHint') {
                showModal('💡 تلميح العالم', `تلميح علمي: تذكر أن المذيب يذيب المذاب، والتبخر يعتمد على مساحة السطح والحرارة والحركة.`, '🔍');
            }

            const btnEl = document.getElementById(`ll-${type === 'labHelp' ? 'lab' : (type === 'expertOpinion' ? 'expert' : 'hint')}`);
            if (btnEl) {
                btnEl.classList.add('opacity-40', 'cursor-not-allowed');
            }
        }

        function confirmAnswer() {
            if (GameState.state !== 'QUESTION') return;
            clearInterval(GameState.timerInterval);
            GameState.state = 'FEEDBACK';

            const q = GameState.questions[GameState.currentQuestionIndex];
            let isCorrect = false;
            let userAnswerText = '';
            let correctAnswerText = '';

            if (q.type === 'matching_interactive') {
                userAnswerText = 'توصيل المصطلحات';
                correctAnswerText = 'التوصيل الصحيح للمفاهيم';
                let correctCountMatch = 0;
                q.pairs.forEach(p => {
                    if (GameState.matchingState.connections[p.id] === p.id) correctCountMatch++;
                });
                isCorrect = (correctCountMatch === q.pairs.length);
            } else if (q.type === 'ordering_interactive') {
                userAnswerText = 'ترتيب الخطوات';
                correctAnswerText = q.correctOrder.join(' ← ');
                let currentOrderIds = GameState.orderingState.items.map(x => x.id);
                isCorrect = true;
                for (let i = 0; i < q.correctOrder.length; i++) {
                    if (currentOrderIds[i] !== q.correctOrder[i]) {
                        isCorrect = false;
                        break;
                    }
                }
            } else {
                const selectedOpt = q.options.find(o => o.id === GameState.selectedOptionId);
                userAnswerText = selectedOpt ? selectedOpt.text : 'لم يُختر شيء';
                const correctOptObj = q.options.find(o => o.correct);
                correctAnswerText = correctOptObj ? correctOptObj.text : '';
                isCorrect = selectedOpt ? selectedOpt.correct : false;
            }

            const pointsEarned = QUESTION_POINTS[GameState.currentQuestionIndex];

            if (isCorrect) {
                GameState.correctCount++;
                GameState.score += pointsEarned;
                GameState.stars += 1;
                if (GameState.mode === 'team') {
                    GameState.teams[GameState.currentTeamIndex].score += pointsEarned;
                    GameState.teams[GameState.currentTeamIndex].stars += 1;
                }
                SoundEngine.play('correct');
            } else {
                GameState.incorrectCount++;
                SoundEngine.play('incorrect');
            }

            GameState.userAnswersHistory.push({
                question: q.title,
                userAnswer: userAnswerText,
                correctAnswer: correctAnswerText,
                isCorrect: isCorrect,
                explanation: q.explanation
            });

            const title = isCorrect ? '🎉 إجابة صحيحة وبطل!' : '❌ إجابة غير دقيقة';
            const icon = isCorrect ? '🌟' : '💡';
            const msg = `${isCorrect ? `أحسنت! لقد ربحت ${pointsEarned} نقطة ونجمة ذهبية.` : 'للأسف، الإجابة غير صحيحة. التحدي مستمر ولن تنتهي اللعبة.'}\n\n📖 لماذا؟\n${q.explanation}`;

            showModal(title, msg, icon, () => {
                nextQuestionOrFinish();
            });
        }

        function nextQuestionOrFinish() {
            GameState.currentQuestionIndex++;
            if (GameState.mode === 'team') {
                GameState.currentTeamIndex = (GameState.currentTeamIndex + 1) % GameState.teams.length;
            }

            if (GameState.currentQuestionIndex >= 10 || GameState.currentQuestionIndex >= GameState.questions.length) {
                renderFinishScreen();
            } else {
                renderQuestionScreen();
            }
        }

        function updateHeaderDisplay() {
            const statusDisplay = document.getElementById('player-status-display');
            const headerStars = document.getElementById('header-stars');
            const headerScore = document.getElementById('header-score');

            if (GameState.mode === 'solo') {
                statusDisplay.innerText = `البطل: ${GameState.playerName} • سلطنة عمان`;
                headerStars.innerText = GameState.stars;
                headerScore.innerText = GameState.score;
            } else {
                const currentTeam = GameState.teams[GameState.currentTeamIndex];
                statusDisplay.innerText = `دور: ${currentTeam.name} • الفريق ${GameState.currentTeamIndex + 1}`;
                headerStars.innerText = currentTeam.stars;
                headerScore.innerText = currentTeam.score;
            }
        }

        function renderFinishScreen() {
            GameState.state = 'FINISHED';
            document.getElementById('main-header').classList.add('hidden');
            SoundEngine.play('win');

            const container = document.getElementById('main-container');
            const percentage = Math.round((GameState.correctCount / 10) * 100);

            let rankTitle = '🚀 متدرب العلوم';
            if (percentage >= 90) rankTitle = '🏆 عبقري العلوم';
            else if (percentage >= 80) rankTitle = '🥇 خبير علمي';
            else if (percentage >= 70) rankTitle = '🔬 عالم واعد';
            else if (percentage >= 60) rankTitle = '🧠 مستكشف المعرفة';

            container.innerHTML = `
                <div class="w-full max-w-2xl mx-auto glass-panel p-6 sm:p-8 rounded-3xl text-center">
                    <div class="text-6xl mb-3">🏆</div>
                    <h2 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-cyan-300 gold-glow mb-2">
                        انتهى تحدي المليون العلمي!
                    </h2>
                    <p class="text-cyan-200 text-base font-bold mb-6">${GameState.mode === 'solo' ? GameState.playerName : 'المسابقة الجماعية للفرق'}</p>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                        <div class="bg-slate-900/80 border border-cyan-500/30 p-3 rounded-2xl">
                            <p class="text-xs text-slate-400">إجمالي النقاط</p>
                            <p class="text-xl font-black text-cyan-300">${GameState.score} <span class="text-xs">نقطة</span></p>
                        </div>
                        <div class="bg-slate-900/80 border border-amber-500/30 p-3 rounded-2xl">
                            <p class="text-xs text-slate-400">النجوم المكتسبة</p>
                            <p class="text-xl font-black text-amber-300">⭐ ${GameState.stars}</p>
                        </div>
                        <div class="bg-slate-900/80 border border-emerald-500/30 p-3 rounded-2xl">
                            <p class="text-xs text-slate-400">الإجابات الصحيحة</p>
                            <p class="text-xl font-black text-emerald-300">${GameState.correctCount} / 10</p>
                        </div>
                        <div class="bg-slate-900/80 border border-blue-500/30 p-3 rounded-2xl">
                            <p class="text-xs text-slate-400">النسبة المئوية</p>
                            <p class="text-xl font-black text-blue-300">${percentage}%</p>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-cyan-900/50 to-blue-900/50 border border-cyan-400/40 p-4 rounded-2xl mb-6">
                        <p class="text-xs text-cyan-300 mb-1">الرتبة العلمية المستحقة:</p>
                        <h3 class="text-xl font-black text-amber-300">${rankTitle}</h3>
                    </div>

                    <div class="flex flex-wrap justify-center gap-3">
                        <button onclick="SoundEngine.play('click'); renderReviewScreen();" class="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold rounded-xl text-sm transition-all border border-cyan-500/30">
                            📖 مراجعة الإجابات
                        </button>
                        <button onclick="SoundEngine.play('click'); renderStartScreen();" class="flex-1 py-3 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg">
                            🔄 العب من جديد
                        </button>
                    </div>
                </div>
            `;
        }

        function renderReviewScreen() {
            GameState.state = 'REVIEW';
            const container = document.getElementById('main-container');

            container.innerHTML = `
                <div class="w-full max-w-4xl mx-auto glass-panel p-6 rounded-3xl flex flex-col gap-4">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-xl font-black text-cyan-300">📖 مراجعة الإجابات والتفسير العلمي</h2>
                        <button onclick="SoundEngine.play('click'); renderFinishScreen();" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold">
                            ← العودة للنتائج
                        </button>
                    </div>

                    <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                        ${GameState.userAnswersHistory.map((h, i) => `
                            <div class="bg-slate-900/90 border ${h.isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'} p-4 rounded-2xl flex flex-col gap-2">
                                <div class="flex justify-between items-start">
                                    <h3 class="text-sm font-bold text-cyan-200">س${i+1}: ${h.question}</h3>
                                    <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold ${h.isCorrect ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'}">
                                        ${h.isCorrect ? 'صحيح ✓' : 'خاطئ ✗'}
                                    </span>
                                </div>
                                <div class="text-xs grid grid-cols-1 sm:grid-cols-2 gap-2 mt-1">
                                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
                                        <span class="text-slate-400 block mb-0.5">إجابتك:</span>
                                        <span class="${h.isCorrect ? 'text-emerald-300 font-bold' : 'text-rose-300 font-bold'}">${h.userAnswer}</span>
                                    </div>
                                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
                                        <span class="text-slate-400 block mb-0.5">الإجابة الصحيحة:</span>
                                        <span class="text-cyan-300 font-bold">${h.correctAnswer}</span>
                                    </div>
                                </div>
                                <div class="bg-cyan-950/30 p-2.5 rounded-xl border border-cyan-500/20 mt-1">
                                    <span class="text-cyan-400 font-bold block mb-0.5">💡 التفسير العلمي:</span>
                                    <p class="text-slate-300 text-xs leading-relaxed">${h.explanation}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
